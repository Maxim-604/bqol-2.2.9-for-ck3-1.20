 MBQ_GR_OT_OPT_10: "Предпочитает ваше @sway_to_rite_icon! [Concept( 'rite', 'течение' )|E], затем @religious_icon! [Concept( 'faith', 'конфессию' )|E], затем @religious_icon! [Concept( 'religion', 'религию' )|E].\nТолько сортирует: только упорядочивает кандидатов, сам никого не выбирает."
