l_french:
 MBQ_GR_AUTO_HEAD: "Automatisation : céder le surplus"
 MBQ_GR_TT_AUTO_HEAD: "#T Automatisation#!\n• Un nouveau titre au-delà de vos limites va aussitôt au bénéficiaire choisi par vos préférences\n• Votre [capital|El] n’est jamais cédée"
 MBQ_GR_AUTO: "Auto activée"
 MBQ_GR_TT_AUTO: "#T Automatisation activée#!\n• Les titres au-delà de vos limites sont cédés d’eux-mêmes."
 MBQ_GR_TT_TAKT: "#T Intervalle#!\n• Fréquence à laquelle l’automatisation vérifie tout votre [domain|El]"
 MBQ_GR_ASK: "Consulter"
 MBQ_GR_TT_ASK: "#T Consulter#!\n• Biens précieux ([special_building|El], [holy_site|El]) : le jeu demande avant cession"
 MBQ_GR_WHO: "Receveurs"
 MBQ_GR_TT_WHO: "#T Bénéficiaires#!\n• Les filtres décident qui peut recevoir un titre, les préférences qui est préféré."
 MBQ_GR_PREVIEW: "Céder : jusqu’à [GetPlayer.MakeScope.Var('mbq_gr_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_gr_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_GR_TITLE_1', 'MBQ_GR_TITLE_N' )], @domain_icon! [GetPlayer.GetDomainSize]/[GetPlayer.GetDomainLimit]"
 MBQ_GR_TITLE_1: "titre"
 MBQ_GR_TITLE_N: "titres"
 MBQ_GR_TT_RUN: "#T Lancer maintenant#!\n• Cède une fois tout le surplus : comtés et baronnies\n• Grisé : rien au-delà de vos limites"
 mbq_gr_sum_title: "Titres cédés"
 mbq_gr_sum_desc: "Cédés : [ROOT.Var('mbq_gr_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_gr_n').GetValue, '(CFixedPoint)1' ), 'MBQ_GR_TITLE_1', 'MBQ_GR_TITLE_N' )][ROOT.Char.Custom('mbq_gr_s1')][ROOT.Char.Custom('mbq_gr_s2')][ROOT.Char.Custom('mbq_gr_s3')][ROOT.Char.Custom('mbq_gr_s4')][ROOT.Char.Custom('mbq_gr_s5')][ROOT.Char.Custom('mbq_gr_more')][ROOT.Char.Custom('mbq_gr_why')]"
 mbq_gr_more_line: "\net [ROOT.Var('mbq_gr_rest').GetValue|0] de plus"
 mbq_gr_none_line: "\nRien en surplus, ou personne ne convient."
 message_filter_mbq_county_summary: "Titres cédés (Better Quality of Life)"
 message_filter_mbq_county_summary_desc: "Résumé des comtés et duchés que Better Quality of Life a cédés pour vous."
 mbq_gr.0001.t: "Un titre précieux"
 mbq_gr.0001.desc: "[mbq_gr_grant_title.GetNameNoTier] vous fait dépasser votre [domain_limit|El]. Mais ce n’est pas un titre ordinaire, vous décidez donc de le garder ou non."
 mbq_gr.0001.desc_special: "\n\nIl y a ici un #high bâtiment spécial#! ou la place pour en bâtir un. Il n’existe que peu de lieux comme celui-ci dans tout le royaume."
 mbq_gr.0001.desc_holy: "\n\nIci se trouve un #high lieu saint#! de votre foi. Le fidèle de votre foi qui le détient renforce tous ses croyants."
 mbq_gr.0001.desc_ducal: "\n\nC’est le #high siège du duché#!. Qui le détient mène la région."
 mbq_gr.0001.keep: "Garder."
 mbq_gr.0001.keep_tt: "Vous gardez le titre et restez au-delà de votre [domain_limit|El]. L’automatisation ne vous le demandera plus."
 mbq_gr.0001.give: "Céder."
 mbq_gr.0001.give_tt: "[mbq_gr_recipient.GetShortUIName] reçoit le titre."
 MBQ_GR_TT_LIMITS_RED: "#T Rien n’est cédé#!\n• Les propriétés gardées au-delà de la limite sont réglées sur Tout garder\n• Choisissez un nombre"
 MBQ_GR_ALLOW: "Max. [holdings|E] au-delà de la [Concept('domain_limit','limite')|E]"
 MBQ_GR_TT_ALLOW: "#T Propriétés au-delà de la limite#!\n• Combien de [holdings|El] vous pouvez détenir au-delà de votre @domain_icon! [domain_limit|El]"
 MBQ_GR_NOLIMIT: "Illimité"
 MBQ_GR_N1: "1"
 MBQ_GR_N2: "2"
 MBQ_GR_N4: "4"
 MBQ_GR_N6: "6"
 MBQ_GR_TT_WHO_RED: "#T Personne ne peut recevoir#!\n• Comtés : toutes les préférences sont sur Rien, ou aucun âge n’est coché\n• Choisissez une préférence ou cochez un âge"
 MBQ_GR_TT_PRIO_C: "#T Préférence#!\n• La préférence 1 compte d’abord ; s’il en reste plusieurs, la préférence 2 décide parmi eux, puis la 3 et ainsi de suite\n• Obligatoire : qui n’en remplit aucune est écarté. Trie seulement : ne fait que trier"
