l_spanish:
 MBQ_VS_AUTO_HEAD: "Automatización"
 MBQ_VS_TT_AUTO_HEAD: "#T Automatización#!\n• Ofertas y exigencias solo a gobernantes que aceptarían\n• Las ofertas recibidas se aceptan según lo elegido"
 MBQ_VS_AUTO_VS: "@vassal_icon! Ofrecer vasallaje"
 MBQ_VS_AUTO_TB: "@tributary_icon! Exigir como tributario"
 MBQ_VS_TT_AUTO_VS: "#T Ofrecer vasallaje#!\n• Ofrece vasallaje a cada gobernante afín que aceptaría, con el mejor pacto para ti\n• Solo con espacio bajo tu [vassal_limit|lE]"
 MBQ_VS_TT_AUTO_TB: "#T Exigir tributo#!\n• Exige tributo a cada vecino afín que aceptaría, como la interacción normal\n• #warning @prestige_icon! Cuesta [prestige|lE] como lo normal#!"
 MBQ_VS_TT_MIN_HEAD: "#T Pacto#!\n• Se usa al ofrecer vasallaje y al aceptar ofertas de lealtad y de tributario\n• No se usa al exigir como tributario"
 MBQ_VS_MIN_HIGH: "Altas"
 MBQ_VS_MIN_NORMAL: "Normales"
 MBQ_VS_MIN_LOW: "Bajas"
 MBQ_VS_TT_MIN_HIGH: "#T Altas#!\n• Solo [obligations|lE] altas\n• Ofertas que te hacen: solo las altas se aceptan automáticamente"
 MBQ_VS_TT_MIN_NORMAL: "#T Normales#!\n• Primero altas, luego [obligations|lE] normales\n• Ofertas que te hacen: las altas y las normales se aceptan automáticamente"
 MBQ_VS_TT_MIN_LOW: "#T Bajas#!\n• Primero altas, luego normales, luego [obligations|lE] bajas\n• Ofertas que te hacen: toda oferta se acepta automáticamente"
 MBQ_VS_WHO: "Ofrecer vasallaje a:"
 MBQ_VS_TT_WHO: "#T A quién se pregunta#!\n• Vale solo para el vasallaje\n• Exigir como tributario siempre se dirige a vecinos independientes"
 MBQ_VS_NB: "Vecinos independientes"
 MBQ_VS_TRIB: "Tus tributarios"
 MBQ_VS_TT_NB: "#T Vecinos independientes#!\n• Marcado: se pregunta a los gobernantes independientes junto a tu [realm|lE], también al otro lado del agua"
 MBQ_VS_TT_TRIB: "#T Tus tributarios#!\n• Marcado: también se pregunta a tus propios tributarios"
 MBQ_VS_RANK: "Hasta el rango (inclusive)"
 MBQ_VS_TT_RANK: "#T Hasta el rango#!\n• Se pregunta a los gobernantes hasta este rango y sus ofertas se aceptan automáticamente\n• Nunca se pregunta a los emperadores"
 MBQ_VS_EXCL_HEAD: "Omitir a estos gobernantes"
 MBQ_VS_TT_EXCL: "#T Excepciones#!\n• Marcado: la automatización nunca pregunta a estos gobernantes ni acepta sus ofertas\n• Sus ofertas llegan como siempre"
 MBQ_VS_EX_RIVAL: "Rivales y némesis"
 MBQ_VS_EX_CLAIM: "Derechos sobre tus títulos"
 MBQ_VS_EX_FAITH: "@religious_icon! Otra fe"
 MBQ_VS_EX_FACTION: "@faction_icon! Líderes de facción"
 MBQ_VS_TT_EX_RIVAL: "#T Rivales y némesis#!\n• El gobernante es tu [rival|lE] o tu [nemesis|lE]"
 MBQ_VS_TT_EX_CLAIM: "#T Derechos sobre tus títulos#!\n• El gobernante tiene un [claim|lE] sobre uno de tus títulos de rango condado o superior"
 MBQ_VS_TT_EX_FAITH: "#T Otra fe#!\n• El gobernante sigue una [faith|lE] distinta a la tuya"
 MBQ_VS_TT_EX_FACTION: "#T Líderes de facción#!\n• El gobernante lidera una [faction|lE] contra ti"
 MBQ_VS_PREVIEW: "Vasallaje ahora: [GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )], @vassal_icon! [GetPlayer.GetNumVassalsTowardsLimit]/[GetPlayer.GetVassalLimit]"
 MBQ_TB_PREVIEW: "Tributo ahora: hasta [GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )]"
 MBQ_TBO_HEAD: "Deseos de pacto tributario"
 MBQ_TBO_TT_HEAD: "#T Deseos de pacto tributario#!\n• Se aplican tras la aceptación a cada nuevo [tributary|lE] de esta ventana\n• #warning @prestige_icon! Cuesta 150 [prestige|lE] una vez por tributario, [opinion|lE] -30 con él y -10 con los demás, solo si algo cambia#!"
 MBQ_TBO_NO_GUAR: "Sin deber de unirse a sus guerras"
 MBQ_TBO_TT_NO_GUAR: "#T Sin deber de unirse a sus guerras#!\n• Reduce tu deber de unirte a sus guerras donde el juego lo permite"
 MBQ_TBO_TAX: "Impuestos más altos"
 MBQ_TBO_TT_TAX: "#T Impuestos más altos#!\n• Un escalón más de [taxes|lE] que al principio, solo si el juego lo permite"
 MBQ_TBO_PRESTIGE: "Más prestigio"
 MBQ_TBO_TT_PRESTIGE: "#T Más prestigio#!\n• Un escalón más de transferencia de [prestige|lE] que al principio, solo si el juego lo permite"
 MBQ_TBO_WAR: "Apoyan tus guerras"
 MBQ_TBO_TT_WAR: "#T Apoyan tus guerras#!\n• El nuevo tributario debe unirse a tus guerras, solo si el juego lo permite"
 MBQ_VS_RULER_1: "gobernante"
 MBQ_VS_RULER_N: "gobernantes"
 MBQ_VS_TT_RUN: "#T Ejecutar ahora#!\n• Ofrece vasallaje una vez a cada gobernante que coincida y aceptaría\n• En gris: no hay a quién ofrecérselo"
 MBQ_TB_TT_RUN: "#T Ejecutar ahora#!\n• Exige tributo una vez a cada vecino que coincida y aceptaría\n• En gris: no hay a quién exigírselo"
 MBQ_VS_MANDALA: "Gobernantes de mandala: ofrecer y exigir en pausa."
 mbq_vs_sum_title: "Nuevos vasallos"
 mbq_vs_sum_desc: "Vasallaje aceptado: [ROOT.Var('mbq_vs_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_vs_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )][ROOT.Char.Custom('mbq_vs_s1')][ROOT.Char.Custom('mbq_vs_s2')][ROOT.Char.Custom('mbq_vs_s3')][ROOT.Char.Custom('mbq_vs_s4')][ROOT.Char.Custom('mbq_vs_s5')][ROOT.Char.Custom('mbq_vs_more')]"
 mbq_vs_more_line: "\ny [ROOT.Var('mbq_vs_rest').GetValue|0] más"
 mbq_vs_none_line: "\nNingún gobernante coincidía, o nadie aceptó."
 MBQ_TB_TT_OFF: "#T Exigir tributo#!\n• Solo [nomads|lE], gobernantes de [steppe_admin|lE] y [hegemons|lE] [celestial|lE] pueden exigir tributo en paz\n• Los gobernantes de [mandala|lE] acogen [tributaries|lE] en su lugar"
 mbq_tb_sum_title: "Nuevos tributarios"
 mbq_tb_sum_desc: "Ahora son tus tributarios: [ROOT.Var('mbq_tb_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_tb_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )][ROOT.Char.Custom('mbq_tb_s1')][ROOT.Char.Custom('mbq_tb_s2')][ROOT.Char.Custom('mbq_tb_s3')][ROOT.Char.Custom('mbq_tb_s4')][ROOT.Char.Custom('mbq_tb_s5')][ROOT.Char.Custom('mbq_tb_more')]"
 mbq_tb_more_line: "\ny [ROOT.Var('mbq_tb_rest').GetValue|0] más"
 mbq_tb_none_line: "\nNingún gobernante coincidía, o nadie aceptó."
