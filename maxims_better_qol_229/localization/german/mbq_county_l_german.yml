 MBQ_GR_TT_AUTO_HEAD: "#T Automatik#!\n• Ein neuer Titel über Euren Grenzen geht sofort an den Empfänger, den Eure Vorlieben wählen\n• Euer [capital|E] wird nie abgegeben"
