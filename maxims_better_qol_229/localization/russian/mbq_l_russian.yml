 MBQ_WIN_HUD_TT: "#T Better Quality of Life#!\n#I Щелкните, чтобы открыть окно настроек#!"
 MBQ_WIN_DIVORCE: "@religious_icon! Принимать все просьбы о разводе как глава конфессии"
 MBQ_TT_DIVORCE: "#T Принимать все просьбы о [Concept('divorce', 'разводе')|E]#!\n$EFFECT_LIST_BULLET$ Каждая просьба «Попросить о разводе», которая приходит к вам как к [Concept('head_of_faith', 'главе конфессии')|E], принимается без вопросов.\n$EFFECT_LIST_BULLET$ Это относится и к просьбам, которые [Concept('dynast', 'глава династии')|E] отправляет за члена семьи.\n\n#weak Без галочки: как в базовой игре.#!"
 MBQ_TT_DIVORCE_ON: "#T Принимать все просьбы о [Concept('divorce', 'разводе')|E]#!\n#P $EFFECT_LIST_BULLET$ Каждая просьба «Попросить о разводе», которая приходит к вам как к [Concept('head_of_faith', 'главе конфессии')|E], принимается без вопросов.\n$EFFECT_LIST_BULLET$ Это относится и к просьбам, которые [Concept('dynast', 'глава династии')|E] отправляет за члена семьи.#!"
 MBQ_TT_TRIB_NOMADS: "#T Для кочевников#!\n$EFFECT_LIST_BULLET$ Предложения [Concept( 'tributary', 'данника' )|E] от держав кочевников и скотоводов принимаются без вопросов.\n$EFFECT_LIST_BULLET$ Только предложения, которые вам делают другие правители; ваши собственные требования находятся в разделе «Вассалы».\n$EFFECT_LIST_BULLET$ Остальные правители задаются полем ниже.\n\n#weak Не отмечено: как в базовой игре.#!"
 MBQ_TT_TRIB_ALL: "#T Все остальные#!\n$EFFECT_LIST_BULLET$ Предложения [Concept( 'tributary', 'данника' )|E] от любого правителя, кроме держав кочевников и скотоводов, принимаются без вопросов.\n$EFFECT_LIST_BULLET$ Только предложения, которые вам делают другие правители; ваши собственные требования находятся в разделе «Вассалы».\n$EFFECT_LIST_BULLET$ Эти державы задаются полем выше.\n\n#weak Не отмечено: как в базовой игре.#!"
 MBQ_TT_GRANT: "#T Автоматизация: передавать вассалов законному сюзерену#!\n$EFFECT_LIST_BULLET$ Каждый квартал мелкие [Concept('vassals', 'вассалы')|E] с территории более крупного вассала переходят к нему.\n$EFFECT_LIST_BULLET$ Он их законный [Concept('liege', 'сюзерен')|E]."
 MBQ_TT_GRANT_ON: "#T Автоматизация: передавать вассалов законному сюзерену#!\n#P $EFFECT_LIST_BULLET$ Каждый квартал мелкие [Concept('vassals', 'вассалы')|E] с территории более крупного вассала переходят к нему.\n$EFFECT_LIST_BULLET$ Он их законный [Concept('liege', 'сюзерен')|E].#!"
 mbq_best_terms_no_prestige: "Недостаточно [Concept('prestige', 'престижа')|E], чтобы изменить [Concept('tributary_contract', 'договор о дани')|E]"
