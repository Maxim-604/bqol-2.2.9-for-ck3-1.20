 MBQ_RS_MIN_HEAD: "Minimalny okup"
 MBQ_RS_MIN_100: "Pełna cena"
 MBQ_RS_MIN_STAFFEL: "Według czasu w więzieniu"
 MBQ_RS_TT_MIN: "#T Okup#!\n• Od razu: wystarczy prawdziwe @gold_icon! złoto. Pełna cena: cały okup\n• Według czasu w więzieniu: im dłużej czeka, tym mniej wystarczy"
 MBQ_RS_EXCL_HEAD: "Ci zostają w więzieniu"
 MBQ_RS_TT_EXCL: "#T Ci zostają w więzieniu#!\n• Automatyzacja nigdy nie uwalnia takich więźniów\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_NOTE_EXEMPT: "• Wyjątki ustawione dla działań masowych w karcie więzienia tu nie obowiązują; użyj wyjątków z tego okna"
 MBQ_RS_EX_WAR: "@war_icon! Wrogowie wojenni"
 MBQ_RS_EX_CLAIM: "Roszczenia do twoich tytułów"
 MBQ_RS_EX_RIVAL: "Rywale i śmiertelni wrogowie"
 MBQ_RS_EX_DYN: "Twoja własna dynastia"
 MBQ_RS_TT_EX_WAR: "#T Wrogowie wojenni#!\n• Więzień, płacący za niego suzeren lub posiadacz jego tytułu dziedzicznego jest z tobą w [Concept( 'war', 'wojnie' )|E]"
 MBQ_RS_TT_EX_CLAIM: "#T Roszczenia do twoich tytułów#!\n• Więzień ma [Concept( 'claim', 'roszczenie' )|E] do jednego z twoich tytułów rangi [Concept( 'duchy', 'księstwa' )|E] lub wyższej\n• Albo do twojego [Concept( 'primary_title', 'tytułu głównego' )|E], niezależnie od rangi"
 MBQ_RS_TT_EX_RIVAL: "#T Rywale i śmiertelni wrogowie#!\n• Więzień jest twoim [Concept( 'rival', 'rywalem' )|E] albo twoim [Concept( 'nemesis', 'śmiertelnym wrogiem' )|E]"
 MBQ_RS_TT_EX_DYN: "#T Twoja własna dynastia#!\n• Więzień należy do twojej [Concept( 'dynasty', 'dynastii' )|E], co obejmuje większość twojej bliskiej rodziny"
 MBQ_RS_TT_AUTO_X: "$MBQ_RS_TT_AUTO$\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_TT_RUN_X: "$MBQ_RS_TT_RUN$\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_TT_AUTO_BLOCKED: "#T Automatyzacja#!\n• #N Wstrzymana:#! nie wybrano poziomu minimalnego okupu\n• Zaznacz jeden poziom w sekcji Minimalny okup"
 MBQ_RS_TT_RUN_BLOCKED: "#T Uruchom teraz#!\n• #N Zablokowane:#! nie wybrano poziomu minimalnego okupu\n• Zaznacz jeden poziom w sekcji Minimalny okup"
 MBQ_CAT_GENERAL: "Wiara i nawrócenie"
 MBQ_CAT_PRISON: "Więzienie i okup"
 MBQ_CAT_VASSALS: "Wasale i trybut: automatyzacja"
 MBQ_CAT_COUNTIES: "Nadaj tytuły"
 MBQ_RS_TAKT: "Odstęp"
 MBQ_RS_TT_RED: "#T Nieprawidłowy wybór#!\n• Zaznacz co najmniej jedno pole w tej grupie\n• Do tego czasu automatyzacja jest wstrzymana, a Uruchom teraz pozostaje wyszarzone"
 MBQ_RS_MIN_NOW: "od razu"
 MBQ_RS_EX_FACTION: "Przywódcy frakcji (także bunty)"
 MBQ_RS_EX_HOOK: "Więźniowie, na których masz haka"
 MBQ_RS_TT_EX_FACTION: "#T Przywódcy frakcji#!\n• Zaznaczone: przywódcy każdej [Concept( 'faction', 'frakcji' )|E] przeciwko tobie nigdy nie są uwalniani za okup, także w buntach chłopskich i frakcjach niepodległościowych"
 MBQ_RS_TT_EX_HOOK: "#T Haki#!\n• Zaznaczone: więźniowie, na których masz [Concept( 'hook', 'haka' )|E], nigdy nie są uwalniani za okup, także przy słabych hakach"
 MBQ_RS_RED_LEGEND: "Zaznaczone na czerwono: automatyzacja tak nie działa."
 MBQ_RS_EXC_ALL: "Wszyscy"
 MBQ_RS_EXC_RESET: "Brak"
 MBQ_RS_TT_MIN_NOW: "#T Od razu#!\n• Wystarczy dowolne prawdziwe złoto\n• Płacący, który nie oferuje złota, tylko haka lub coś podobnego, nigdy nie zostaje przyjęty"
 MBQ_RS_TT_MIN_100: "#T Pełna cena#!\n• Płacący musi zapłacić cały okup\n• Płacący, który nie oferuje złota, tylko haka lub coś podobnego, nigdy nie zostaje przyjęty"
 MBQ_RS_TT_MIN_STAFFEL: "#T Według czasu w więzieniu#!\n• Im dłużej więzień siedzi, tym mniej @gold_icon! okupu starczy\n• Po bardzo długim czasie wystarczy każde złoto"
 MBQ_RS_PRISONER_1: "więzień"
 MBQ_RS_PRISONER_N: "więźniów"
 MBQ_RS_EX_VASSAL: "@vassal_icon! Twoi wasale"
 MBQ_RS_EX_SUBVASSAL: "@vassal_icon! Pośredni wasale"
 MBQ_RS_TT_EX_VASSAL: "#T Twoi wasale#!\n• Zaznaczone: twoi bezpośredni [Concept( 'vassal', 'wasale' )|E] nigdy nie są uwalniani za okup"
 MBQ_RS_TT_EX_SUBVASSAL: "#T Pośredni wasale#!\n• Zaznaczone: wasale twoich wasali nigdy nie są uwalniani za okup\n• Są pod tobą w twoim królestwie, ale nie są twoimi bezpośrednimi [Concept( 'vassal', 'wasalami' )|E]"
 MBQ_RS_NOBODY: "Nikt"
 MBQ_RS_TT_NOBODY: "#T Nikt#!\n• Nie bierze się okupu za żadnego więźnia\n• Automat wstrzymuje się, a Uruchom teraz pozostaje wyszarzone"
 MBQ_RS_TT_T0: "#T Bez tytułu#!\n• Okup tylko za więźniów bez tytułu ziemskiego\n• Liczy się najwyższy tytuł więźnia"
 MBQ_RS_TT_T2: "#T Hrabia#!\n• Okup za więźniów bez tytułu, baronów i hrabiów\n• Liczy się najwyższy tytuł więźnia"
 MBQ_RS_TT_T3: "#T Książę#!\n• Okup za więźniów do książąt włącznie\n• Liczy się najwyższy tytuł więźnia"
 MBQ_RS_TT_T4: "#T Król#!\n• Okup za więźniów do królów, od cesarzy nigdy\n• Liczy się najwyższy tytuł więźnia"
