 MBQ_RS_TAKT: "Takt"
 MBQ_RS_TT_RED: "#T Ungültige Auswahl#!\n• In dieser Gruppe mindestens ein Kästchen setzen\n• Bis dahin pausiert die Automatik und Jetzt ausführen bleibt grau"
