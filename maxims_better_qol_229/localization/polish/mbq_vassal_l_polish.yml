 MBQ_TBO_COST: "Zmiana kosztuje jednorazowo 150 @prestige_icon! [Concept( 'prestige', 'prestiżu' )|E] za każdego trybutariusza"
 MBQ_VS_MASTER: "Automatyzacja: wasale i trybut"
