 MBQ_GR_ASKO_2: "価値ある領地と公爵領のとき"
 MBQ_GR_ASKO_3: "しない、まとめを送る"
 MBQ_GR_ASKO_4: "しない、通知なし"
 MBQ_GR_ADV: "詳細設定を表示"
 mbq_gr_line1: "\n[ROOT.Var('mbq_gr_c1').Title.GetName]\n    [ROOT.Var('mbq_gr_c1').Title.GetHolder.GetShortUIName][ROOT.Var('mbq_gr_c1').Title.GetHolder.Custom('GetPrimaryTitleTierIcon')], [ROOT.Var('mbq_gr_c1').Title.GetHolder.GetAge] @health_icon! [ROOT.Var('mbq_gr_c1').Title.GetHolder.GetRelationToString( GetPlayer )]"
 mbq_gr_line2: "\n[ROOT.Var('mbq_gr_c2').Title.GetName]\n    [ROOT.Var('mbq_gr_c2').Title.GetHolder.GetShortUIName][ROOT.Var('mbq_gr_c2').Title.GetHolder.Custom('GetPrimaryTitleTierIcon')], [ROOT.Var('mbq_gr_c2').Title.GetHolder.GetAge] @health_icon! [ROOT.Var('mbq_gr_c2').Title.GetHolder.GetRelationToString( GetPlayer )]"
 mbq_gr_line3: "\n[ROOT.Var('mbq_gr_c3').Title.GetName]\n    [ROOT.Var('mbq_gr_c3').Title.GetHolder.GetShortUIName][ROOT.Var('mbq_gr_c3').Title.GetHolder.Custom('GetPrimaryTitleTierIcon')], [ROOT.Var('mbq_gr_c3').Title.GetHolder.GetAge] @health_icon! [ROOT.Var('mbq_gr_c3').Title.GetHolder.GetRelationToString( GetPlayer )]"
 mbq_gr_line4: "\n[ROOT.Var('mbq_gr_c4').Title.GetName]\n    [ROOT.Var('mbq_gr_c4').Title.GetHolder.GetShortUIName][ROOT.Var('mbq_gr_c4').Title.GetHolder.Custom('GetPrimaryTitleTierIcon')], [ROOT.Var('mbq_gr_c4').Title.GetHolder.GetAge] @health_icon! [ROOT.Var('mbq_gr_c4').Title.GetHolder.GetRelationToString( GetPlayer )]"
 mbq_gr_line5: "\n[ROOT.Var('mbq_gr_c5').Title.GetName]\n    [ROOT.Var('mbq_gr_c5').Title.GetHolder.GetShortUIName][ROOT.Var('mbq_gr_c5').Title.GetHolder.Custom('GetPrimaryTitleTierIcon')], [ROOT.Var('mbq_gr_c5').Title.GetHolder.GetAge] @health_icon! [ROOT.Var('mbq_gr_c5').Title.GetHolder.GetRelationToString( GetPlayer )]"
