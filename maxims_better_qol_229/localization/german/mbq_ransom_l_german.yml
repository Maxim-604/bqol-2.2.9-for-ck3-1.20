l_german:
 MBQ_RS_BTN_TT: "#T Lösegeld-Automatik#!\n• Klick: Einstellungen öffnen, erneut klicken zum Schließen\n• Rechtsklick: Automatik an/aus"
 MBQ_RS_BTN_TT_ON: "#T Lösegeld-Automatik#!\n• Klick: Einstellungen öffnen, erneut klicken zum Schließen\n#P • Rechtsklick: Automatik an/aus#!"
 MBQ_RS_WHO: "Wer wird verkauft"
 MBQ_RS_DUNGEON: "Gefangene im [dungeon|E]"
 MBQ_RS_HOUSE: "Gefangene im [house_arrest|E]"
 MBQ_RS_TT_DUNGEON: "#T Kerker#!\n• Haken: Gefangene in Eurem Kerker werden einbezogen"
 MBQ_RS_TT_HOUSE: "#T Hausarrest#!\n• Haken: Gefangene im Hausarrest werden einbezogen"
 MBQ_RS_RANK: "Freikaufen bis Rang (einschließlich)"
 MBQ_RS_T0: "ohne Titel"
 MBQ_RS_T1: "Baron"
 MBQ_RS_T2: "Graf"
 MBQ_RS_T3: "Herzog"
 MBQ_RS_T4: "König"
 MBQ_RS_TT_RANK: "#T Freikaufen bis Rang#!\n• Freigekauft wird bis zum gewählten Rang, niedrigere Ränge und Gefangene ohne Titel eingeschlossen\n• Es zählt der höchste Titel des Gefangenen, Kaiser nie"
 MBQ_RS_TT_T1: "#T Baron#!\n• Lässt Gefangene ohne Titel und Barone frei\n• Ein [baron|E] ist ein Herrscher, dessen höchster Titel eine [barony|E] ist"
 MBQ_RS_AUTO: "Automatik an"
 MBQ_RS_TT_AUTO: "#T Automatik#!\n• Lässt Gefangene im gewählten Abstand frei, nur für Euch"
 MBQ_RS_MONTHLY: "monatlich"
 MBQ_RS_QUARTERLY: "alle drei Monate"
 MBQ_RS_TT_TAKT: "#T Takt#!\n• Wie oft die Automatik Eure Gefangenen prüft\n• Eine Änderung gilt sofort: die nächste Prüfung folgt einen Takt nach heute"
 MBQ_RS_PREVIEW: "Jetzt freikaufen: [GetPlayer.MakeScope.Var('mbq_rs_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_rs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_RS_PRISONER_1', 'MBQ_RS_PRISONER_N' )] für @gold_icon! [GetPlayer.MakeScope.Var('mbq_rs_prev_gold').GetValue|0]"
 MBQ_RS_RUN: "Jetzt ausführen"
 MBQ_RS_TT_RUN: "#T Jetzt ausführen#!\n• Bietet einmal Lösegeld für jeden passenden Gefangenen an, dessen Zahler zustimmt"
 mbq_rs_sum_title: "Gefangene freigekauft"
 mbq_rs_sum_desc: "Freigelassen: [ROOT.Var('mbq_rs_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_rs_n').GetValue, '(CFixedPoint)1' ), 'MBQ_RS_PRISONER_1', 'MBQ_RS_PRISONER_N' )], zusammen @gold_icon! [ROOT.Var('mbq_rs_sum').GetValue|0][ROOT.Char.Custom('mbq_rs_s1')][ROOT.Char.Custom('mbq_rs_s2')][ROOT.Char.Custom('mbq_rs_s3')][ROOT.Char.Custom('mbq_rs_s4')][ROOT.Char.Custom('mbq_rs_s5')][ROOT.Char.Custom('mbq_rs_more')]"
 mbq_rs_empty: ""
 mbq_rs_more_line: "\nund [ROOT.Var('mbq_rs_rest').GetValue|0] weitere"
 mbq_rs_none_line: "\nKein Gefangener passte, oder kein Zahler nahm an."
 message_filter_mbq_ransom_summary: "Gefangene freigekauft (Better Quality of Life)"
 message_filter_mbq_ransom_summary_desc: "Sammelmeldung der Lösegeld-Angebote, die Better Quality of Life für Euch gemacht hat."
 MBQ_RS_MIN_HEAD: "Mindest-Lösegeld"
 MBQ_RS_MIN_100: "Voller Preis"
 MBQ_RS_MIN_STAFFEL: "Nach Haftdauer"
 MBQ_RS_TT_MIN: "#T Lösegeld#!\n• Sofort: jedes echte @gold_icon! Gold genügt. Voller Preis: das volle Lösegeld\n• Nach Haftdauer: je länger der Gefangene wartet, desto weniger genügt"
 MBQ_RS_EXCL_HEAD: "Diese bleiben in Haft"
 MBQ_RS_TT_EXCL: "#T Diese bleiben in Haft#!\n• Solche Gefangenen lässt die Automatik nie frei\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_NOTE_EXEMPT: "• Euer Ausschluss aus Massenaktionen im Gefängnis wird nicht gelesen; dafür gibt es die Ausnahmen in diesem Fenster"
