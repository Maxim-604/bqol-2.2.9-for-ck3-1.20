 MBQ_TB_TT_OFF: "#T Demand Tribute#!\n• Only [nomads|E], [steppe_admin|E] rulers and [celestial|E] [hegemons|E] can demand tribute in peace\n• [mandala|E] rulers embrace [tributaries|E] instead"
 mbq_tb_sum_title: "New tributaries"
