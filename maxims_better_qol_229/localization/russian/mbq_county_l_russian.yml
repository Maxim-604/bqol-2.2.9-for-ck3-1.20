 MBQ_GR_TT_ALLOW: "#T Владения сверх предела#!\n• Сколько [Concept( 'holdings', 'владений' )|E] вы можете держать сверх @domain_icon! [Concept( 'domain_limit', 'предела домена' )|E]"
 MBQ_GR_NOLIMIT: "Без огр."
 MBQ_GR_N1: "1"
 MBQ_GR_N2: "2"
 MBQ_GR_N4: "4"
 MBQ_GR_N6: "6"
 MBQ_GR_TT_WHO_RED: "#T Некому получать#!\n• Графства: все предпочтения «Ничего» или не отмечен ни один возраст\n• Выберите предпочтение или отметьте возраст"
 MBQ_GR_TT_PRIO_C: "#T Предпочтение#!\n• Приоритет 1 считается первым; если остаётся несколько, среди них решает приоритет 2, затем 3 и так далее\n• Необходимо: кто не подходит ни под одно, выбывает. Только сортирует: только упорядочивает"
 MBQ_GR_OPT_0: "Ничего"
 MBQ_GR_OPT_1: "Дин."
 MBQ_GR_OPT_2: "Дом"
 MBQ_GR_OPT_3: "Внуки и далее"
 MBQ_GR_OPT_4: "Дети"
 MBQ_GR_OPT_5: "Двор"
 MBQ_GR_OPT_6: "Правит. де-юре"
