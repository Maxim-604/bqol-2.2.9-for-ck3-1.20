 mbq_gr.0001.t: "A valuable title"
 mbq_gr.0001.desc: "[mbq_gr_grant_title.GetNameNoTier] puts you over your [domain_limit|E]. But this is no ordinary title, so you decide whether to keep it."
 mbq_gr.0001.desc_special: "\n\nHere is a #high special building#! or room for one. There are only a few places like this in the whole realm."
 mbq_gr.0001.desc_holy: "\n\nHere lies a #high holy site#! of your faith. Whoever of your faith holds it strengthens all its believers."
 mbq_gr.0001.desc_ducal: "\n\nIt is the #high seat of the duchy#!. Whoever holds it leads the region."
 mbq_gr.0001.keep: "Valuable."
 mbq_gr.0001.keep_tt: "You keep the title and stay over your [domain_limit|E]. The automation never asks about it again."
