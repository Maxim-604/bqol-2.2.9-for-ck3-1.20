l_japanese:
 MBQ_EXPL_Q:0 "?"
 MBQ_EXPL_TT:0 "#T 説明#!\n• 称号の授与の設定が何をするかを表示する\n• もう一度クリックすると隠れる"
 MBQ_EXPL_TITLE:0 "称号の授与のしくみ"
 MBQ_EXPL_H_AUTO:0 "@domain_icon! 自動化"
 MBQ_EXPL_B_AUTO:0 "あなたの[domain_limit|E]を超えると、超過分の@county_icon! [counties|E]を自動で、または「今すぐ実行」で他の者に譲渡する。あなたの[capital|E]と「貴重」にした称号は手元に残る。"
 MBQ_EXPL_H_WHO:0 "@vassal_icon! 受取人"
 MBQ_EXPL_B_WHO:0 "称号は、あなたに直接仕える[vassals|E]、[courtiers|E]、親族に渡る。あなたの[primary_heir|E]、好敵手、宿敵には渡らない。"
 MBQ_EXPL_H_FILTERS:0 "フィルター"
 MBQ_EXPL_B_FILTERS:0 "フィルターは、誰が称号を受け取れるかを決める：[religion|E]、[culture|E]、年齢。悪い特性を持つ封臣は除外される。該当者なしなら称号はあなたが持ち続ける。「該当者なしなら新貴族」を選ぶと、あなたの[culture|E]の新貴族が受け取る。"
 MBQ_EXPL_H_PRIOS:0 "優先順位"
 MBQ_EXPL_B_PRIOS:0 "#clickable ベージュ#!：必須。選んだもののどれにも当てはまらない者は除外される。\n#color_light_blue 水色#!：並べ替えのみ。誰も除外されない。\nそのあと優先1が先に効く。二者が並んだら優先2が決め、続いて優先3、以降も同様。"
 MBQ_EXPL_H_CAPS:0 "@county_icon! 受取人ごとの上限"
 MBQ_EXPL_B_CAPS:0 "どの封臣も、上限を超える数の伯爵領は受け取らない。"
