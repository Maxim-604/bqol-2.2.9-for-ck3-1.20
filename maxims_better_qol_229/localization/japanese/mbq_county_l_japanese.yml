 MBQ_GR_OT_ALLOW_5: "@domain_icon! [domain_limit|E]より五つ多くまで保持する。"
 MBQ_GR_OT_ALLOW_NONE: "領分は譲渡されない。"
 MBQ_GR_OT_CCAP_1: "封臣が持てる@county_icon! [county|E]は最大一つ。"
 MBQ_GR_OT_CCAP_2: "封臣が持てる@county_icon! [counties|E]は最大二つ。"
 MBQ_GR_OT_CCAP_4: "封臣が持てる@county_icon! [counties|E]は最大四つ。"
 MBQ_GR_OT_CCAP_6: "封臣が持てる@county_icon! [counties|E]は最大六つ。"
 MBQ_GR_OT_CCAP_NONE: "封臣ごとの伯爵領に上限なし。"
 MBQ_GR_OT_ASK_1: "[special_building|E]かその建設地、あなたの[holy_site|E]のとき確認する。"
 MBQ_GR_OT_ASK_2: "公爵領と、公爵領の中心となる伯爵領でも確認する。"
 MBQ_GR_OT_ASK_3: "確認せず、まとめを一件送る。"
 MBQ_GR_OT_ASK_4: "確認せず、通知もしない。"
 MBQ_GR_OT_PRESET_0: "あなたの子、次に孫、次にあなたの家、次にあなたの王朝。\nそれ以外は称号を保持する。"
 MBQ_GR_OT_PRESET_1: "王朝の若い一員に伯爵領を一つずつ。\nそれ以外は称号を保持する。"
 MBQ_GR_OT_PRESET_2: "伯爵領はすべてあなたの文化の新貴族へ。"
 MBQ_GR_OT_PRESET_3: "良い特性を持つ封臣を優先。"
