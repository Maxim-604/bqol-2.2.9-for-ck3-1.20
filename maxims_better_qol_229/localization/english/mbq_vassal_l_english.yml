l_english:
 MBQ_VS_AUTO_HEAD: "Automation"
 MBQ_VS_TT_AUTO_HEAD: "#T Automation#!\n• Offers and demands go only to rulers who would accept\n• Offers made to you are accepted as chosen below"
 MBQ_VS_AUTO_VS: "@vassal_icon! Offer vassalage"
 MBQ_VS_AUTO_TB: "@tributary_icon! Demand tribute"
 MBQ_VS_TT_AUTO_VS: "#T Offer Vassalage#!\n• Offers vassalage to every matching ruler who would accept, with the best contract for you\n• Only while you have room under your [vassal_limit|E]"
 MBQ_VS_TT_AUTO_TB: "#T Demand Tribute#!\n• Demands tribute from every matching neighbor who would accept, like the normal interaction\n• #warning @prestige_icon! Costs [prestige|E] like the normal interaction#!"
 MBQ_VS_TT_MIN_HEAD: "#T Contract#!\n• Used for offering vassalage and for accepting fealty and tribute offers\n• Not used when demanding tribute"
 MBQ_VS_MIN_HIGH: "High"
 MBQ_VS_MIN_NORMAL: "Normal"
 MBQ_VS_MIN_LOW: "Low"
 MBQ_VS_TT_MIN_HIGH: "#T High#!\n• Only high [obligations|E]\n• Offers to you: only high ones are accepted automatically"
 MBQ_VS_TT_MIN_NORMAL: "#T Normal#!\n• High first, then normal [obligations|E]\n• Offers to you: high and normal ones are accepted automatically"
 MBQ_VS_TT_MIN_LOW: "#T Low#!\n• High first, then normal, then low [obligations|E]\n• Offers to you: every offer is accepted automatically"
 MBQ_VS_WHO: "Offer vassalage to:"
 MBQ_VS_TT_WHO: "#T Who is asked#!\n• Offer vassalage only\n• Demand as tributary always asks independent neighbors"
 MBQ_VS_NB: "Independent neighbors"
 MBQ_VS_TRIB: "Your tributaries"
 MBQ_VS_TT_NB: "#T Independent Neighbors#!\n• [independent_ruler|E]s next to your [realm|E] are asked, also across water"
 MBQ_VS_TT_TRIB: "#T Your Tributaries#!\n• Your own [tributary|E] rulers are asked too"
 MBQ_VS_RANK: "Up to rank (inclusive)"
 MBQ_VS_TT_RANK: "#T Up To Rank#!\n• Rulers up to this rank are asked, and their offers are accepted automatically\n• Emperors are never asked"
 MBQ_VS_EXCL_HEAD: "Skip these rulers"
 MBQ_VS_TT_EXCL: "#T Skip These Rulers#!\n• The automation never asks such rulers and never accepts their offers\n• Their offers to you come up as usual"
 MBQ_VS_EX_RIVAL: "@rival_icon! Rivals and nemeses"
 MBQ_VS_EX_CLAIM: "Claims on your titles"
 MBQ_VS_EX_FAITH: "@religious_icon! Other faith"
 MBQ_VS_EX_FACTION: "@faction_icon! Faction leaders"
 MBQ_VS_TT_EX_RIVAL: "#T Rivals and Nemeses#!\n• The ruler is your [rival|E] or your [nemesis|E]"
 MBQ_VS_TT_EX_CLAIM: "#T Claims on Your Titles#!\n• The ruler has a [claim|E] on one of your titles of county rank or higher"
 MBQ_VS_TT_EX_FAITH: "#T Other Faith#!\n• The ruler follows a different [faith|E] than you"
 MBQ_VS_TT_EX_FACTION: "#T Faction Leaders#!\n• The ruler leads a [faction|E] against you"
 MBQ_VS_PREVIEW: "Vassalize now: [GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )], @vassal_icon! [GetPlayer.GetNumVassalsTowardsLimit]/[GetPlayer.GetVassalLimit]"
 MBQ_TB_PREVIEW: "Demand tribute now: up to [GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )]"
 MBQ_TBO_HEAD: "Tributary contract wishes"
 MBQ_TBO_TT_HEAD: "#T Tributary Contract Wishes#!\n• For every new [tributary|E] from this window these wishes are applied right after acceptance\n• #warning @prestige_icon! Costs 150 [prestige|E] once per tributary, [opinion|E] -30 with them and -10 with your other tributaries, only if something changes#!"
 MBQ_TBO_NO_GUAR: "No duty to join their wars"
 MBQ_TBO_TT_NO_GUAR: "#T No Duty to Join Their Wars#!\n• The automation lowers your duty to join their wars where the game allows it"
 MBQ_TBO_TAX: "Higher taxes"
 MBQ_TBO_TT_TAX: "#T Higher Taxes#!\n• One step more [taxes|E] than at the start, only if the game allows it"
 MBQ_TBO_PRESTIGE: "More prestige"
 MBQ_TBO_TT_PRESTIGE: "#T More Prestige#!\n• One step more [prestige|E] transfer than at the start, only if the game allows it"
 MBQ_TBO_WAR: "They support your wars"
 MBQ_TBO_TT_WAR: "#T They Support Your Wars#!\n• The new tributary must join your wars, only if the game allows it"
 MBQ_VS_RULER_1: "ruler"
 MBQ_VS_RULER_N: "rulers"
 MBQ_VS_TT_RUN: "#T Run Now#!\n• Offers vassalage once to every matching ruler who would accept\n• Greyed out: nobody to offer to"
 MBQ_TB_TT_RUN: "#T Run Now#!\n• Demands tribute once from every matching neighbor who would accept\n• Greyed out: nobody to demand it from"
 MBQ_VS_MANDALA: "Mandala rulers: offering and demanding paused."
