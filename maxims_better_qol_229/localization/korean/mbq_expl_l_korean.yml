l_korean:
 MBQ_EXPL_Q:0 "?"
 MBQ_EXPL_TT:0 "#T 설명#!\n• 작위 수여 설정이 하는 일을 보여 줍니다\n• 다시 클릭하면 숨겨집니다"
 MBQ_EXPL_TITLE:0 "작위 수여 작동 방식"
 MBQ_EXPL_H_AUTO:0 "@domain_icon! 자동화"
 MBQ_EXPL_B_AUTO:0 "[domain_limit|E]를 넘으면, 모드가 초과한 @county_icon! [counties|E]을 다른 사람에게 넘깁니다. 저절로 또는 지금 실행으로 실행됩니다. 당신의 [capital|E]와 귀중으로 표시한 작위는 그대로 남습니다."
 MBQ_EXPL_H_WHO:0 "@vassal_icon! 수혜자"
 MBQ_EXPL_B_WHO:0 "작위는 당신의 직속 [vassals|E], [courtiers|E]와 가족에게 갑니다. 당신의 [primary_heir|E], 경쟁자, 천적에게는 가지 않습니다."
 MBQ_EXPL_H_FILTERS:0 "조건"
 MBQ_EXPL_B_FILTERS:0 "조건이 작위를 받을 수 있는 사람을 정합니다: [religion|E], [culture|E], 연령. 나쁜 특성을 가진 봉신은 건너뜁니다. 맞는 사람이 없으면 당신이 작위를 유지하며, 없으면 새로운 귀족을 켜면 당신 문화의 새로운 귀족이 받습니다."
 MBQ_EXPL_H_PRIOS:0 "선호"
 MBQ_EXPL_B_PRIOS:0 "#clickable 베이지#!: 필수. 선택한 것 중 어느 것에도 맞지 않는 사람은 제외됩니다.\n#color_light_blue 하늘색#!: 정렬만 합니다. 아무도 제외되지 않습니다.\n그다음 선호 1이 먼저 반영됩니다. 둘이 동점이면 선호 2가 정하고, 이어서 선호 3, 그다음도 같습니다."
 MBQ_EXPL_H_CAPS:0 "@county_icon! 수혜자별 제한"
 MBQ_EXPL_B_CAPS:0 "봉신은 한도가 허용하는 만큼의 백작령만 받습니다."
