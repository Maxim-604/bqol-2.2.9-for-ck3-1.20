l_korean:
 MBQ_RS_BTN_TT: "#T 몸값 자동화#!\n• 클릭: 설정을 열고, 다시 클릭하면 닫습니다\n• 오른쪽 클릭: 자동화 켜기/끄기"
 MBQ_RS_BTN_TT_ON: "#T 몸값 자동화#!\n• 클릭: 설정을 열고, 다시 클릭하면 닫습니다\n#P • 오른쪽 클릭: 자동화 켜기/끄기#!"
 MBQ_RS_WHO: "몸값으로 풀어 줄 대상"
 MBQ_RS_DUNGEON: "[dungeon|E]의 포로"
 MBQ_RS_HOUSE: "[house_arrest|E] 중인 포로"
 MBQ_RS_TT_DUNGEON: "#T 지하 감옥#!\n• 체크: 당신의 지하 감옥에 있는 포로를 포함합니다"
 MBQ_RS_TT_HOUSE: "#T 자택 연금#!\n• 체크: 자택 연금 중인 포로를 포함합니다"
 MBQ_RS_RANK: "몸값 요구: 이 등급까지 (포함)"
 MBQ_RS_T0: "작위 없음"
 MBQ_RS_T1: "남작"
 MBQ_RS_T2: "백작"
 MBQ_RS_T3: "공작"
 MBQ_RS_T4: "왕"
 MBQ_RS_TT_RANK: "#T 등급까지 몸값#!\n• 선택한 등급까지, 더 낮은 등급과 작위 없는 포로도 몸값을 받습니다\n• 포로가 가진 가장 높은 작위를 기준으로 하며, 황제는 제외입니다"
 MBQ_RS_TT_T1: "#T 남작#!\n• 작위 없는 포로와 남작에게 몸값을 요구합니다\n• [baron|E]은 가장 높은 작위가 [barony|E]인 통치자입니다"
 MBQ_RS_AUTO: "자동화 켜기"
 MBQ_RS_TT_AUTO: "#T 자동화#!\n• 선택한 주기마다 포로를 석방합니다. 당신에게만 적용됩니다"
 MBQ_RS_MONTHLY: "매월"
 MBQ_RS_QUARTERLY: "세 달마다"
 MBQ_RS_TT_TAKT: "#T 주기#!\n• 자동화가 포로를 확인하는 빈도\n• 변경은 즉시 적용됩니다: 다음 확인은 오늘부터 한 주기 뒤입니다"
 MBQ_RS_PREVIEW: "지금 몸값: [GetPlayer.MakeScope.Var('mbq_rs_prev_n').GetValue|0][SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_rs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_RS_PRISONER_1', 'MBQ_RS_PRISONER_N' )], 합계 @gold_icon! [GetPlayer.MakeScope.Var('mbq_rs_prev_gold').GetValue|0]"
 MBQ_RS_RUN: "지금 실행"
 MBQ_RS_TT_RUN: "#T 지금 실행#!\n• 지불자가 수락하는 해당 포로 모두에게 몸값을 한 번 제안합니다"
 mbq_rs_sum_title: "몸값으로 풀려난 포로"
 mbq_rs_sum_desc: "석방: [ROOT.Var('mbq_rs_n').GetValue|0]명의 포로, 합계 @gold_icon! [ROOT.Var('mbq_rs_sum').GetValue|0][ROOT.Char.Custom('mbq_rs_s1')][ROOT.Char.Custom('mbq_rs_s2')][ROOT.Char.Custom('mbq_rs_s3')][ROOT.Char.Custom('mbq_rs_s4')][ROOT.Char.Custom('mbq_rs_s5')][ROOT.Char.Custom('mbq_rs_more')]"
 mbq_rs_empty: ""
 mbq_rs_more_line: "\n외 [ROOT.Var('mbq_rs_rest').GetValue|0]명"
 mbq_rs_none_line: "\n해당하는 포로가 없었거나 수락한 지불자가 없었습니다."
 message_filter_mbq_ransom_summary: "몸값으로 풀려난 포로 (Better Quality of Life)"
 message_filter_mbq_ransom_summary_desc: "Better Quality of Life가 당신을 대신해 낸 몸값 제안의 요약입니다."
 mbq_rs_line1_gold: "\n[ROOT.Var('mbq_rs_c1').Char.GetShortUIName][ROOT.Var('mbq_rs_c1').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g1').GetValue|0]"
 mbq_rs_line1_hook: "\n[ROOT.Var('mbq_rs_c1').Char.GetShortUIName][ROOT.Var('mbq_rs_c1').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line2_gold: "\n[ROOT.Var('mbq_rs_c2').Char.GetShortUIName][ROOT.Var('mbq_rs_c2').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g2').GetValue|0]"
 mbq_rs_line2_hook: "\n[ROOT.Var('mbq_rs_c2').Char.GetShortUIName][ROOT.Var('mbq_rs_c2').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line3_gold: "\n[ROOT.Var('mbq_rs_c3').Char.GetShortUIName][ROOT.Var('mbq_rs_c3').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g3').GetValue|0]"
 mbq_rs_line3_hook: "\n[ROOT.Var('mbq_rs_c3').Char.GetShortUIName][ROOT.Var('mbq_rs_c3').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line4_gold: "\n[ROOT.Var('mbq_rs_c4').Char.GetShortUIName][ROOT.Var('mbq_rs_c4').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g4').GetValue|0]"
 mbq_rs_line4_hook: "\n[ROOT.Var('mbq_rs_c4').Char.GetShortUIName][ROOT.Var('mbq_rs_c4').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line5_gold: "\n[ROOT.Var('mbq_rs_c5').Char.GetShortUIName][ROOT.Var('mbq_rs_c5').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g5').GetValue|0]"
 mbq_rs_line5_hook: "\n[ROOT.Var('mbq_rs_c5').Char.GetShortUIName][ROOT.Var('mbq_rs_c5').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 MBQ_RS_MIN_HEAD: "최소 몸값"
 MBQ_RS_MIN_100: "전액"
 MBQ_RS_MIN_STAFFEL: "투옥 기간에 따라"
 MBQ_RS_TT_MIN: "#T 몸값#!\n• 즉시: 실제 @gold_icon! 금화면 충분. 전액: 몸값 전액\n• 투옥 기간에 따라: 포로가 오래 기다릴수록 더 적어도 충분"
 MBQ_RS_EXCL_HEAD: "계속 투옥할 대상"
 MBQ_RS_TT_EXCL: "#T 계속 투옥할 대상#!\n• 이런 죄수는 자동화가 절대 풀어 주지 않음\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_NOTE_EXEMPT: "• 감옥 탭의 일괄 작업에 설정한 제외는 여기에 적용되지 않음. 이 창의 제외를 사용하세요"
 MBQ_RS_EX_WAR: "@war_icon! 전쟁 적대자"
 MBQ_RS_EX_CLAIM: "당신의 작위에 대한 명분"
 MBQ_RS_EX_RIVAL: "경쟁자와 천적"
 MBQ_RS_EX_DYN: "자신의 가문"
 MBQ_RS_TT_EX_WAR: "#T 전쟁 적대자#!\n• 포로, 그를 대신해 내는 주군, 또는 그가 물려받을 작위의 보유자가 당신과 [war|E] 중입니다"
 MBQ_RS_TT_EX_CLAIM: "#T 당신의 작위에 대한 명분#!\n• 포로가 당신의 [duchy|E] 이상 작위에 대한 [claim|E]을(를) 가짐\n• 또는 등급과 관계없이 당신의 [primary_title|E]에 대해"
 MBQ_RS_TT_EX_RIVAL: "#T 경쟁자와 천적#!\n• 포로가 당신의 [rival|E] 또는 [nemesis|E]"
 MBQ_RS_TT_EX_DYN: "#T 자신의 가문#!\n• 포로가 당신의 [dynasty|E] 소속 (가까운 가족 대부분 포함)"
 MBQ_RS_TT_AUTO_X: "$MBQ_RS_TT_AUTO$\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_TT_RUN_X: "$MBQ_RS_TT_RUN$\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_TT_AUTO_BLOCKED: "#T 자동화#!\n• #N 멈춤:#! 최소 몸값 단계가 선택되지 않음\n• 최소 몸값에서 한 단계를 체크"
 MBQ_RS_TT_RUN_BLOCKED: "#T 지금 실행#!\n• #N 잠김:#! 최소 몸값 단계가 선택되지 않음\n• 최소 몸값에서 한 단계를 체크"
 MBQ_CAT_GENERAL: "신앙과 개종"
 MBQ_CAT_PRISON: "감옥과 몸값"
 MBQ_CAT_VASSALS: "봉신과 조공: 자동화"
 MBQ_CAT_COUNTIES: "작위 수여"
 MBQ_RS_TAKT: "주기"
 MBQ_RS_TT_RED: "#T 잘못된 선택#!\n• 이 그룹에서 칸을 하나 이상 체크\n• 그때까지 자동화는 멈추고 지금 실행은 회색으로 유지됩니다"
 MBQ_RS_MIN_NOW: "즉시"
 MBQ_RS_EX_FACTION: "파벌 지도자 (반란 포함)"
 MBQ_RS_EX_HOOK: "구실이 있는 포로"
 MBQ_RS_TT_EX_FACTION: "#T 파벌 지도자#!\n• 체크: 당신에게 맞선 모든 [faction|E]의 지도자는 농민 반란과 독립 파벌을 포함해 몸값으로 풀어 주지 않음"
 MBQ_RS_TT_EX_HOOK: "#T 구실#!\n• 체크: 당신이 [hook|E]을(를) 쥔 포로는 약한 구실을 포함해 몸값으로 풀어 주지 않음"
 MBQ_RS_RED_LEGEND: "빨간색 표시: 이 설정에서는 자동화가 작동하지 않습니다."
 MBQ_RS_EXC_ALL: "모두"
 MBQ_RS_EXC_RESET: "없음"
 MBQ_RS_TT_MIN_NOW: "#T 즉시#!\n• 실제 [gold|E]이면 충분\n• [gold|E]를 제시하지 않고 [hook|E] 등만 내미는 지불자는 받아들여지지 않음"
 MBQ_RS_TT_MIN_100: "#T 전액#!\n• 지불자가 몸값 전액을 내야 함\n• [gold|E]를 제시하지 않고 [hook|E] 등만 내미는 지불자는 받아들여지지 않음"
 MBQ_RS_TT_MIN_STAFFEL: "#T 투옥 기간에 따라#!\n• 포로가 오래 갇혀 있을수록 더 적은 @gold_icon! 몸값으로 충분합니다\n• 아주 오래되면 실제 금화면 충분합니다"
 MBQ_RS_PRISONER_1: "명의 포로"
 MBQ_RS_PRISONER_N: "명의 포로"
 MBQ_RS_EX_VASSAL: "@vassal_icon! 직속 봉신"
 MBQ_RS_EX_SUBVASSAL: "@vassal_icon! 간접 봉신"
 MBQ_RS_TT_EX_VASSAL: "#T 직속 봉신#!\n• 체크: 당신의 직속 [vassals|E]은(는) 몸값으로 풀어 주지 않음"
 MBQ_RS_TT_EX_SUBVASSAL: "#T 간접 봉신#!\n• 체크: 당신 봉신의 봉신은 몸값으로 풀어 주지 않음\n• 당신의 왕국에서 당신 아래에 있지만, 직속 [vassals|E]은(는) 아님"
 MBQ_RS_NOBODY: "아무도 없음"
 MBQ_RS_TT_NOBODY: "#T 아무도 없음#!\n• 몸값을 받는 포로가 없습니다\n• 자동화가 멈추고 지금 실행은 회색으로 남습니다"
 MBQ_RS_TT_T0: "#T 작위 없음#!\n• 영지 작위가 없는 포로만 몸값을 요구합니다\n• 포로가 가진 가장 높은 작위를 기준으로 합니다"
 MBQ_RS_TT_T2: "#T 백작#!\n• 작위 없는 포로, 남작, 백작에게 몸값을 요구합니다\n• 포로가 가진 가장 높은 작위를 기준으로 합니다"
 MBQ_RS_TT_T3: "#T 공작#!\n• 공작까지의 포로에게 몸값을 요구합니다\n• 포로가 가진 가장 높은 작위를 기준으로 합니다"
 MBQ_RS_TT_T4: "#T 왕#!\n• 왕까지의 포로에게 몸값을 요구하며, 황제는 제외입니다\n• 포로가 가진 가장 높은 작위를 기준으로 합니다"
