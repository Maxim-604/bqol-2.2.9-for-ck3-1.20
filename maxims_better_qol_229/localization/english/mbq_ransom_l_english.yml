 MBQ_RS_TT_HOUSE: "#T House Arrest#!\n• Ticked: prisoners under house arrest are included"
 MBQ_RS_RANK: "Ransom up to rank (including)"
 MBQ_RS_T0: "No title"
 MBQ_RS_T1: "Baron"
 MBQ_RS_T2: "Count"
 MBQ_RS_T3: "Duke"
 MBQ_RS_T4: "King"
 MBQ_RS_TT_RANK: "#T Ransom Up To Rank#!\n• Prisoners up to the chosen rank are ransomed, lower ranks and prisoners without a title included\n• The prisoner's highest title counts, emperors never"
