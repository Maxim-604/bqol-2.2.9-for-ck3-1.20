l_korean:
 MBQ_VS_AUTO_HEAD: "자동화"
 MBQ_VS_TT_AUTO_HEAD: "#T 자동화#!\n• 제안과 요구는 수락할 통치자에게만 갑니다\n• 당신에게 온 제안은 아래 선택대로 수락됩니다"
 MBQ_VS_AUTO_VS: "@vassal_icon! 봉신 제안"
 MBQ_VS_AUTO_TB: "@tributary_icon! 조공국 요구"
 MBQ_VS_TT_AUTO_VS: "#T 봉신 제안#!\n• 조건에 맞고 수락할 통치자 모두에게 당신에게 가장 좋은 계약으로 봉신 관계를 제안합니다\n• [vassal_limit|E]에 여유가 있을 때만"
 MBQ_VS_TT_AUTO_TB: "#T 조공국 요구#!\n• 조건에 맞고 수락할 이웃 모두에게 일반 상호작용처럼 조공을 요구합니다\n• #warning @prestige_icon! 일반 상호작용처럼 [prestige|E]을 소모합니다#!"
 MBQ_VS_TT_MIN_HEAD: "#T 계약#!\n• 봉신 제안, 충성 서약 제안 수락, 조공 제안 수락에 쓰입니다\n• 조공국 요구에는 쓰이지 않습니다"
 MBQ_VS_MIN_HIGH: "높음"
 MBQ_VS_MIN_NORMAL: "보통"
 MBQ_VS_MIN_LOW: "낮음"
 MBQ_VS_TT_MIN_HIGH: "#T 높음#!\n• 높은 [obligations|E]만\n• 당신에게 온 제안: 높은 것만 자동 수락됩니다"
 MBQ_VS_TT_MIN_NORMAL: "#T 보통#!\n• 높은 것을 먼저, 그다음 보통 [obligations|E]\n• 당신에게 온 제안: 높은 것과 보통이 자동 수락됩니다"
 MBQ_VS_TT_MIN_LOW: "#T 낮음#!\n• 높은 것, 보통, 낮은 [obligations|E] 순서로\n• 당신에게 온 제안: 모든 제안이 자동 수락됩니다"
 MBQ_VS_WHO: "봉신 관계를 제안할 대상:"
 MBQ_VS_TT_WHO: "#T 묻는 대상#!\n• 봉신 제안에만 적용됩니다\n• 조공국 요구는 항상 독립한 이웃을 대상으로 합니다"
 MBQ_VS_NB: "독립한 이웃"
 MBQ_VS_TRIB: "당신의 조공국"
 MBQ_VS_TT_NB: "#T 독립한 이웃#!\n• 체크: 당신의 [realm|E]과 맞닿은 독립 영주에게 묻습니다 (바다 건너도 포함)"
 MBQ_VS_TT_TRIB: "#T 당신의 조공국#!\n• 체크: 당신의 조공국에게도 묻습니다"
 MBQ_VS_RANK: "지위 상한 (해당 지위 포함)"
 MBQ_VS_TT_RANK: "#T 지위 상한#!\n• 이 지위까지의 통치자에게 제안하고, 그들의 제안은 자동 수락됩니다\n• 황제에게는 제안하지 않습니다"
 MBQ_VS_EXCL_HEAD: "제외할 통치자"
 MBQ_VS_TT_EXCL: "#T 예외#!\n• 체크: 자동화는 이런 영주에게 묻지 않고 그들의 제안도 수락하지 않습니다\n• 그들의 제안은 평소처럼 도착합니다"
 MBQ_VS_EX_RIVAL: "경쟁자와 천적"
 MBQ_VS_EX_CLAIM: "당신의 작위에 대한 명분"
 MBQ_VS_EX_FAITH: "@religious_icon! 다른 신앙"
 MBQ_VS_EX_FACTION: "@faction_icon! 파벌 지도자"
 MBQ_VS_TT_EX_RIVAL: "#T 경쟁자와 천적#!\n• 영주가 당신의 [rival|E] 또는 [nemesis|E]입니다"
 MBQ_VS_TT_EX_CLAIM: "#T 당신의 작위에 대한 명분#!\n• 영주가 백작 이상인 당신의 작위에 [claim|E]을 가지고 있습니다"
 MBQ_VS_TT_EX_FAITH: "#T 다른 신앙#!\n• 영주가 당신과 다른 [faith|E]을 믿습니다"
 MBQ_VS_TT_EX_FACTION: "#T 파벌 지도자#!\n• 영주가 당신에 맞선 [faction|E]을 이끕니다"
 MBQ_VS_PREVIEW: "지금 봉신 제안: [GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue|0][SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )], @vassal_icon! [GetPlayer.GetNumVassalsTowardsLimit]/[GetPlayer.GetVassalLimit]"
 MBQ_TB_PREVIEW: "지금 조공 요구: 최대 [GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue|0][SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )]"
 MBQ_TBO_HEAD: "조공국 계약 희망 사항"
 MBQ_TBO_TT_HEAD: "#T 조공국 계약 희망 사항#!\n• 이 창에서 생기는 새 [tributary|E] 모두에게 수락 직후 이 희망 사항이 적용됩니다\n• #warning @prestige_icon! 변경이 있을 때만 조공국 하나당 [prestige|E] 150을 한 번 소모, [opinion|E] 상대에게 -30, 다른 조공국에게 -10#!"
 MBQ_TBO_NO_GUAR: "그들의 전쟁에 참여할 의무 없음"
 MBQ_TBO_TT_NO_GUAR: "#T 그들의 전쟁에 참여할 의무 없음#!\n• 게임이 허용하는 범위에서 자동화가 그들의 전쟁에 참여할 당신의 의무를 줄입니다"
 MBQ_TBO_TAX: "더 높은 세금"
 MBQ_TBO_TT_TAX: "#T 더 높은 세금#!\n• 처음보다 [taxes|E] 한 단계 더, 게임이 허용할 때만"
 MBQ_TBO_PRESTIGE: "더 많은 위신"
 MBQ_TBO_TT_PRESTIGE: "#T 더 많은 위신#!\n• 처음보다 [prestige|E] 이전 한 단계 더, 게임이 허용할 때만"
 MBQ_TBO_WAR: "당신의 전쟁 지원"
 MBQ_TBO_TT_WAR: "#T 당신의 전쟁 지원#!\n• 새 조공국이 당신의 전쟁에 참여해야 합니다, 게임이 허용할 때만"
 MBQ_VS_RULER_1: "명의 영주"
 MBQ_VS_RULER_N: "명의 영주"
 MBQ_VS_TT_RUN: "#T 지금 실행#!\n• 수락할 해당 통치자 모두에게 봉신 관계를 한 번 제안합니다\n• 회색: 제안할 대상 없음"
 MBQ_TB_TT_RUN: "#T 지금 실행#!\n• 수락할 해당 이웃 모두에게 조공을 한 번 요구합니다\n• 회색: 요구할 대상 없음"
 MBQ_VS_MANDALA: "만다라 통치자: 제안과 요구가 멈췄습니다."
 mbq_vs_sum_title: "새 봉신"
 mbq_vs_sum_desc: "봉신 수락: [ROOT.Var('mbq_vs_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_vs_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )][ROOT.Char.Custom('mbq_vs_s1')][ROOT.Char.Custom('mbq_vs_s2')][ROOT.Char.Custom('mbq_vs_s3')][ROOT.Char.Custom('mbq_vs_s4')][ROOT.Char.Custom('mbq_vs_s5')][ROOT.Char.Custom('mbq_vs_more')]"
 mbq_vs_more_line: "\n외 [ROOT.Var('mbq_vs_rest').GetValue|0]명"
 mbq_vs_none_line: "\n해당자가 없었거나 아무도 수락하지 않았습니다."
 MBQ_TB_TT_OFF: "#T 조공 요구#!\n• 평시에 조공을 요구할 수 있는 것은 [nomads|E], [steppe_admin|E] 통치자, [celestial|E] [hegemons|E]뿐입니다\n• [mandala|E] 통치자는 대신 [tributaries|E]을 거느립니다"
 mbq_tb_sum_title: "새 조공국"
 mbq_tb_sum_desc: "당신의 조공국이 됨: [ROOT.Var('mbq_tb_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_tb_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )][ROOT.Char.Custom('mbq_tb_s1')][ROOT.Char.Custom('mbq_tb_s2')][ROOT.Char.Custom('mbq_tb_s3')][ROOT.Char.Custom('mbq_tb_s4')][ROOT.Char.Custom('mbq_tb_s5')][ROOT.Char.Custom('mbq_tb_more')]"
 mbq_tb_more_line: "\n외 [ROOT.Var('mbq_tb_rest').GetValue|0]명"
 mbq_tb_none_line: "\n해당자가 없었거나 아무도 수락하지 않았습니다."
 message_filter_mbq_vassal_summary: "새 봉신과 조공국 (Better Quality of Life)"
 message_filter_mbq_vassal_summary_desc: "Better Quality of Life가 당신 대신 보낸 봉신 제안과 조공 요구의 요약입니다."
