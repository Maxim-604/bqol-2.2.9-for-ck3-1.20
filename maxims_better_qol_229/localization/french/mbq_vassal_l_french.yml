l_french:
 MBQ_VS_AUTO_HEAD: "Automatisation"
 MBQ_VS_TT_AUTO_HEAD: "#T Automatisation#!\n• Offres et exigences : seulement aux dirigeants consentants\n• Offres reçues acceptées selon le choix"
 MBQ_VS_AUTO_VS: "@vassal_icon! Proposer la vassalité"
 MBQ_VS_AUTO_TB: "@tributary_icon! Exiger comme tributaire"
 MBQ_VS_TT_AUTO_VS: "#T Proposer la vassalité#!\n• Propose la vassalité à chaque dirigeant consentant, au meilleur contrat\n• Seulement s’il reste de la place sous votre [vassal_limit|El]"
 MBQ_VS_TT_AUTO_TB: "#T Exiger comme tributaire#!\n• Exige un tribut de chaque voisin consentant, comme l’interaction normale\n• #warning @prestige_icon! Coûte du [prestige|El] comme l’interaction normale#!"
 MBQ_VS_TT_MIN_HEAD: "#T Contrat#!\n• Sert pour proposer la vassalité et accepter les offres de fidélité et de tributaire\n• Pas utilisé pour exiger comme tributaire"
 MBQ_VS_MIN_HIGH: "Élevées"
 MBQ_VS_MIN_NORMAL: "Normales"
 MBQ_VS_MIN_LOW: "Basses"
 MBQ_VS_TT_MIN_HIGH: "#T Élevées#!\n• Seulement des [obligations|El] élevées\n• Offres qui vous sont faites : seules les élevées sont acceptées automatiquement"
 MBQ_VS_TT_MIN_NORMAL: "#T Normales#!\n• D’abord élevées, puis [obligations|El] normales\n• Offres qui vous sont faites : les élevées et les normales sont acceptées automatiquement"
 MBQ_VS_TT_MIN_LOW: "#T Basses#!\n• D’abord élevées, puis normales, puis [obligations|El] basses\n• Offres qui vous sont faites : toute offre est acceptée automatiquement"
 MBQ_VS_WHO: "Proposer la vassalité à :"
 MBQ_VS_TT_WHO: "#T Qui est sollicité#!\n• Vaut seulement pour la vassalité\n• Exiger comme tributaire s’adresse toujours aux voisins indépendants"
 MBQ_VS_NB: "Voisins indépendants"
 MBQ_VS_TRIB: "Vos tributaires"
 MBQ_VS_TT_NB: "#T Voisins indépendants#!\n• Coché : les dirigeants indépendants voisins de votre [realm|El] sont sollicités, même par-delà l’eau"
 MBQ_VS_TT_TRIB: "#T Vos tributaires#!\n• Coché : vos propres tributaires sont aussi sollicités"
 MBQ_VS_RANK: "Jusqu’au rang (inclus)"
 MBQ_VS_TT_RANK: "#T Jusqu’au rang#!\n• Les dirigeants jusqu’à ce rang sont sollicités, et leurs offres sont acceptées automatiquement\n• Les empereurs ne sont jamais sollicités"
 MBQ_VS_EXCL_HEAD: "Ignorer ces dirigeants"
 MBQ_VS_TT_EXCL: "#T Exceptions#!\n• Coché : l’automatisation ne sollicite jamais ces dirigeants et n’accepte jamais leurs offres\n• Leurs offres arrivent comme d’habitude"
 MBQ_VS_EX_RIVAL: "Rivaux et ennemis jurés"
 MBQ_VS_EX_CLAIM: "Revendications sur vos titres"
 MBQ_VS_EX_FAITH: "@religious_icon! Autre foi"
 MBQ_VS_EX_FACTION: "@faction_icon! Chefs de faction"
 MBQ_VS_TT_EX_RIVAL: "#T Rivaux et ennemis jurés#!\n• Le dirigeant est votre [rival|El] ou votre [nemesis|El]"
 MBQ_VS_TT_EX_CLAIM: "#T Revendications sur vos titres#!\n• Le dirigeant a une [claim|El] sur l’un de vos titres de rang comté ou supérieur"
 MBQ_VS_TT_EX_FAITH: "#T Autre foi#!\n• Le dirigeant suit une autre [faith|El] que vous"
 MBQ_VS_TT_EX_FACTION: "#T Chefs de faction#!\n• Le dirigeant dirige une [faction|El] contre vous"
 MBQ_VS_PREVIEW: "Vassalité maintenant : [GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )], @vassal_icon! [GetPlayer.GetNumVassalsTowardsLimit]/[GetPlayer.GetVassalLimit]"
 MBQ_TB_PREVIEW: "Tribut maintenant : jusqu’à [GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )]"
 MBQ_TBO_HEAD: "Souhaits de contrat tributaire"
 MBQ_TBO_TT_HEAD: "#T Souhaits de contrat tributaire#!\n• Pour chaque nouveau [tributary|El] d’ici, appliqués après l’acceptation\n• #warning @prestige_icon! Coûte 150 [prestige|El] par tributaire, [opinion|El] -30 envers lui et -10 envers les autres, seulement si quelque chose change#!"
 MBQ_TBO_NO_GUAR: "Pas d’obligation de rejoindre leurs guerres"
 MBQ_TBO_TT_NO_GUAR: "#T Pas d’obligation de guerre#!\n• Réduit votre obligation de rejoindre leurs guerres, si possible"
 MBQ_TBO_TAX: "Impôts plus élevés"
 MBQ_TBO_TT_TAX: "#T Impôts plus élevés#!\n• Un cran de [taxes|El] de plus qu’au départ, seulement si le jeu le permet"
 MBQ_TBO_PRESTIGE: "Plus de prestige"
 MBQ_TBO_TT_PRESTIGE: "#T Plus de prestige#!\n• Un cran de transfert de [prestige|El] de plus qu’au départ, seulement si le jeu le permet"
 MBQ_TBO_WAR: "Ils soutiennent vos guerres"
 MBQ_TBO_TT_WAR: "#T Ils soutiennent vos guerres#!\n• Le nouveau tributaire doit rejoindre vos guerres, seulement si le jeu le permet"
 MBQ_VS_RULER_1: "dirigeant"
 MBQ_VS_RULER_N: "dirigeants"
 MBQ_VS_TT_RUN: "#T Lancer maintenant#!\n• Propose une fois la vassalité à chaque dirigeant correspondant qui accepterait\n• Grisé : personne à qui proposer"
 MBQ_TB_TT_RUN: "#T Lancer maintenant#!\n• Exige une fois un tribut de chaque voisin correspondant qui accepterait\n• Grisé : personne à qui l’exiger"
 MBQ_VS_MANDALA: "Dirigeants de mandala : offres et exigences suspendues."
 mbq_vs_sum_title: "Nouveaux vassaux"
 mbq_vs_sum_desc: "Vassalité acceptée : [ROOT.Var('mbq_vs_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_vs_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )][ROOT.Char.Custom('mbq_vs_s1')][ROOT.Char.Custom('mbq_vs_s2')][ROOT.Char.Custom('mbq_vs_s3')][ROOT.Char.Custom('mbq_vs_s4')][ROOT.Char.Custom('mbq_vs_s5')][ROOT.Char.Custom('mbq_vs_more')]"
 mbq_vs_more_line: "\net [ROOT.Var('mbq_vs_rest').GetValue|0] autres"
 mbq_vs_none_line: "\nAucun dirigeant ne correspondait, ou personne n’a accepté."
 MBQ_TB_TT_OFF: "#T Exiger un tribut#!\n• Seuls les [nomads|El], les dirigeants de [steppe_admin|El] et les [hegemons|El] [celestial|El] peuvent exiger un tribut en temps de paix\n• Les dirigeants de [mandala|El] accueillent plutôt des [tributaries|El]"
 mbq_tb_sum_title: "Nouveaux tributaires"
 mbq_tb_sum_desc: "Devenus vos tributaires : [ROOT.Var('mbq_tb_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_tb_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )][ROOT.Char.Custom('mbq_tb_s1')][ROOT.Char.Custom('mbq_tb_s2')][ROOT.Char.Custom('mbq_tb_s3')][ROOT.Char.Custom('mbq_tb_s4')][ROOT.Char.Custom('mbq_tb_s5')][ROOT.Char.Custom('mbq_tb_more')]"
 mbq_tb_more_line: "\net [ROOT.Var('mbq_tb_rest').GetValue|0] autres"
 mbq_tb_none_line: "\nAucun dirigeant ne correspondait, ou personne n’a accepté."
 message_filter_mbq_vassal_summary: "Nouveaux vassaux et tributaires (Better Quality of Life)"
 message_filter_mbq_vassal_summary_desc: "Récapitulatif des propositions de vassalité et des exigences de tribut faites pour vous par Better Quality of Life."
 mbq_vs_line1: "\n[ROOT.Var('mbq_vs_c1').Char.GetShortUIName][ROOT.Var('mbq_vs_c1').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_vs_line2: "\n[ROOT.Var('mbq_vs_c2').Char.GetShortUIName][ROOT.Var('mbq_vs_c2').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_vs_line3: "\n[ROOT.Var('mbq_vs_c3').Char.GetShortUIName][ROOT.Var('mbq_vs_c3').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_vs_line4: "\n[ROOT.Var('mbq_vs_c4').Char.GetShortUIName][ROOT.Var('mbq_vs_c4').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_vs_line5: "\n[ROOT.Var('mbq_vs_c5').Char.GetShortUIName][ROOT.Var('mbq_vs_c5').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line1: "\n[ROOT.Var('mbq_tb_c1').Char.GetShortUIName][ROOT.Var('mbq_tb_c1').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line2: "\n[ROOT.Var('mbq_tb_c2').Char.GetShortUIName][ROOT.Var('mbq_tb_c2').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line3: "\n[ROOT.Var('mbq_tb_c3').Char.GetShortUIName][ROOT.Var('mbq_tb_c3').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line4: "\n[ROOT.Var('mbq_tb_c4').Char.GetShortUIName][ROOT.Var('mbq_tb_c4').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line5: "\n[ROOT.Var('mbq_tb_c5').Char.GetShortUIName][ROOT.Var('mbq_tb_c5').Char.Custom('GetPrimaryTitleTierIcon')]"
 MBQ_VS_ACC_VS: "Accepter les offres de fidélité"
 MBQ_VS_TT_ACC_VS: "#T Accepter les offres de fidélité#!\n• Accepte aussitôt l’offre d’un dirigeant de vous jurer fidélité, comme si vous cliquiez vous-même sur Accepter\n• Seulement les offres au moins au niveau de votre contrat minimum et dans le rang choisi"
 MBQ_VS_ACC_TB: "Accepter les offres de tributaire"
 MBQ_VS_TT_ACC_TB: "#T Accepter les offres de tributaire#!\n• Accepte aussitôt l’offre d’un dirigeant de devenir votre [tributary|El], comme si vous cliquiez vous-même sur Accepter\n• Seulement les offres au moins au niveau de votre contrat minimum et dans le rang choisi"
 MBQ_VS_ACC_FROM: "De"
 MBQ_VS_TT_ACC_NOMADS: "#T Pour les nomades#!\n• Coché : les offres de [nomad_i|E] [nomads|El] et d’autres dirigeants à troupeaux ([herder|El]) sont acceptées automatiquement"
 MBQ_VS_TT_ACC_ALL: "#T Tous les autres#!\n• Coché : les offres de tous les dirigeants sans troupeau sont acceptées automatiquement\n• Tous sauf les royaumes de [nomads|El] et de [herder|El], qui ont leur propre case"
 mbq_fealty_auto_accepted_toast: "Offre de fidélité acceptée automatiquement"
 MBQ_VS_TB_SILENT: "Messages en sourdine"
 MBQ_VS_TT_TB_SILENT: "#T Messages en sourdine#!\n• Les offres qui vous sont faites arrivent sans fenêtre d’offre\n• L’automatisation accepte ce que vos cases permettent et refuse le reste ; les messages n’apparaissent que dans le journal"
 mbq_acc_last_desc: "[ROOT.Var('mbq_acc_last').Char.GetShortUIName][ROOT.Var('mbq_acc_last').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tributary_hegemon_offer: "Offre de tributaire reçue"
 MBQ_TBO_COST: "Un changement coûte une fois 150 @prestige_icon! [prestige|El] par tributaire"
 MBQ_VS_MASTER: "Automatisation : vassaux et tribut"
 MBQ_VS_TT_MASTER: "#T Automatisation : vassaux et tribut#!"
