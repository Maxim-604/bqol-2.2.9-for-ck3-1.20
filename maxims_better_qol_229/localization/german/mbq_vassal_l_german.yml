 MBQ_TB_TT_OFF: "#T Tribut verlangen#!\n• Nur [nomads|E], [steppe_admin|E]-Herrscher und [celestial|E] [hegemons|E] können im Frieden Tribut verlangen\n• [mandala|E]-Herrscher nehmen stattdessen [tributaries|E] auf"
 mbq_tb_sum_title: "Neue Tributzahler"
 mbq_tb_sum_desc: "Neue Tributzahler: [ROOT.Var('mbq_tb_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_tb_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )][ROOT.Char.Custom('mbq_tb_s1')][ROOT.Char.Custom('mbq_tb_s2')][ROOT.Char.Custom('mbq_tb_s3')][ROOT.Char.Custom('mbq_tb_s4')][ROOT.Char.Custom('mbq_tb_s5')][ROOT.Char.Custom('mbq_tb_more')]"
