 MBQ_TT_DIVORCE: "#T 모든 [divorce|E] 요청 수락#!\n$EFFECT_LIST_BULLET$ [head_of_faith|E]로서 받는 모든 ‘이혼 요청’을 묻지 않고 수락합니다.\n$EFFECT_LIST_BULLET$ [dynast|E]가 가족을 대신해 보내는 요청도 포함됩니다.\n\n#weak 체크하지 않으면: 기본 게임과 같습니다.#!"
 MBQ_TT_DIVORCE_ON: "#T 모든 [divorce|E] 요청 수락#!\n#P $EFFECT_LIST_BULLET$ [head_of_faith|E]로서 받는 모든 ‘이혼 요청’을 묻지 않고 수락합니다.\n$EFFECT_LIST_BULLET$ [dynast|E]가 가족을 대신해 보내는 요청도 포함됩니다.#!"
 MBQ_TT_TRIB_NOMADS: "#T 유목민용#!\n$EFFECT_LIST_BULLET$ [nomads|E]와 [herder|E] 국가의 [tributary|E] 제안은 묻지 않고 수락됩니다.\n$EFFECT_LIST_BULLET$ 다른 통치자가 당신에게 하는 제안만 해당합니다. 당신의 요구는 봉신에 있습니다.\n$EFFECT_LIST_BULLET$ 다른 통치자는 아래 칸으로 정합니다.\n\n#weak 체크하지 않음: 기본 게임과 같습니다.#!"
 MBQ_TT_TRIB_ALL: "#T 그 밖의 모두#!\n$EFFECT_LIST_BULLET$ [nomads|E]와 [herder|E] 국가를 제외한 모든 통치자의 [tributary|E] 제안은 묻지 않고 수락됩니다.\n$EFFECT_LIST_BULLET$ 다른 통치자가 당신에게 하는 제안만 해당합니다. 당신의 요구는 봉신에 있습니다.\n$EFFECT_LIST_BULLET$ 그 국가들은 위 칸으로 정합니다.\n\n#weak 체크하지 않음: 기본 게임과 같습니다.#!"
 MBQ_TT_GRANT: "#T 자동화: 봉신을 정당한 주군에게 수여#!\n$EFFECT_LIST_BULLET$ 더 큰 봉신의 영토에 속한 작은 [vassals|E]을 분기마다 그 봉신에게 넘깁니다.\n$EFFECT_LIST_BULLET$ 그 봉신이 정당한 [liege|E]입니다."
 MBQ_TT_GRANT_ON: "#T 자동화: 봉신을 정당한 주군에게 수여#!\n#P $EFFECT_LIST_BULLET$ 더 큰 봉신의 영토에 속한 작은 [vassals|E]을 분기마다 그 봉신에게 넘깁니다.\n$EFFECT_LIST_BULLET$ 그 봉신이 정당한 [liege|E]입니다.#!"
