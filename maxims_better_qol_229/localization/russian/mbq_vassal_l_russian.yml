 mbq_vs_line5: "\n[ROOT.Var('mbq_vs_c5').Char.GetShortUIName][ROOT.Var('mbq_vs_c5').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line1: "\n[ROOT.Var('mbq_tb_c1').Char.GetShortUIName][ROOT.Var('mbq_tb_c1').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line2: "\n[ROOT.Var('mbq_tb_c2').Char.GetShortUIName][ROOT.Var('mbq_tb_c2').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line3: "\n[ROOT.Var('mbq_tb_c3').Char.GetShortUIName][ROOT.Var('mbq_tb_c3').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line4: "\n[ROOT.Var('mbq_tb_c4').Char.GetShortUIName][ROOT.Var('mbq_tb_c4').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line5: "\n[ROOT.Var('mbq_tb_c5').Char.GetShortUIName][ROOT.Var('mbq_tb_c5').Char.Custom('GetPrimaryTitleTierIcon')]"
 MBQ_VS_ACC_VS: "@vassal_icon! Принимать присягу"
 MBQ_VS_TT_ACC_VS: "#T Принимать присягу#!\n• Сразу принимает предложение правителя присягнуть на верность, как будто вы сами нажали «Принять»\n• Только предложения на уровне вашего минимального договора или выше и в выбранном ранге"
 MBQ_VS_ACC_TB: "@tributary_icon! Принимать данников"
 MBQ_VS_TT_ACC_TB: "#T Принимать предложения дани#!\n• Сразу принимает предложение правителя стать вашим [Concept( 'tributary', 'данником' )|E], как будто вы сами нажали «Принять»\n• Только предложения на уровне вашего минимального договора или выше и в выбранном ранге"
 MBQ_VS_ACC_FROM: "От"
 MBQ_VS_TT_ACC_NOMADS: "#T Для кочевников#!\n• Отмечено: предложения от [nomad_i|E] [Concept( 'nomads', 'кочевников' )|E] и других правителей со стадами принимаются автоматически"
 MBQ_VS_TT_ACC_ALL: "#T Все остальные#!\n• Отмечено: предложения от всех правителей без стад принимаются автоматически\n• Все, кроме держав кочевников и скотоводов, у них своё поле"
 mbq_fealty_auto_accepted_toast: "Присяга на верность принята автоматически"
 MBQ_VS_TB_SILENT: "Заглушить сообщения"
 MBQ_VS_TT_TB_SILENT: "#T Заглушить сообщения#!\n• Предложения вам приходят без окон предложений\n• Автоматизация принимает то, что подходит вашим отметкам, остальное отклоняет; сообщения видны только в журнале"
 mbq_acc_last_desc: "[ROOT.Var('mbq_acc_last').Char.GetShortUIName][ROOT.Var('mbq_acc_last').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tributary_hegemon_offer: "Получено предложение дани"
 MBQ_TBO_COST: "Смена: 150 @prestige_icon! [Concept( 'prestige', 'престижа' )|E] разово за данника"
 MBQ_VS_MASTER: "Автоматизация: вассалы и дань"
 MBQ_VS_TT_MASTER: "#T Автоматизация: вассалы и дань#!"
