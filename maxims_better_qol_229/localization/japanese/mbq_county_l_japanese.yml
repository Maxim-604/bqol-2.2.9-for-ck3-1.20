l_japanese:
 MBQ_GR_AUTO_HEAD: "自動化：上限を超えた分を譲渡"
 MBQ_GR_TT_AUTO_HEAD: "#T 自動化#!\n• 上限を超えた新しい称号は、優先で選ばれた受領者にすぐ渡る\n• あなたの[capital|E]は譲渡されない"
 MBQ_GR_AUTO: "自動化オン"
 MBQ_GR_TT_AUTO: "#T 自動化オン#!\n• 上限を超えた称号は自動で譲渡される。"
 MBQ_GR_TT_TAKT: "#T 間隔#!\n• 自動化があなたの[domain|E]全体を確認する頻度"
 MBQ_GR_ASK: "確認する"
 MBQ_GR_TT_ASK: "#T 確認する#!\n• 貴重な領分（[special_building|E]、[holy_site|E]）は、譲渡の前にゲームがあなたに確認する"
 MBQ_GR_WHO: "受領者"
 MBQ_GR_TT_WHO: "#T 受領者#!\n• 条件が称号を得られる者を、優先順位が優先する者を決める。"
 MBQ_GR_PREVIEW: "今すぐ譲渡：最大[GetPlayer.MakeScope.Var('mbq_gr_prev_n').GetValue|0][SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_gr_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_GR_TITLE_1', 'MBQ_GR_TITLE_N' )]、@domain_icon! [GetPlayer.GetDomainSize]/[GetPlayer.GetDomainLimit]"
 MBQ_GR_TITLE_1: "件の称号"
 MBQ_GR_TITLE_N: "件の称号"
 MBQ_GR_TT_RUN: "#T 今すぐ実行#!\n• 超過分をすべて一度に譲渡：伯爵領と男爵領\n• グレー表示：上限超過なし"
 mbq_gr_sum_title: "譲渡した称号"
 mbq_gr_sum_desc: "譲渡済み：[ROOT.Var('mbq_gr_n').GetValue|0][SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_gr_n').GetValue, '(CFixedPoint)1' ), 'MBQ_GR_TITLE_1', 'MBQ_GR_TITLE_N' )][ROOT.Char.Custom('mbq_gr_s1')][ROOT.Char.Custom('mbq_gr_s2')][ROOT.Char.Custom('mbq_gr_s3')][ROOT.Char.Custom('mbq_gr_s4')][ROOT.Char.Custom('mbq_gr_s5')][ROOT.Char.Custom('mbq_gr_more')][ROOT.Char.Custom('mbq_gr_why')]"
 mbq_gr_more_line: "\nほか[ROOT.Var('mbq_gr_rest').GetValue|0]件"
 mbq_gr_none_line: "\n上限超過なし、または該当者なし。"
 message_filter_mbq_county_summary: "譲渡した称号（Better Quality of Life）"
 message_filter_mbq_county_summary_desc: "Better Quality of Lifeがあなたに代わって譲渡した伯爵領と公爵領のまとめ。"
 mbq_gr.0001.t: "価値ある称号"
 mbq_gr.0001.desc: "[mbq_gr_grant_title.GetNameNoTier]によって[domain_limit|E]を超えている。だがこれはただの称号ではないので、保持するかはあなたが決める。"
 mbq_gr.0001.desc_special: "\n\nここには#high 特殊建造物#!かその建設地がある。領域全体でもこのような場所はわずかしかない。"
 mbq_gr.0001.desc_holy: "\n\nここにはあなたの宗派の#high 聖地#!がある。同じ宗派の者が保持すれば、全信徒が力を得る。"
 mbq_gr.0001.desc_ducal: "\n\nここは#high 公爵領の中心地#!。保持する者がこの地域を率いる。"
 mbq_gr.0001.keep: "保持"
 mbq_gr.0001.keep_tt: "称号を保持し、[domain_limit|E]を超えたままになる。自動化は今後この称号について確認しない。"
 mbq_gr.0001.give: "譲渡"
 mbq_gr.0001.give_tt: "[mbq_gr_recipient.GetShortUIName]が称号を受け取る。"
 MBQ_GR_TT_LIMITS_RED: "#T 何も譲渡されない#!\n• 上限を超えて保持する領分は「すべて保持」になっている\n• 数を選ぶ"
 MBQ_GR_ALLOW: "[Concept('domain_limit','上限')|E]超過の最大 [holdings|E]"
 MBQ_GR_TT_ALLOW: "#T 上限を超えて保持する領分#!\n• @domain_icon! [domain_limit|E]を超えて保持できる[holdings|E]の数"
 MBQ_GR_NOLIMIT: "上限なし"
 MBQ_GR_N1: "1"
 MBQ_GR_N2: "2"
 MBQ_GR_N4: "4"
 MBQ_GR_N6: "6"
 MBQ_GR_TT_WHO_RED: "#T 受領者なし#!\n• 伯爵領：優先がすべて「なし」か、年齢が一つもチェックされていない\n• 優先を選ぶか年齢をチェックする"
 MBQ_GR_TT_PRIO_C: "#T 優先#!\n• 優先1が最初に効く。複数残るときは、その中で優先2が決め、続いて優先3、以降も同様\n• 必須：どれにも当てはまらない者は除外される。並べ替えのみ：並べ替えるだけ"
 MBQ_GR_OPT_0: "なし"
 MBQ_GR_OPT_1: "王朝"
 MBQ_GR_OPT_2: "家"
 MBQ_GR_OPT_3: "孫以下"
 MBQ_GR_OPT_4: "子"
 MBQ_GR_OPT_5: "廷臣"
 MBQ_GR_OPT_6: "慣習的な統治者"
 MBQ_GR_OPT_7: "良い封臣特性"
 MBQ_GR_CAPS: "受領者ごとの上限"
 MBQ_GR_TT_CAPS: "#T 受領者ごとの上限#!\n• 上限を超える者は除外される。"
 MBQ_GR_CCAP: "封臣1人あたり最大 [counties|E] @county_icon!"
 MBQ_GR_TT_CCAP: "#T 封臣ごとの伯爵領#!\n• 授与後に封臣が持てる@county_icon! [counties|E]の最大数"
 MBQ_GR_FILTERS: "条件：必ず満たす"
 MBQ_GR_TT_FILTERS: "#T 条件#!\n• 条件に合わない者は選ばれない。"
 MBQ_GR_FAI_HEAD: "$religion_filter$"
 MBQ_GR_TT_FAI_HEAD: "これらだけが称号を受け取れる。"
 MBQ_GR_CUL_HEAD: "$culture_filter$"
 MBQ_GR_TT_CUL_HEAD: "これらだけが称号を受け取れる。"
 MBQ_GR_BADTR: "悪い封臣特性を除外"
 MBQ_GR_TT_BADTR: "#T 悪い封臣特性を除外#!\n• [GetTrait('ambitious').GetName( GetNullCharacter )]、[GetTrait('disloyal').GetName( GetNullCharacter )]、[GetTrait('arrogant').GetName( GetNullCharacter )]、[GetTrait('impatient').GetName( GetNullCharacter )]、[GetTrait('stubborn').GetName( GetNullCharacter )]の者は称号を得ない"
 MBQ_GR_PRIOS: "優先順位（重要な順）"
 MBQ_GR_TT_PRIOS: "#T 優先順位#!\n• 優先1が最初に効く。複数残るときは、その中で優先2が決め、続いて優先3、以降も同様\n• 必須：どれにも当てはまらない者は除外される。並べ替えのみ：並べ替えるだけ"
 MBQ_GR_PRIO_1: "優先1"
 MBQ_GR_PRIO_2: "優先2"
 MBQ_GR_PRIO_3: "優先3"
 MBQ_GR_PRIO_4: "優先4"
 MBQ_GR_PRIO_5: "優先5"
 MBQ_GR_PRIO_6: "優先6"
 MBQ_GR_PRIO_7: "優先7"
 mbq_gr_kept_line: "\n手元に残った数：[ROOT.Var('mbq_gr_kept_n').GetValue|0]。条件を満たし優先に合う者がいない。"
 mbq_gr_kept_full_line: "\n手元に残った数：[ROOT.Var('mbq_gr_kept_n').GetValue|0]。うち[ROOT.Var('mbq_gr_kept_full').GetValue|0]件は[vassal_limit|E]に空きがなく、新しい直属の家臣（無領地の者、新しい貴族）を増やせない。残りは条件を満たし優先に合う者がいない。"
 MBQ_GR_OPT_9: "#color_light_blue 称号が最少#!"
 MBQ_GR_AGE_HEAD: "$age_filter_category$"
 MBQ_GR_TT_AGE_HEAD: "#T 年齢#!\n• チェックした年齢の者だけが称号を得る。"
 MBQ_GR_AGE_7: "16歳未満"
 MBQ_GR_AGE_8: "16-30"
 MBQ_GR_AGE_9: "31-45"
 MBQ_GR_AGE_10: "46+"
 MBQ_GR_PRESET: "称号の受領者"
 MBQ_GR_TT_PRESET: "#T 称号の受領者#!\n• 譲渡される称号を誰が受け取るか。"
 MBQ_GR_PRESET_0: "家族優先"
 MBQ_GR_PRESET_1: "王朝の建設者"
 MBQ_GR_PRESET_2: "自文化の新貴族"
 MBQ_GR_PRESET_3: "最良の封臣"
 MBQ_GR_PRESET_4: "有能な管理者"
 MBQ_GR_PRESET_5: "カスタム"
