l_korean:
 MBQ_GR_AUTO_HEAD: "자동화: 한계를 넘는 작위 넘기기"
 MBQ_GR_TT_AUTO_HEAD: "#T 자동화#!\n• 한계를 넘는 새 작위는 선호에 따라 정해진 대상에게 바로 넘어갑니다\n• 당신의 [capital|E]는 절대 넘기지 않습니다"
 MBQ_GR_AUTO: "자동화 켜기"
 MBQ_GR_TT_AUTO: "#T 자동화 켜기#!\n• 한계를 넘는 작위를 저절로 넘깁니다."
 MBQ_GR_TT_TAKT: "#T 주기#!\n• 자동화가 당신의 [domain|E] 전체를 확인하는 빈도"
 MBQ_GR_ASK: "묻기"
 MBQ_GR_TT_ASK: "#T 묻기#!\n• 귀중한 봉토([special_building|E], [holy_site|E])는 넘기기 전에 게임이 당신에게 묻습니다"
 MBQ_GR_WHO: "받는 사람"
 MBQ_GR_TT_WHO: "#T 받는 사람#!\n• 필터는 누가 작위를 받을 수 있는지, 선호는 누가 우선인지 정합니다."
 MBQ_GR_PREVIEW: "지금 넘기기: 최대 [GetPlayer.MakeScope.Var('mbq_gr_prev_n').GetValue|0][SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_gr_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_GR_TITLE_1', 'MBQ_GR_TITLE_N' )], @domain_icon! [GetPlayer.GetDomainSize]/[GetPlayer.GetDomainLimit]"
 MBQ_GR_TITLE_1: "개 작위"
 MBQ_GR_TITLE_N: "개 작위"
