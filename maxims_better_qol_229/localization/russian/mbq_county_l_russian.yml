 MBQ_GR_TT_PRIOS: "#T Предпочтения#!\n• Приоритет 1 считается первым; если остаётся несколько, среди них решает приоритет 2, затем 3 и так далее\n• Необходимо: кто не подходит ни под одно, выбывает. Только сортирует: только упорядочивает"
