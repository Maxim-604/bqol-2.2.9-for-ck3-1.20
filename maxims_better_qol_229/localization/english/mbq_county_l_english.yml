l_english:
 MBQ_GR_AUTO_HEAD: "Automation: pass on what is over your limits"
 MBQ_GR_TT_AUTO_HEAD: "#T Automation#!\n• A new title over your limits goes at once to the recipient your preferences pick\n• Your [capital|E] is never passed on"
 MBQ_GR_AUTO: "Automation on"
 MBQ_GR_TT_AUTO: "#T Automation On#!\n• Titles over your limits are passed on by themselves."
 MBQ_GR_TT_TAKT: "#T Interval#!\n• How often the automation checks your whole [domain|E]"
 MBQ_GR_ASK: "Ask me"
 MBQ_GR_TT_ASK: "#T Ask Me#!\n• For valuable holdings ([special_building|E], [holy_site|E]) the game asks you before they are passed on"
 MBQ_GR_WHO: "Recipients"
 MBQ_GR_TT_WHO: "#T Recipients#!\n• Filters decide who may get a title, preferences who is preferred."
