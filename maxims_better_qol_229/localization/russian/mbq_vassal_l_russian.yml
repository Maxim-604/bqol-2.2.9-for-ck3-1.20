l_russian:
 MBQ_VS_AUTO_HEAD: "Автоматизация"
 MBQ_VS_TT_AUTO_HEAD: "#T Автоматизация#!\n• Предложения и требования получают лишь согласные\n• Предложения вам принимаются, как выбрано ниже"
 MBQ_VS_AUTO_VS: "@vassal_icon! Предложить вассалитет"
 MBQ_VS_AUTO_TB: "@tributary_icon! Потребовать выплат дани"
 MBQ_VS_TT_AUTO_VS: "#T Предложить вассалитет#!\n• Предлагает вассалитет каждому согласному правителю с лучшим для вас договором\n• Пока есть место в пределах [Concept('vassal_limit','максимума вассалов')|E]"
 MBQ_VS_TT_AUTO_TB: "#T Потребовать дань#!\n• Требует дань у каждого подходящего согласного соседа, как обычное взаимодействие\n• #warning @prestige_icon! Стоит [Concept('prestige','престижа')|E], как обычное взаимодействие#!"
 MBQ_VS_TT_MIN_HEAD: "#T Договор#!\n• Действует для предложения вассалитета, принятия присяги и принятия данников\n• Не действует при требовании выплат дани"
 MBQ_VS_MIN_HIGH: "Высокие"
 MBQ_VS_MIN_NORMAL: "Обычные"
 MBQ_VS_MIN_LOW: "Низкие"
 MBQ_VS_TT_MIN_HIGH: "#T Высокие#!\n• Только высокие [Concept( 'obligations', 'обязательства' )|E]\n• Предложения вам: автоматически принимаются только высокие"
 MBQ_VS_TT_MIN_NORMAL: "#T Обычные#!\n• Сначала высокие, затем обычные [Concept( 'obligations', 'обязательства' )|E]\n• Предложения вам: автоматически принимаются высокие и обычные"
 MBQ_VS_TT_MIN_LOW: "#T Низкие#!\n• Сначала высокие, затем обычные, затем низкие [Concept( 'obligations', 'обязательства' )|E]\n• Предложения вам: автоматически принимается любое предложение"
 MBQ_VS_WHO: "Предлагать вассалитет:"
 MBQ_VS_TT_WHO: "#T Кого спрашивают#!\n• Относится только к вассалитету\n• Требование дани всегда адресовано независимым соседям"
 MBQ_VS_NB: "Независимые соседи"
 MBQ_VS_TRIB: "Ваши данники"
 MBQ_VS_TT_NB: "#T Независимые соседи#!\n• Отмечено: спрашивают независимых правителей рядом с вашей [Concept( 'realm', 'державой' )|E], в том числе через воду"
 MBQ_VS_TT_TRIB: "#T Ваши данники#!\n• Отмечено: спрашивают также ваших собственных данников"
 MBQ_VS_RANK: "До ранга (включительно)"
 MBQ_VS_TT_RANK: "#T До ранга#!\n• Правителей до этого ранга спрашивают, а их предложения принимаются автоматически\n• Императоров никогда не спрашивают"
 MBQ_VS_EXCL_HEAD: "Пропускать этих правителей"
 MBQ_VS_TT_EXCL: "#T Исключения#!\n• Отмечено: автоматизация никогда не спрашивает таких правителей и никогда не принимает их предложения\n• Их предложения приходят как обычно"
 MBQ_VS_EX_RIVAL: "@rival_icon! Соперники и заклятые"
 MBQ_VS_EX_CLAIM: "Претензии на ваши титулы"
 MBQ_VS_EX_FAITH: "@religious_icon! Другая конфессия"
 MBQ_VS_EX_FACTION: "@faction_icon! Лидеры фракций"
 MBQ_VS_TT_EX_RIVAL: "#T Соперники и заклятые враги#!\n• Правитель является вашим [Concept( 'rival', 'соперником' )|E] или [Concept( 'nemesis', 'заклятым врагом' )|E]"
 MBQ_VS_TT_EX_CLAIM: "#T Претензии на ваши титулы#!\n• У правителя есть [Concept( 'claim', 'претензия' )|E] на один из ваших титулов ранга графства или выше"
 MBQ_VS_TT_EX_FAITH: "#T Другая конфессия#!\n• Правитель исповедует другую [Concept( 'faith', 'конфессию' )|E], чем вы"
 MBQ_VS_TT_EX_FACTION: "#T Лидеры фракций#!\n• Правитель возглавляет [Concept( 'faction', 'фракцию' )|E] против вас"
 MBQ_VS_PREVIEW: "Вассалитет сейчас: правителей [GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue|0], @vassal_icon! [GetPlayer.GetNumVassalsTowardsLimit]/[GetPlayer.GetVassalLimit]"
 MBQ_TB_PREVIEW: "Дань сейчас: правителей до [GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue|0]"
 MBQ_TBO_HEAD: "Пожелания к договору о дани"
 MBQ_TBO_TT_HEAD: "#T Пожелания к договору о дани#!\n• Для каждого нового [Concept('tributary','данника')|E] из этого окна пожелания применяются сразу после принятия\n• #warning @prestige_icon! Один раз стоит 150 [Concept('prestige','престижа')|E] за данника, [Concept('opinion','мнение')|E] -30 у него и -10 у других данников, только если что-то меняется#!"
 MBQ_TBO_NO_GUAR: "Без вступления в их войны"
 MBQ_TBO_TT_NO_GUAR: "#T Без обязанности вступать в их войны#!\n• Автоматика снижает обязанность вступать в их войны, где можно"
 MBQ_TBO_TAX: "Более высокие налоги"
 MBQ_TBO_TT_TAX: "#T Более высокие налоги#!\n• На одну ступень больше [Concept( 'taxes', 'налогов' )|E], чем в начале, только если игра позволяет"
 MBQ_TBO_PRESTIGE: "Больше престижа"
 MBQ_TBO_TT_PRESTIGE: "#T Больше престижа#!\n• На одну ступень больше передачи [Concept( 'prestige', 'престижа' )|E], чем в начале, только если игра позволяет"
 MBQ_TBO_WAR: "Поддержка ваших войн"
 MBQ_TBO_TT_WAR: "#T Они поддерживают ваши войны#!\n• Новый данник должен вступать в ваши войны, только если игра позволяет"
 MBQ_VS_RULER_1: "правитель"
 MBQ_VS_RULER_N: "правителей"
 MBQ_VS_TT_RUN: "#T Выполнить сейчас#!\n• Один раз предлагает вассалитет каждому подходящему правителю, который согласился бы\n• Серая: некому предлагать"
 MBQ_TB_TT_RUN: "#T Выполнить сейчас#!\n• Один раз требует дань у каждого подходящего соседа, который согласился бы\n• Серая: не у кого требовать"
 MBQ_VS_MANDALA: "Правители мандал: предлагать и требовать приостановлено."
 mbq_vs_sum_title: "Новые вассалы"
 mbq_vs_sum_desc: "Приняли вассалитет, правителей: [ROOT.Var('mbq_vs_n').GetValue|0][ROOT.Char.Custom('mbq_vs_s1')][ROOT.Char.Custom('mbq_vs_s2')][ROOT.Char.Custom('mbq_vs_s3')][ROOT.Char.Custom('mbq_vs_s4')][ROOT.Char.Custom('mbq_vs_s5')][ROOT.Char.Custom('mbq_vs_more')]"
 mbq_vs_more_line: "\nи ещё [ROOT.Var('mbq_vs_rest').GetValue|0]"
 mbq_vs_none_line: "\nНикто не подошёл или никто не согласился."
 MBQ_TB_TT_OFF: "#T Потребовать дань#!\n• Только [Concept( 'nomads', 'кочевники' )|E], правители [Concept( 'steppe_admin', 'меритократического ханства' )|E] и [Concept( 'hegemons', 'гегемоны' )|E] [Concept( 'celestial', 'мандата' )|E] могут требовать дань в мирное время\n• Правители [Concept( 'mandala', 'мандалы' )|E] вместо этого принимают [Concept( 'tributaries', 'данников' )|E]"
 mbq_tb_sum_title: "Новые данники"
 mbq_tb_sum_desc: "Стали вашими данниками, правителей: [ROOT.Var('mbq_tb_n').GetValue|0][ROOT.Char.Custom('mbq_tb_s1')][ROOT.Char.Custom('mbq_tb_s2')][ROOT.Char.Custom('mbq_tb_s3')][ROOT.Char.Custom('mbq_tb_s4')][ROOT.Char.Custom('mbq_tb_s5')][ROOT.Char.Custom('mbq_tb_more')]"
 mbq_tb_more_line: "\nи ещё [ROOT.Var('mbq_tb_rest').GetValue|0]"
 mbq_tb_none_line: "\nНикто не подошёл или никто не согласился."
 message_filter_mbq_vassal_summary: "Новые вассалы и данники (Better Quality of Life)"
 message_filter_mbq_vassal_summary_desc: "Итоги предложений вассалитета и требований дани, которые Better Quality of Life сделал за вас."
