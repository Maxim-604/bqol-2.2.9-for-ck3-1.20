 MBQ_VS_ACC_VS: "@vassal_icon! Treueschwüre annehmen"
 MBQ_VS_TT_ACC_VS: "#T Treueschwüre annehmen#!\n• Nimmt das Angebot eines Herrschers, Euch die Treue zu schwören, sofort an, als würdet Ihr selbst auf Annehmen klicken\n• Nur Angebote ab Eurem Mindestvertrag und im gewählten Rang"
 MBQ_VS_ACC_TB: "@tributary_icon! Tributangebote annehmen"
 MBQ_VS_TT_ACC_TB: "#T Tributangebote annehmen#!\n• Nimmt das Angebot eines Herrschers, Euer [tributary|E] zu werden, sofort an, als würdet Ihr selbst auf Annehmen klicken\n• Nur Angebote ab Eurem Mindestvertrag und im gewählten Rang"
 MBQ_VS_ACC_FROM: "Von"
 MBQ_VS_TT_ACC_NOMADS: "#T Für Nomaden#!\n• Angebote von [nomad_i|E] [nomads|E] und anderen Herrschern mit Herde werden automatisch angenommen"
 MBQ_VS_TT_ACC_ALL: "#T Alle anderen#!\n• Angebote aller Herrscher ohne Herde werden automatisch angenommen\n• Alle außer [nomads|E]- und [herder|E]-Reichen, die ein eigenes Kästchen haben"
 mbq_fealty_auto_accepted_toast: "Treueschwur automatisch angenommen"
 MBQ_VS_TB_SILENT: "Meldungen stumm schalten"
 MBQ_VS_TT_TB_SILENT: "#T Meldungen stumm schalten#!\n• Angebote an Euch kommen ohne Angebotsfenster\n• Die Automatik nimmt an, was zu Euren Häkchen passt, den Rest lehnt sie ab; Meldungen stehen nur im Verlauf"
