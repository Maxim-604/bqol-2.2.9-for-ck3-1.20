l_polish:
 MBQ_RS_BTN_TT: "#T Automatyczny okup#!\n• Kliknięcie: otwiera ustawienia, ponowne kliknięcie je zamyka\n• Prawy przycisk myszy: automatyzacja włączona lub wyłączona"
 MBQ_RS_BTN_TT_ON: "#T Automatyczny okup#!\n• Kliknięcie: otwiera ustawienia, ponowne kliknięcie je zamyka\n#P • Prawy przycisk myszy: automatyzacja włączona lub wyłączona#!"
 MBQ_RS_WHO: "Kto jest uwalniany za okup"
 MBQ_RS_DUNGEON: "Więźniowie w [Concept( 'dungeon', 'lochu' )|E]"
 MBQ_RS_HOUSE: "Więźniowie w [Concept( 'house_arrest', 'areszcie domowym' )|E]"
 MBQ_RS_TT_DUNGEON: "#T Loch#!\n• Zaznaczone: uwzględnia więźniów z twojego lochu"
 MBQ_RS_TT_HOUSE: "#T Areszt domowy#!\n• Zaznaczone: uwzględnia więźniów w areszcie domowym"
 MBQ_RS_RANK: "Okup do rangi (włącznie)"
 MBQ_RS_T0: "Bez tytułu"
 MBQ_RS_T1: "Baron"
 MBQ_RS_T2: "Hrabia"
 MBQ_RS_T3: "Książę"
 MBQ_RS_T4: "Król"
 MBQ_RS_TT_RANK: "#T Okup do rangi#!\n• Okup za więźniów do wybranej rangi, także niższych i bez tytułu\n• Liczy się najwyższy tytuł więźnia, cesarze nigdy"
 MBQ_RS_TT_T1: "#T Baron#!\n• Okup za więźniów bez tytułu i baronów\n• [Concept( 'baron', 'Baron' )|E] to władca, którego najwyższym tytułem jest [Concept( 'barony', 'baronia' )|E]"
 MBQ_RS_AUTO: "Automatyzacja włączona"
 MBQ_RS_TT_AUTO: "#T Automat#!\n• Uwalnia więźniów co wybrany czas, tylko dla ciebie"
 MBQ_RS_MONTHLY: "co miesiąc"
 MBQ_RS_QUARTERLY: "co trzy miesiące"
 MBQ_RS_TT_TAKT: "#T Odstęp#!\n• Jak często automat sprawdza twoich więźniów\n• Zmiana działa od razu: następne sprawdzenie nastąpi jeden odstęp od dziś"
 MBQ_RS_PREVIEW: "Okup teraz: liczba więźniów [GetPlayer.MakeScope.Var('mbq_rs_prev_n').GetValue|0], razem @gold_icon! [GetPlayer.MakeScope.Var('mbq_rs_prev_gold').GetValue|0]"
 MBQ_RS_RUN: "Uruchom teraz"
 MBQ_RS_TT_RUN: "#T Uruchom teraz#!\n• Jednorazowo oferuje okup każdemu pasującemu więźniowi, którego płatnik się zgodzi"
 mbq_rs_sum_title: "Więźniowie uwolnieni za okup"
 mbq_rs_sum_desc: "Uwolnionych więźniów: [ROOT.Var('mbq_rs_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_rs_n').GetValue, '(CFixedPoint)1' ), 'MBQ_RS_PRISONER_1', 'MBQ_RS_PRISONER_N' )], łącznie @gold_icon! [ROOT.Var('mbq_rs_sum').GetValue|0][ROOT.Char.Custom('mbq_rs_s1')][ROOT.Char.Custom('mbq_rs_s2')][ROOT.Char.Custom('mbq_rs_s3')][ROOT.Char.Custom('mbq_rs_s4')][ROOT.Char.Custom('mbq_rs_s5')][ROOT.Char.Custom('mbq_rs_more')]"
