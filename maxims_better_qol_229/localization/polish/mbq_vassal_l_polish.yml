 MBQ_TB_TT_OFF: "#T Żądanie trybutu#!\n• Tylko [Concept( 'nomads', 'koczownicy' )|E], władcy [Concept( 'steppe_admin', 'chanatu merytokratycznego' )|E] i [Concept( 'celestial', 'niebiańscy' )|E] [Concept( 'hegemons', 'hegemoni' )|E] mogą żądać trybutu w czasie pokoju\n• Władcy [Concept( 'mandala', 'mandali' )|E] zamiast tego przyjmują [Concept( 'tributaries', 'trybutariuszy' )|E]"
