l_russian:
 MBQ_EXPL_Q:0 "?"
 MBQ_EXPL_TT:0 "#T Пояснение#!\n• Показывает, что делают настройки раздела «Даровать титулы»\n• Повторный щелчок скрывает его"
 MBQ_EXPL_TITLE:0 "Как работает «Даровать титулы»"
 MBQ_EXPL_H_AUTO:0 "@domain_icon! Автоматизация"
 MBQ_EXPL_B_AUTO:0 "Сверх вашего [Concept('domain_limit','предела домена')|E] мод передаёт лишние @county_icon! [Concept('counties','графства')|E] другим, сам или по кнопке «Выполнить сейчас». Ваша [Concept('capital','столица')|E] и титулы с пометкой «Ценное» остаются у вас."
 MBQ_EXPL_H_WHO:0 "@vassal_icon! Получатели"
 MBQ_EXPL_B_WHO:0 "Титулы получают ваши прямые [Concept('vassals','вассалы')|E], [Concept('courtiers','придворные')|E] и семья, но никогда ваш [Concept('primary_heir','первый наследник')|E], соперники или заклятые враги."
 MBQ_EXPL_H_FILTERS:0 "Фильтры"
 MBQ_EXPL_B_FILTERS:0 "Фильтры решают, кто может получить титул: [Concept('religion','религия')|E], [Concept('culture','культура')|E] и возраст. Вассалы с плохими чертами пропускаются. Никто не подходит: титул остаётся у вас; с опцией Новый дворянин новый дворянин вашей культуры получает его."
 MBQ_EXPL_H_PRIOS:0 "Предпочтения"
 MBQ_EXPL_B_PRIOS:0 "#clickable Бежевые#!: необходимо. Кто не подходит ни под одно из выбранных, выбывает.\n#color_light_blue Голубые#!: только сортируют. Никто не выбывает.\nДалее сначала считается приоритет 1. Если двое равны, решает приоритет 2, затем 3 и так далее."
 MBQ_EXPL_H_CAPS:0 "@county_icon! Пределы на получателя"
 MBQ_EXPL_B_CAPS:0 "Вассал получает не больше графств, чем позволяет предел."
