 mbq_gr_sum_desc: "Cedidos: [ROOT.Var('mbq_gr_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_gr_n').GetValue, '(CFixedPoint)1' ), 'MBQ_GR_TITLE_1', 'MBQ_GR_TITLE_N' )][ROOT.Char.Custom('mbq_gr_s1')][ROOT.Char.Custom('mbq_gr_s2')][ROOT.Char.Custom('mbq_gr_s3')][ROOT.Char.Custom('mbq_gr_s4')][ROOT.Char.Custom('mbq_gr_s5')][ROOT.Char.Custom('mbq_gr_more')][ROOT.Char.Custom('mbq_gr_why')]"
