 MBQ_TT_DIVORCE: "#T [divorce|E]要求をすべて受け入れる#!\n$EFFECT_LIST_BULLET$ [head_of_faith|E]として受け取る「離婚を要求する」は、確認なしで受け入れます。\n$EFFECT_LIST_BULLET$ [dynast|E]が家族に代わって送る要求も同様です。\n\n#weak チェックなし：基本ゲームと同じです。#!"
 MBQ_TT_DIVORCE_ON: "#T [divorce|E]要求をすべて受け入れる#!\n#P $EFFECT_LIST_BULLET$ [head_of_faith|E]として受け取る「離婚を要求する」は、確認なしで受け入れます。\n$EFFECT_LIST_BULLET$ [dynast|E]が家族に代わって送る要求も同様です。#!"
 MBQ_TT_TRIB_NOMADS: "#T 遊牧民向け#!\n$EFFECT_LIST_BULLET$ [nomads|E]と[herder|E]の国からの[tributary|E]の申し出は、確認なしで承諾される。\n$EFFECT_LIST_BULLET$ 他の統治者があなたに行う申し出のみ。あなたからの要求は「封臣」にある。\n$EFFECT_LIST_BULLET$ それ以外の統治者は下のチェック欄で決まる。\n\n#weak 未チェック：基本ゲームと同じ。#!"
 MBQ_TT_TRIB_ALL: "#T それ以外すべて#!\n$EFFECT_LIST_BULLET$ [nomads|E]と[herder|E]の国を除くすべての統治者からの[tributary|E]の申し出は、確認なしで承諾される。\n$EFFECT_LIST_BULLET$ 他の統治者があなたに行う申し出のみ。あなたからの要求は「封臣」にある。\n$EFFECT_LIST_BULLET$ それらの国は上のチェック欄で決まる。\n\n#weak 未チェック：基本ゲームと同じ。#!"
 MBQ_TT_GRANT: "#T 自動化：封臣を正当な主君に与える#!\n$EFFECT_LIST_BULLET$ 四半期ごとに、より大きな封臣の領地に属する小さな[vassals|E]を、その封臣に引き渡します。\n$EFFECT_LIST_BULLET$ その封臣が正当な[liege|E]です。"
 MBQ_TT_GRANT_ON: "#T 自動化：封臣を正当な主君に与える#!\n#P $EFFECT_LIST_BULLET$ 四半期ごとに、より大きな封臣の領地に属する小さな[vassals|E]を、その封臣に引き渡します。\n$EFFECT_LIST_BULLET$ その封臣が正当な[liege|E]です。#!"
 mbq_best_terms_no_prestige: "[prestige|E]が足りず、[tributary_contract|E]を調整できません"
