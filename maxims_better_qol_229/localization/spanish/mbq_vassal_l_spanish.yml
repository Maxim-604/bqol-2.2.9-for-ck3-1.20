 MBQ_VS_ACC_VS: "Aceptar ofertas de lealtad"
 MBQ_VS_TT_ACC_VS: "#T Aceptar ofertas de lealtad#!\n• Acepta al instante la oferta de un gobernante de jurarte lealtad, como si pulsaras Aceptar tú mismo\n• Solo ofertas en tu pacto mínimo o por encima y dentro del rango elegido"
 MBQ_VS_ACC_TB: "Aceptar ofertas de tributario"
 MBQ_VS_TT_ACC_TB: "#T Aceptar ofertas de tributario#!\n• Acepta al instante la oferta de un gobernante de ser tu [tributary|lE], como si pulsaras Aceptar tú mismo\n• Solo ofertas en tu pacto mínimo o por encima y dentro del rango elegido"
 MBQ_VS_ACC_FROM: "De"
 MBQ_VS_TT_ACC_NOMADS: "#T Para nómadas#!\n• Marcado: las ofertas de [nomad_i|E] [nomads|lE] y otros gobernantes con rebaño ([herder|lE]) se aceptan automáticamente"
 MBQ_VS_TT_ACC_ALL: "#T Todos los demás#!\n• Marcado: las ofertas de todos los gobernantes sin rebaño se aceptan automáticamente\n• Todos salvo los reinos de [nomads|lE] y [herder|lE], que tienen su propia casilla"
 mbq_fealty_auto_accepted_toast: "Oferta de lealtad aceptada automáticamente"
 MBQ_VS_TB_SILENT: "Silenciar mensajes"
 MBQ_VS_TT_TB_SILENT: "#T Silenciar mensajes#!\n• Las ofertas que te hacen llegan sin ventana de oferta\n• La automatización acepta lo que permiten tus casillas y rechaza el resto; los mensajes solo aparecen en el registro"
 mbq_acc_last_desc: "[ROOT.Var('mbq_acc_last').Char.GetShortUIName][ROOT.Var('mbq_acc_last').Char.Custom('GetPrimaryTitleTierIcon')]"
