 MBQ_RS_EX_DYN: "@dynasty_icon! Eigene Dynastie"
 MBQ_RS_TT_EX_WAR: "#T Kriegsgegner#!\n• Der Gefangene, sein zahlender Lehnsherr oder der Inhaber seines Erbtitels ist mit Euch im [war|E]"
 MBQ_RS_TT_EX_CLAIM: "#T Anspruch auf Eure Titel#!\n• Der Gefangene hat einen [claim|E] auf einen Eurer Titel ab dem Rang [duchy|E]\n• Oder auf Euren [primary_title|E], gleich welchen Rangs"
 MBQ_RS_TT_EX_RIVAL: "#T Rivalen und Erzfeinde#!\n• Der Gefangene ist Euer [rival|E] oder Euer [nemesis|E]"
 MBQ_RS_TT_EX_DYN: "#T Eigene Dynastie#!\n• Der Gefangene gehört zu Eurer [dynasty|E], damit auch der größte Teil Eurer engen Familie"
