 message_filter_mbq_county_summary: "넘긴 작위 (Better Quality of Life)"
 message_filter_mbq_county_summary_desc: "Better Quality of Life가 대신 넘긴 백작령과 공작령 요약."
 mbq_gr.0001.t: "귀중한 작위"
 mbq_gr.0001.desc: "[mbq_gr_grant_title.GetNameNoTier] 때문에 [domain_limit|E]을 넘습니다. 하지만 평범한 작위가 아니므로 유지할지 당신이 정합니다."
 mbq_gr.0001.desc_special: "\n\n이곳에는 #high 특수 건물#!이 있거나 지을 자리가 있습니다. 영지 전체에 이런 곳은 몇 군데뿐입니다."
 mbq_gr.0001.desc_holy: "\n\n이곳에 당신 신앙의 #high 성지#!가 있습니다. 당신 신앙을 가진 보유자는 모든 신도에게 힘을 줍니다."
 mbq_gr.0001.desc_ducal: "\n\n이곳은 #high 공작령의 중심지#!입니다. 이곳을 보유한 사람이 지역을 이끕니다."
 mbq_gr.0001.keep: "유지한다."
 mbq_gr.0001.keep_tt: "작위를 유지하고 [domain_limit|E]을 넘은 상태로 남습니다. 자동화는 이 작위에 대해 다시 묻지 않습니다."
