 MBQ_TT_DIVORCE: "#T Aceptar todas las solicitudes de [divorce|lE]#!\n$EFFECT_LIST_BULLET$ Cada «Solicitar divorcio» que te llegue como [head_of_faith|lE] se acepta sin preguntar.\n$EFFECT_LIST_BULLET$ Esto incluye las que envíe un [dynast|lE] por un familiar.\n\n#weak Sin marcar: como en el juego base.#!"
 MBQ_TT_DIVORCE_ON: "#T Aceptar todas las solicitudes de [divorce|lE]#!\n#P $EFFECT_LIST_BULLET$ Cada «Solicitar divorcio» que te llegue como [head_of_faith|lE] se acepta sin preguntar.\n$EFFECT_LIST_BULLET$ Esto incluye las que envíe un [dynast|lE] por un familiar.#!"
 MBQ_TT_TRIB_NOMADS: "#T Para nómadas#!\n$EFFECT_LIST_BULLET$ Las ofertas de [tributary|lE] de los reinos de [nomads|lE] y [herder|lE] se aceptan sin preguntar.\n$EFFECT_LIST_BULLET$ Solo las ofertas que otros gobernantes te hacen; tus propias exigencias están en Vasallos.\n$EFFECT_LIST_BULLET$ Los demás gobernantes dependen de la casilla de abajo.\n\n#weak Sin marcar: como en el juego base.#!"
 MBQ_TT_TRIB_ALL: "#T Todos los demás#!\n$EFFECT_LIST_BULLET$ Se aceptan sin preguntar las ofertas de [tributary|lE] de cualquier gobernante salvo de los reinos de [nomads|lE] y [herder|lE].\n$EFFECT_LIST_BULLET$ Solo las ofertas que otros gobernantes te hacen; tus propias exigencias están en Vasallos.\n$EFFECT_LIST_BULLET$ Esos reinos dependen de la casilla de arriba.\n\n#weak Sin marcar: como en el juego base.#!"
 MBQ_TT_GRANT: "#T Automatización: otorgar vasallos a su señor legítimo#!\n$EFFECT_LIST_BULLET$ Cada trimestre, los [vassals|lE] pequeños del territorio de un vasallo mayor pasan a ese vasallo.\n$EFFECT_LIST_BULLET$ Ese vasallo es su [liege|lE] legítimo."
 MBQ_TT_GRANT_ON: "#T Automatización: otorgar vasallos a su señor legítimo#!\n#P $EFFECT_LIST_BULLET$ Cada trimestre, los [vassals|lE] pequeños del territorio de un vasallo mayor pasan a ese vasallo.\n$EFFECT_LIST_BULLET$ Ese vasallo es su [liege|lE] legítimo.#!"
