 MBQ_EXPL_Q:0 "?"
 MBQ_EXPL_TT:0 "#T Explanation#!\n• Shows what the settings of Giving Titles do\n• Click again to hide it"
 MBQ_EXPL_TITLE:0 "How Giving Titles works"
 MBQ_EXPL_H_AUTO:0 "@domain_icon! Automation"
 MBQ_EXPL_B_AUTO:0 "Above your [domain_limit|E], the mod passes the surplus @county_icon! [counties|E] on to others, by itself or with Run now. Your [capital|E] and titles marked Valuable stay with you."
 MBQ_EXPL_H_WHO:0 "@vassal_icon! Recipients"
 MBQ_EXPL_B_WHO:0 "Titles go to your direct [vassals|E], [courtiers|E] and family, never to your [primary_heir|E], rivals or nemeses."
 MBQ_EXPL_H_FILTERS:0 "Filters"
 MBQ_EXPL_B_FILTERS:0 "Filters decide who may receive a title: [religion|E], [culture|E] and age. Vassals with bad traits are skipped. No match: you keep the title; with New Noble as Fallback a new noble of your culture gets it."
 MBQ_EXPL_H_PRIOS:0 "Preferences"
 MBQ_EXPL_B_PRIOS:0 "#clickable Beige#!: Must. Whoever fits none of the chosen ones is out.\n#color_light_blue Light blue#!: sorts only. Nobody is out.\nThen preference 1 counts first. If two are equal, preference 2 decides, then 3 and so on."
 MBQ_EXPL_H_CAPS:0 "@county_icon! Limits per recipient"
 MBQ_EXPL_B_CAPS:0 "No vassal receives more counties than the limit allows."
