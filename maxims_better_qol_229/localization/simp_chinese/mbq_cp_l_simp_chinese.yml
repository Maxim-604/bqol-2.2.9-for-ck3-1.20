l_simp_chinese:
 MBQ_CP_AGE_TT: "Age"
 MBQ_CP_BTN_TT: "#T Default automation#!\n空缺后，对所有职位（空缺的在宫廷职位窗口打开时生效）：\n[Select_CString( GetGlobalVariable( 'mbq_cp_lvl_0' ).IsSet, '@check_icon!', '@small_dot!' )] $MBQ_CP_LVL_0$\n[Select_CString( GetGlobalVariable( 'mbq_cp_lvl_1' ).IsSet, '@check_icon!', '@small_dot!' )] $MBQ_CP_LVL_1$\n[Select_CString( GetGlobalVariable( 'mbq_cp_lvl_2' ).IsSet, '@check_icon!', '@small_dot!' )] $MBQ_CP_LVL_2$\n[Select_CString( GetGlobalVariable( 'mbq_cp_lvl_3' ).IsSet, '@check_icon!', '@small_dot!' )] $MBQ_CP_LVL_3$\n[Select_CString( And( Not( GetGlobalVariable( 'mbq_cp_lvl_0' ).IsSet ), And( Not( GetGlobalVariable( 'mbq_cp_lvl_1' ).IsSet ), And( Not( GetGlobalVariable( 'mbq_cp_lvl_2' ).IsSet ), Not( GetGlobalVariable( 'mbq_cp_lvl_3' ).IsSet ) ) ) ), '@check_icon!', '@small_dot!' )] $MBQ_CP_LVL_OFF$\n#I Click to switch to the next level. All filled positions take it once, later changes by hand stay.#!"
 MBQ_CP_LVL_0: "No automation"
 MBQ_CP_LVL_1: "Suggest best candidates in event"
 MBQ_CP_LVL_2: "Auto-assign highest [aptitude|e] candidate, if available"
 MBQ_CP_LVL_3: "Auto-assign highest [aptitude|e] candidate, or notify with event"
 MBQ_CP_LVL_OFF: "关闭（各职位单独设置）：每个职位保留自己的设置"
