l_russian:
 MBQ_GR_AUTO_HEAD: "Автоматизация: передать излишки"
 MBQ_GR_TT_AUTO_HEAD: "#T Автоматизация#!\n• Новый титул сверх ваших пределов сразу уходит получателю, которого выбирают ваши предпочтения\n• Ваша [Concept( 'capital', 'столица' )|E] никогда не передаётся"
 MBQ_GR_AUTO: "Авто вкл."
 MBQ_GR_TT_AUTO: "#T Автоматизация включена#!\n• Титулы сверх ваших пределов передаются сами."
 MBQ_GR_TT_TAKT: "#T Интервал#!\n• Как часто автоматизация проверяет весь ваш [Concept( 'domain', 'домен' )|E]"
 MBQ_GR_ASK: "Вопрос"
 MBQ_GR_TT_ASK: "#T Вопрос#!\n• О ценных владениях ([Concept('special_building','особая постройка')|E], [Concept('holy_site','святое место')|E]) игра спросит вас перед передачей"
 MBQ_GR_WHO: "Кому"
 MBQ_GR_TT_WHO: "#T Получатели#!\n• Фильтры решают, кто может получить титул, предпочтения решают, кому он достанется."
 MBQ_GR_PREVIEW: "Сейчас: [GetPlayer.MakeScope.Var('mbq_gr_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_gr_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_GR_TITLE_1', 'MBQ_GR_TITLE_N' )], @domain_icon! [GetPlayer.GetDomainSize]/[GetPlayer.GetDomainLimit]"
 MBQ_GR_TITLE_1: "титул"
 MBQ_GR_TITLE_N: "титулов"
 MBQ_GR_TT_RUN: "#T Выполнить сейчас#!\n• Один раз передаёт все излишки: графства и баронства\n• Серая: нет ничего сверх ваших пределов"
 mbq_gr_sum_title: "Переданные титулы"
 mbq_gr_sum_desc: "Передано: [ROOT.Var('mbq_gr_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_gr_n').GetValue, '(CFixedPoint)1' ), 'MBQ_GR_TITLE_1', 'MBQ_GR_TITLE_N' )][ROOT.Char.Custom('mbq_gr_s1')][ROOT.Char.Custom('mbq_gr_s2')][ROOT.Char.Custom('mbq_gr_s3')][ROOT.Char.Custom('mbq_gr_s4')][ROOT.Char.Custom('mbq_gr_s5')][ROOT.Char.Custom('mbq_gr_more')][ROOT.Char.Custom('mbq_gr_why')]"
 mbq_gr_more_line: "\nи ещё [ROOT.Var('mbq_gr_rest').GetValue|0]"
 mbq_gr_none_line: "\nНет излишков, или никто не подходит."
 message_filter_mbq_county_summary: "Переданные титулы (Better Quality of Life)"
 message_filter_mbq_county_summary_desc: "Итог по графствам и герцогствам, которые Better Quality of Life передал за вас."
 mbq_gr.0001.t: "Ценный титул"
 mbq_gr.0001.desc: "Из-за титула [mbq_gr_grant_title.GetNameNoTier] вы превышаете [Concept( 'domain_limit', 'предел домена' )|E]. Но это не обычный титул, поэтому решать вам, оставить ли его."
 mbq_gr.0001.desc_special: "\n\nЗдесь есть #high особая постройка#! или место для неё. Таких мест во всём государстве немного."
 mbq_gr.0001.desc_holy: "\n\nЗдесь находится #high святое место#! вашей веры. Единоверец, владеющий им, укрепляет всех её последователей."
 mbq_gr.0001.desc_ducal: "\n\nЭто #high столица герцогства#!. Кто владеет ею, ведёт за собой весь край."
 mbq_gr.0001.keep: "Себе."
 mbq_gr.0001.keep_tt: "Вы оставляете титул и остаётесь сверх [Concept( 'domain_limit', 'предела домена' )|E]. Автоматизация больше о нём не спросит."
 mbq_gr.0001.give: "Отдать."
 mbq_gr.0001.give_tt: "Титул получает [mbq_gr_recipient.GetShortUIName]."
 MBQ_GR_TT_LIMITS_RED: "#T Ничего не передаётся#!\n• Для владений сверх предела выбрано «Всё себе»\n• Выберите число"
