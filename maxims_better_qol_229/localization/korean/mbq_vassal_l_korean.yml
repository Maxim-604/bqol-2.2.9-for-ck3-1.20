 MBQ_VS_ACC_VS: "충성 서약 제안 수락"
 MBQ_VS_TT_ACC_VS: "#T 충성 서약 제안 수락#!\n• 통치자의 충성 서약 제안을 직접 수락을 누른 것처럼 즉시 수락합니다\n• 최소 계약 이상이고 선택한 지위 안의 제안만 해당합니다"
 MBQ_VS_ACC_TB: "조공 제안 수락"
 MBQ_VS_TT_ACC_TB: "#T 조공 제안 수락#!\n• 통치자가 당신의 [tributary|E]이 되겠다는 제안을 직접 수락을 누른 것처럼 즉시 수락합니다\n• 최소 계약 이상이고 선택한 지위 안의 제안만 해당합니다"
 MBQ_VS_ACC_FROM: "대상"
 MBQ_VS_TT_ACC_NOMADS: "#T 유목민용#!\n• 체크: [nomad_i|E] [nomads|E]와 다른 목축 통치자의 제안을 자동 수락합니다"
 MBQ_VS_TT_ACC_ALL: "#T 그 밖의 모두#!\n• 체크: 목축이 아닌 모든 통치자의 제안을 자동 수락합니다\n• [nomads|E]와 [herder|E] 국가를 제외한 모두. 그들에게는 전용 칸이 있습니다"
 mbq_fealty_auto_accepted_toast: "충성 서약 제안을 자동으로 수락했습니다"
 MBQ_VS_TB_SILENT: "메시지 음소거"
 MBQ_VS_TT_TB_SILENT: "#T 메시지 음소거#!\n• 당신에게 온 제안은 제안 창 없이 도착합니다\n• 자동화는 체크 항목에 맞는 제안을 수락하고 나머지는 거절하며, 메시지는 로그에만 남습니다"
 mbq_acc_last_desc: "[ROOT.Var('mbq_acc_last').Char.GetShortUIName][ROOT.Var('mbq_acc_last').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tributary_hegemon_offer: "조공 제안 도착"
 MBQ_TBO_COST: "변경 시 조공국 하나당 @prestige_icon! [prestige|E] 150을 한 번 소모"
 MBQ_VS_MASTER: "자동화: 봉신과 조공"
 MBQ_VS_TT_MASTER: "#T 자동화: 봉신과 조공#!"
