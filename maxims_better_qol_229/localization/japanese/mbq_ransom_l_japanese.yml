l_japanese:
 MBQ_RS_BTN_TT: "#T 身代金の自動化#!\n• クリック：設定を開く。もう一度クリックすると閉じる\n• 右クリック：自動化のオン・オフ"
 MBQ_RS_BTN_TT_ON: "#T 身代金の自動化#!\n• クリック：設定を開く。もう一度クリックすると閉じる\n#P • 右クリック：自動化のオン・オフ#!"
 MBQ_RS_WHO: "身代金で解放する対象"
 MBQ_RS_DUNGEON: "[dungeon|E]の囚人"
 MBQ_RS_HOUSE: "[house_arrest|E]中の囚人"
 MBQ_RS_TT_DUNGEON: "#T 地下牢#!\n• チェック時：自分の地下牢の囚人を含める"
 MBQ_RS_TT_HOUSE: "#T 自宅軟禁#!\n• チェック時：自宅軟禁中の囚人を含める"
 MBQ_RS_RANK: "身代金で解放するランクの上限（含む）"
 MBQ_RS_T0: "称号なし"
 MBQ_RS_T1: "男爵"
 MBQ_RS_T2: "伯爵"
 MBQ_RS_T3: "公爵"
 MBQ_RS_T4: "王"
 MBQ_RS_TT_RANK: "#T 身代金の上限ランク#!\n• 選んだランク以下の虜囚（称号なしを含む）の身代金を払って解放する\n• 虜囚の最高位の称号が基準で、皇帝は対象外"
 MBQ_RS_TT_T1: "#T 男爵#!\n• 称号のない囚人と男爵を身代金で解放する\n• [baron|E]とは、最高位の称号が[barony|E]である統治者"
 MBQ_RS_AUTO: "自動化オン"
 MBQ_RS_TT_AUTO: "#T 自動化#!\n• 選んだ間隔で虜囚を解放する。あなたの虜囚のみ"
 MBQ_RS_MONTHLY: "毎月"
 MBQ_RS_QUARTERLY: "三か月ごと"
 MBQ_RS_TT_TAKT: "#T 間隔#!\n• 自動化が囚人を確認する頻度\n• 変更はすぐに反映される：次回の確認は今日から一間隔後"
 MBQ_RS_PREVIEW: "今すぐ身代金：[GetPlayer.MakeScope.Var('mbq_rs_prev_n').GetValue|0][SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_rs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_RS_PRISONER_1', 'MBQ_RS_PRISONER_N' )]、合計@gold_icon! [GetPlayer.MakeScope.Var('mbq_rs_prev_gold').GetValue|0]"
 MBQ_RS_RUN: "今すぐ実行"
 MBQ_RS_TT_RUN: "#T 今すぐ実行#!\n• 該当する各囚人に、支払者が承諾すれば1回身代金を申し出る"
 mbq_rs_sum_title: "身代金で解放された囚人"
 mbq_rs_sum_desc: "解放：[ROOT.Var('mbq_rs_n').GetValue|0]人の囚人、合計@gold_icon! [ROOT.Var('mbq_rs_sum').GetValue|0][ROOT.Char.Custom('mbq_rs_s1')][ROOT.Char.Custom('mbq_rs_s2')][ROOT.Char.Custom('mbq_rs_s3')][ROOT.Char.Custom('mbq_rs_s4')][ROOT.Char.Custom('mbq_rs_s5')][ROOT.Char.Custom('mbq_rs_more')]"
 mbq_rs_empty: ""
 mbq_rs_more_line: "\n他[ROOT.Var('mbq_rs_rest').GetValue|0]人"
 mbq_rs_none_line: "\n該当する囚人がいなかったか、承諾する支払者がいませんでした。"
 message_filter_mbq_ransom_summary: "身代金で解放された囚人（Better Quality of Life）"
 message_filter_mbq_ransom_summary_desc: "Better Quality of Lifeがあなたに代わって行った身代金の申し出のまとめ。"
 mbq_rs_line1_gold: "\n[ROOT.Var('mbq_rs_c1').Char.GetShortUIName][ROOT.Var('mbq_rs_c1').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g1').GetValue|0]"
 mbq_rs_line1_hook: "\n[ROOT.Var('mbq_rs_c1').Char.GetShortUIName][ROOT.Var('mbq_rs_c1').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line2_gold: "\n[ROOT.Var('mbq_rs_c2').Char.GetShortUIName][ROOT.Var('mbq_rs_c2').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g2').GetValue|0]"
 mbq_rs_line2_hook: "\n[ROOT.Var('mbq_rs_c2').Char.GetShortUIName][ROOT.Var('mbq_rs_c2').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line3_gold: "\n[ROOT.Var('mbq_rs_c3').Char.GetShortUIName][ROOT.Var('mbq_rs_c3').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g3').GetValue|0]"
 mbq_rs_line3_hook: "\n[ROOT.Var('mbq_rs_c3').Char.GetShortUIName][ROOT.Var('mbq_rs_c3').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line4_gold: "\n[ROOT.Var('mbq_rs_c4').Char.GetShortUIName][ROOT.Var('mbq_rs_c4').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g4').GetValue|0]"
 mbq_rs_line4_hook: "\n[ROOT.Var('mbq_rs_c4').Char.GetShortUIName][ROOT.Var('mbq_rs_c4').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line5_gold: "\n[ROOT.Var('mbq_rs_c5').Char.GetShortUIName][ROOT.Var('mbq_rs_c5').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g5').GetValue|0]"
 mbq_rs_line5_hook: "\n[ROOT.Var('mbq_rs_c5').Char.GetShortUIName][ROOT.Var('mbq_rs_c5').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 MBQ_RS_MIN_HEAD: "最低身代金"
 MBQ_RS_MIN_100: "満額"
 MBQ_RS_MIN_STAFFEL: "収監期間に応じて"
 MBQ_RS_TT_MIN: "#T 身代金#!\n• すぐに：実際の@gold_icon! 金なら何でもよい。満額：身代金の全額\n• 収監期間に応じて：待つほど少ない額でよい"
 MBQ_RS_EXCL_HEAD: "投獄されたままの者"
 MBQ_RS_TT_EXCL: "#T 投獄されたままの者#!\n• 該当する虜囚は自動化では決して解放されない\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_NOTE_EXEMPT: "• 監獄タブの一括操作で設定した除外は、ここでは適用されない。このウィンドウの除外を使うこと"
 MBQ_RS_EX_WAR: "@war_icon! 戦争の敵"
 MBQ_RS_EX_CLAIM: "あなたの称号への請求権"
 MBQ_RS_EX_RIVAL: "好敵手と宿敵"
 MBQ_RS_EX_DYN: "自分の王朝"
 MBQ_RS_TT_EX_WAR: "#T 戦争の敵#!\n• 虜囚、身代金を払う主君、または虜囚が継ぐ称号の保持者が、あなたと[war|E]中"
 MBQ_RS_TT_EX_CLAIM: "#T あなたの称号への請求権#!\n• 囚人があなたの[duchy|E]以上の称号に[claim|E]を持つ\n• または、ランクを問わずあなたの[primary_title|E]に対して"
 MBQ_RS_TT_EX_RIVAL: "#T 好敵手と宿敵#!\n• 囚人があなたの[rival|E]または[nemesis|E]"
 MBQ_RS_TT_EX_DYN: "#T 自分の王朝#!\n• 囚人があなたの[dynasty|E]に属する（近親者の大半を含む）"
 MBQ_RS_TT_AUTO_X: "$MBQ_RS_TT_AUTO$\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_TT_RUN_X: "$MBQ_RS_TT_RUN$\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_TT_AUTO_BLOCKED: "#T 自動化#!\n• #N 停止中：#! 最低身代金の段階が選ばれていない\n• 「最低身代金」の段階を1つチェックする"
 MBQ_RS_TT_RUN_BLOCKED: "#T 今すぐ実行#!\n• #N ロック中：#! 最低身代金の段階が選ばれていない\n• 「最低身代金」の段階を1つチェックする"
 MBQ_CAT_GENERAL: "宗派と改宗"
 MBQ_CAT_PRISON: "牢獄と身代金"
 MBQ_CAT_VASSALS: "封臣と貢納：自動化"
 MBQ_CAT_COUNTIES: "称号の授与"
 MBQ_RS_TAKT: "間隔"
 MBQ_RS_TT_RED: "#T 無効な選択#!\n• このグループで少なくとも一つチェックする\n• それまで自動化は停止し、「今すぐ実行」はグレーのまま"
 MBQ_RS_MIN_NOW: "すぐに"
 MBQ_RS_EX_FACTION: "派閥の指導者（反乱を含む）"
 MBQ_RS_EX_HOOK: "フックを持つ囚人"
 MBQ_RS_TT_EX_FACTION: "#T 派閥の指導者#!\n• チェック時：あなたに敵対する[faction|E]の指導者は、農民反乱や独立派閥を含め、身代金で解放されない"
 MBQ_RS_TT_EX_HOOK: "#T フック#!\n• チェック時：あなたが[hook|E]を持つ囚人は、弱いフックも含め、身代金で解放されない"
 MBQ_RS_RED_LEGEND: "赤で表示：この設定では自動化は動作しません。"
 MBQ_RS_EXC_ALL: "すべて"
 MBQ_RS_EXC_RESET: "なし"
 MBQ_RS_TT_MIN_NOW: "#T すぐに#!\n• 実際の[gold|E]であれば何でもよい\n• [gold|E]を提示せず、[hook|E]などだけの支払者は受け入れられない"
 MBQ_RS_TT_MIN_100: "#T 満額#!\n• 支払者は身代金の全額を支払う必要がある\n• [gold|E]を提示せず、[hook|E]などだけの支払者は受け入れられない"
 MBQ_RS_TT_MIN_STAFFEL: "#T 収監期間に応じて#!\n• 収監が長いほど、少ない@gold_icon! 身代金でよい\n• 非常に長いと、実際の金なら何でもよい"
 MBQ_RS_PRISONER_1: "人の囚人"
 MBQ_RS_PRISONER_N: "人の囚人"
 MBQ_RS_EX_VASSAL: "@vassal_icon! 直臣"
 MBQ_RS_EX_SUBVASSAL: "@vassal_icon! 陪臣"
 MBQ_RS_TT_EX_VASSAL: "#T 直臣#!\n• チェック時：あなた直属の[vassals|E]は身代金で解放されない"
 MBQ_RS_TT_EX_SUBVASSAL: "#T 陪臣#!\n• チェック時：あなたの封臣の封臣は身代金で解放されない\n• あなたの領国内であなたの下にいるが、直属の[vassals|E]ではない"
 MBQ_RS_NOBODY: "誰もいない"
 MBQ_RS_TT_NOBODY: "#T 誰もいない#!\n• 身代金で解放される囚人はいない\n• 自動化は停止し、今すぐ実行はグレーのまま"
 MBQ_RS_TT_T0: "#T 称号なし#!\n• 領地称号のない囚人のみ身代金で解放する\n• 囚人が持つ最高位の称号が基準"
 MBQ_RS_TT_T2: "#T 伯爵#!\n• 称号のない囚人、男爵、伯爵を身代金で解放する\n• 囚人が持つ最高位の称号が基準"
 MBQ_RS_TT_T3: "#T 公爵#!\n• 公爵までの囚人を身代金で解放する\n• 囚人が持つ最高位の称号が基準"
 MBQ_RS_TT_T4: "#T 王#!\n• 王までの虜囚の身代金を払う。皇帝は対象外\n• 虜囚の最高位の称号が基準"
