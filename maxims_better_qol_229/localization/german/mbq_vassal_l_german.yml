l_german:
 MBQ_VS_AUTO_HEAD: "Automatik"
 MBQ_VS_TT_AUTO_HEAD: "#T Automatik#!\n• Angebote und Forderungen gehen nur an Herrscher, die zustimmen würden\n• Angebote an Euch werden wie unten gewählt angenommen"
 MBQ_VS_AUTO_VS: "@vassal_icon! Vasallentum anbieten"
 MBQ_VS_AUTO_TB: "@tributary_icon! Tribut verlangen"
 MBQ_VS_TT_AUTO_VS: "#T Vasallentum anbieten#!\n• Bietet jedem passenden Herrscher, der zustimmt, das Vasallentum an, mit dem besten Vertrag für Euch\n• Nur solange unter Eurer [vassal_limit|E] Platz ist"
 MBQ_VS_TT_AUTO_TB: "#T Tribut verlangen#!\n• Verlangt Tribut von jedem passenden Nachbarn, der zustimmt, wie die normale Interaktion\n• #warning @prestige_icon! Kostet [prestige|E] wie die normale Interaktion#!"
 MBQ_VS_TT_MIN_HEAD: "#T Vertrag#!\n• Gilt für Vasallentum anbieten, Treueschwüre annehmen und Tributangebote annehmen\n• Nicht für Tribut verlangen"
 MBQ_VS_MIN_HIGH: "Hoch"
 MBQ_VS_MIN_NORMAL: "Normal"
 MBQ_VS_MIN_LOW: "Niedrig"
 MBQ_VS_TT_MIN_HIGH: "#T Hoch#!\n• Nur hohe [obligations|E]\n• Angebote an Euch: nur hohe werden automatisch angenommen"
 MBQ_VS_TT_MIN_NORMAL: "#T Normal#!\n• Erst hohe, dann normale [obligations|E]\n• Angebote an Euch: hohe und normale werden automatisch angenommen"
 MBQ_VS_TT_MIN_LOW: "#T Niedrig#!\n• Erst hohe, dann normale, dann niedrige [obligations|E]\n• Angebote an Euch: jedes Angebot wird automatisch angenommen"
 MBQ_VS_WHO: "Vasallentum anbieten an:"
 MBQ_VS_TT_WHO: "#T Wer wird gefragt#!\n• Gilt nur für das Vasallentum\n• Tribut wird immer von unabhängigen Nachbarn verlangt"
 MBQ_VS_NB: "Unabhängige Nachbarn"
 MBQ_VS_TRIB: "Eure Tributzahler"
 MBQ_VS_TT_NB: "#T Unabhängige Nachbarn#!\n• [independent_ruler|E] neben Eurem [realm|E] werden gefragt, auch über Wasser"
 MBQ_VS_TT_TRIB: "#T Eure Tributzahler#!\n• Eure eigenen [tributary|E] werden ebenfalls gefragt"
 MBQ_VS_RANK: "Bis Rang (einschließlich)"
 MBQ_VS_TT_RANK: "#T Bis Rang#!\n• Herrscher bis zu diesem Rang werden gefragt, ihre Angebote werden automatisch angenommen\n• Kaiser werden nie gefragt"
 MBQ_VS_EXCL_HEAD: "Diese Herrscher überspringen"
 MBQ_VS_TT_EXCL: "#T Diese Herrscher überspringen#!\n• Die Automatik fragt solche Herrscher nie und nimmt ihre Angebote nie an\n• Ihre Angebote an Euch kommen wie gewohnt"
 MBQ_VS_EX_RIVAL: "@rival_icon! Rivalen und Erzfeinde"
 MBQ_VS_EX_CLAIM: "Anspruch auf Eure Titel"
 MBQ_VS_EX_FAITH: "@religious_icon! Anderer Glaube"
 MBQ_VS_EX_FACTION: "@faction_icon! Fraktionsführer"
 MBQ_VS_TT_EX_RIVAL: "#T Rivalen und Erzfeinde#!\n• Der Herrscher ist Euer [rival|E] oder Euer [nemesis|E]"
 MBQ_VS_TT_EX_CLAIM: "#T Anspruch auf Eure Titel#!\n• Der Herrscher hat einen [claim|E] auf einen Eurer Titel ab Grafenrang"
 MBQ_VS_TT_EX_FAITH: "#T Anderer Glaube#!\n• Der Herrscher folgt einem anderen [faith|E]n als Ihr"
 MBQ_VS_TT_EX_FACTION: "#T Fraktionsführer#!\n• Der Herrscher führt eine [faction|E] gegen Euch"
 MBQ_VS_PREVIEW: "Jetzt vasallisieren: [GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )], @vassal_icon! [GetPlayer.GetNumVassalsTowardsLimit]/[GetPlayer.GetVassalLimit]"
 MBQ_TB_PREVIEW: "Jetzt Tribut verlangen: bis zu [GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )]"
 MBQ_TBO_HEAD: "Vertragswünsche für Tributzahler"
 MBQ_TBO_TT_HEAD: "#T Vertragswünsche für Tributzahler#!\n• Für jeden neuen [tributary|E] aus diesem Fenster werden diese Wünsche gleich nach der Annahme umgesetzt\n• #warning @prestige_icon! Kostet einmal 150 [prestige|E] je Tributzahler, [opinion|E] -30 bei ihm und -10 bei den übrigen, nur wenn sich etwas ändert#!"
 MBQ_TBO_NO_GUAR: "Keine Kriegspflicht"
 MBQ_TBO_TT_NO_GUAR: "#T Keine Kriegspflicht#!\n• Die Automatik senkt Eure Pflicht, ihren Kriegen beizutreten, wo das Spiel es erlaubt"
 MBQ_TBO_TAX: "Höhere Steuern"
 MBQ_TBO_TT_TAX: "#T Höhere Steuern#!\n• Eine Stufe mehr [taxes|E] als zu Beginn, nur wenn das Spiel es erlaubt"
 MBQ_TBO_PRESTIGE: "Mehr Prestige"
 MBQ_TBO_TT_PRESTIGE: "#T Mehr Prestige#!\n• Eine Stufe mehr [prestige|E]-Abgabe als zu Beginn, nur wenn das Spiel es erlaubt"
 MBQ_TBO_WAR: "Sie unterstützen Eure Kriege"
 MBQ_TBO_TT_WAR: "#T Sie unterstützen Eure Kriege#!\n• Der neue Tributzahler muss Euren Kriegen beitreten, nur wenn das Spiel es erlaubt"
 MBQ_VS_RULER_1: "Herrscher"
 MBQ_VS_RULER_N: "Herrscher"
 MBQ_VS_TT_RUN: "#T Jetzt ausführen#!\n• Bietet einmal jedem passenden Herrscher Vasallentum an, der zustimmen würde\n• Ausgegraut: niemand, dem man es anbieten könnte"
 MBQ_TB_TT_RUN: "#T Jetzt ausführen#!\n• Verlangt einmal Tribut von jedem passenden Nachbarn, der zustimmen würde\n• Ausgegraut: niemand, von dem man ihn verlangen könnte"
 MBQ_VS_MANDALA: "Mandala-Herrscher: Anbieten und Verlangen ruhen."
 mbq_vs_sum_title: "Neue Vasallen"
 mbq_vs_sum_desc: "Vasallentum angenommen: [ROOT.Var('mbq_vs_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_vs_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )][ROOT.Char.Custom('mbq_vs_s1')][ROOT.Char.Custom('mbq_vs_s2')][ROOT.Char.Custom('mbq_vs_s3')][ROOT.Char.Custom('mbq_vs_s4')][ROOT.Char.Custom('mbq_vs_s5')][ROOT.Char.Custom('mbq_vs_more')]"
