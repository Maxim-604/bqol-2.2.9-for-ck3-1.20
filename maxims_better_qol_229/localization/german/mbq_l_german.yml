 MBQ_TT_DIVORCE: "#T Alle Ersuchen um [divorce|E] annehmen#!\n$EFFECT_LIST_BULLET$ Jedes „Ehescheidung ersuchen“, das Euch als [head_of_faith|E] erreicht, wird ohne Nachfrage angenommen.\n$EFFECT_LIST_BULLET$ Das gilt auch, wenn ein [dynast|E] für ein Familienmitglied bittet.\n\n#weak Ohne Haken: wie im Grundspiel.#!"
 MBQ_TT_DIVORCE_ON: "#T Alle Ersuchen um [divorce|E] annehmen#!\n#P $EFFECT_LIST_BULLET$ Jedes „Ehescheidung ersuchen“, das Euch als [head_of_faith|E] erreicht, wird ohne Nachfrage angenommen.\n$EFFECT_LIST_BULLET$ Das gilt auch, wenn ein [dynast|E] für ein Familienmitglied bittet.#!"
 MBQ_TT_TRIB_NOMADS: "#T Für Nomaden#!\n$EFFECT_LIST_BULLET$ Angebote von [nomads|E]- und [herder|E]-Reichen, [tributary|E] zu werden, werden ohne Nachfrage angenommen.\n$EFFECT_LIST_BULLET$ Nur Angebote anderer Herrscher an Euch; Eure eigenen Forderungen stehen unter Vasallen.\n$EFFECT_LIST_BULLET$ Andere Herrscher stellt das Kästchen darunter ein.\n\n#weak Ohne Haken: wie im Grundspiel.#!"
 MBQ_TT_TRIB_ALL: "#T Alle anderen#!\n$EFFECT_LIST_BULLET$ Angebote aller Herrscher außer [nomads|E]- und [herder|E]-Reichen, [tributary|E] zu werden, werden ohne Nachfrage angenommen.\n$EFFECT_LIST_BULLET$ Nur Angebote anderer Herrscher an Euch; Eure eigenen Forderungen stehen unter Vasallen.\n$EFFECT_LIST_BULLET$ Diese Reiche stellt das Kästchen darüber ein.\n\n#weak Ohne Haken: wie im Grundspiel.#!"
 MBQ_TT_GRANT: "#T Automatik: Vasallen an rechtmäßigen Lehnsherrn übergeben#!\n$EFFECT_LIST_BULLET$ Jedes Quartal gehen kleine [vassals|E] im Gebiet eines größeren Vasallen an diesen.\n$EFFECT_LIST_BULLET$ Dieser ist ihr rechtmäßiger [Concept('liege', 'Lehnsherr')|E]."
 MBQ_TT_GRANT_ON: "#T Automatik: Vasallen an rechtmäßigen Lehnsherrn übergeben#!\n#P $EFFECT_LIST_BULLET$ Jedes Quartal gehen kleine [vassals|E] im Gebiet eines größeren Vasallen an diesen.\n$EFFECT_LIST_BULLET$ Dieser ist ihr rechtmäßiger [Concept('liege', 'Lehnsherr')|E].#!"
