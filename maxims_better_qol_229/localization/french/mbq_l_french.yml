l_french:
 mbq_tributary_auto_accepted_toast: "Offre de tributaire acceptée automatiquement"
 mbq_auto_grant_vassals_toast: "Vassaux transférés à leur seigneur lige légitime"
 MBQ_WIN_TITLE: "Better Quality of Life"
 MBQ_WIN_GRANT: "Automatisation : transférer les vassaux à leur seigneur lige légitime"
 MBQ_WIN_NOMADS: "Pour les nomades"
 MBQ_WIN_EVERYONE: "Tous les autres"
 MBQ_WIN_MUTE: "Lettres muettes"
 MBQ_WIN_HUD_TT: "#T Better Quality of Life#!\n#I Cliquez pour ouvrir la fenêtre des réglages#!"
 MBQ_WIN_DIVORCE: "@religious_icon! Accepter tous les divorces en tant que Chef de la foi"
 MBQ_TT_DIVORCE: "#T Accepter toutes les demandes de [divorce|E]#!\n$EFFECT_LIST_BULLET$ Chaque « Demander un divorce » qui vous parvient en tant que [head_of_faith|El] est accepté sans demander.\n$EFFECT_LIST_BULLET$ Cela vaut aussi pour les demandes qu’un [dynast|El] envoie pour un membre de sa famille.\n\n#weak Case non cochée : comme dans le jeu de base.#!"
 MBQ_TT_DIVORCE_ON: "#T Accepter toutes les demandes de [divorce|E]#!\n#P $EFFECT_LIST_BULLET$ Chaque « Demander un divorce » qui vous parvient en tant que [head_of_faith|El] est accepté sans demander.\n$EFFECT_LIST_BULLET$ Cela vaut aussi pour les demandes qu’un [dynast|El] envoie pour un membre de sa famille.#!"
 MBQ_TT_TRIB_NOMADS: "#T Pour les nomades#!\n$EFFECT_LIST_BULLET$ Les offres de [tributary|El] des royaumes de [nomads|El] et de [herder|El] sont acceptées sans demander.\n$EFFECT_LIST_BULLET$ Seulement les offres que d’autres dirigeants vous font ; vos propres exigences sont sous Vassaux.\n$EFFECT_LIST_BULLET$ Les autres dirigeants dépendent de la case en dessous.\n\n#weak Case non cochée : comme dans le jeu de base.#!"
 MBQ_TT_TRIB_ALL: "#T Tous les autres#!\n$EFFECT_LIST_BULLET$ Les offres de [tributary|El] de n’importe quel dirigeant, sauf des royaumes de [nomads|El] et de [herder|El], sont acceptées sans demander.\n$EFFECT_LIST_BULLET$ Seulement les offres que d’autres dirigeants vous font ; vos propres exigences sont sous Vassaux.\n$EFFECT_LIST_BULLET$ Ces royaumes dépendent de la case au-dessus.\n\n#weak Case non cochée : comme dans le jeu de base.#!"
 MBQ_TT_GRANT: "#T Automatisation : transférer les vassaux à leur seigneur lige légitime#!\n$EFFECT_LIST_BULLET$ Chaque trimestre, les petits [vassals|El] du territoire d’un vassal plus grand passent à ce vassal.\n$EFFECT_LIST_BULLET$ Ce vassal est leur [liege|El] légitime."
 MBQ_TT_GRANT_ON: "#T Automatisation : transférer les vassaux à leur seigneur lige légitime#!\n#P $EFFECT_LIST_BULLET$ Chaque trimestre, les petits [vassals|El] du territoire d’un vassal plus grand passent à ce vassal.\n$EFFECT_LIST_BULLET$ Ce vassal est leur [liege|El] légitime.#!"
 mbq_best_terms_no_prestige: "Pas assez de [prestige|El] pour modifier le [tributary_contract|El]"
