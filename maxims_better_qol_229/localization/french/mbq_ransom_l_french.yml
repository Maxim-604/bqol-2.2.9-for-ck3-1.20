l_french:
 MBQ_RS_BTN_TT: "#T Rançon automatique#!\n• Clic : ouvrir les paramètres, un second clic les ferme\n• Clic droit : automatisation activée/désactivée"
 MBQ_RS_BTN_TT_ON: "#T Rançon automatique#!\n• Clic : ouvrir les paramètres, un second clic les ferme\n#P • Clic droit : automatisation activée/désactivée#!"
 MBQ_RS_WHO: "Qui est libéré contre rançon"
 MBQ_RS_DUNGEON: "Prisonniers au [dungeon|E]"
 MBQ_RS_HOUSE: "Prisonniers en [house_arrest|E]"
 MBQ_RS_TT_DUNGEON: "#T Cachot#!\n• Coché : les prisonniers de votre cachot sont inclus"
 MBQ_RS_TT_HOUSE: "#T Résidence surveillée#!\n• Coché : les prisonniers en résidence surveillée sont inclus"
 MBQ_RS_RANK: "Rançon jusqu’au rang (inclus)"
 MBQ_RS_T0: "Sans titre"
 MBQ_RS_T1: "Baron"
 MBQ_RS_T2: "Comte"
 MBQ_RS_T3: "Duc"
 MBQ_RS_T4: "Roi"
 MBQ_RS_TT_RANK: "#T Rançon jusqu’au rang#!\n• Libère jusqu’au rang choisi, rangs inférieurs et sans titre compris\n• Le plus haut titre compte, jamais les empereurs"
 MBQ_RS_TT_T1: "#T Baron#!\n• Libère contre rançon les prisonniers sans titre et les barons\n• Un [baron|El] est un dirigeant dont le plus haut titre est une [barony|El]"
 MBQ_RS_AUTO: "Automatisation activée"
 MBQ_RS_TT_AUTO: "#T Automatisation#!\n• Libère à l’intervalle choisi, pour vous seul"
 MBQ_RS_MONTHLY: "chaque mois"
 MBQ_RS_QUARTERLY: "tous les trois mois"
 MBQ_RS_TT_TAKT: "#T Intervalle#!\n• Fréquence à laquelle l’automatisation vérifie vos prisonniers\n• Un changement s’applique tout de suite : la prochaine vérification a lieu un intervalle après aujourd’hui"
 MBQ_RS_PREVIEW: "Rançon maintenant : [GetPlayer.MakeScope.Var('mbq_rs_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_rs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_RS_PRISONER_1', 'MBQ_RS_PRISONER_N' )] pour @gold_icon! [GetPlayer.MakeScope.Var('mbq_rs_prev_gold').GetValue|0]"
 MBQ_RS_RUN: "Lancer maintenant"
 MBQ_RS_TT_RUN: "#T Lancer maintenant#!\n• Propose une fois une rançon à chaque prisonnier correspondant dont le payeur accepte"
 mbq_rs_sum_title: "Prisonniers libérés contre rançon"
 mbq_rs_sum_desc: "Libérés : [ROOT.Var('mbq_rs_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_rs_n').GetValue, '(CFixedPoint)1' ), 'MBQ_RS_PRISONER_1', 'MBQ_RS_PRISONER_N' )], au total @gold_icon! [ROOT.Var('mbq_rs_sum').GetValue|0][ROOT.Char.Custom('mbq_rs_s1')][ROOT.Char.Custom('mbq_rs_s2')][ROOT.Char.Custom('mbq_rs_s3')][ROOT.Char.Custom('mbq_rs_s4')][ROOT.Char.Custom('mbq_rs_s5')][ROOT.Char.Custom('mbq_rs_more')]"
 mbq_rs_empty: ""
 mbq_rs_more_line: "\net [ROOT.Var('mbq_rs_rest').GetValue|0] autres"
 mbq_rs_none_line: "\nAucun prisonnier ne correspondait, ou aucun payeur n’a accepté."
 message_filter_mbq_ransom_summary: "Prisonniers libérés contre rançon (Better Quality of Life)"
 message_filter_mbq_ransom_summary_desc: "Récapitulatif des propositions de rançon faites pour vous par Better Quality of Life."
 mbq_rs_line1_gold: "\n[ROOT.Var('mbq_rs_c1').Char.GetShortUIName][ROOT.Var('mbq_rs_c1').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g1').GetValue|0]"
 mbq_rs_line1_hook: "\n[ROOT.Var('mbq_rs_c1').Char.GetShortUIName][ROOT.Var('mbq_rs_c1').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line2_gold: "\n[ROOT.Var('mbq_rs_c2').Char.GetShortUIName][ROOT.Var('mbq_rs_c2').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g2').GetValue|0]"
 mbq_rs_line2_hook: "\n[ROOT.Var('mbq_rs_c2').Char.GetShortUIName][ROOT.Var('mbq_rs_c2').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line3_gold: "\n[ROOT.Var('mbq_rs_c3').Char.GetShortUIName][ROOT.Var('mbq_rs_c3').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g3').GetValue|0]"
 mbq_rs_line3_hook: "\n[ROOT.Var('mbq_rs_c3').Char.GetShortUIName][ROOT.Var('mbq_rs_c3').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line4_gold: "\n[ROOT.Var('mbq_rs_c4').Char.GetShortUIName][ROOT.Var('mbq_rs_c4').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g4').GetValue|0]"
 mbq_rs_line4_hook: "\n[ROOT.Var('mbq_rs_c4').Char.GetShortUIName][ROOT.Var('mbq_rs_c4').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line5_gold: "\n[ROOT.Var('mbq_rs_c5').Char.GetShortUIName][ROOT.Var('mbq_rs_c5').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g5').GetValue|0]"
 mbq_rs_line5_hook: "\n[ROOT.Var('mbq_rs_c5').Char.GetShortUIName][ROOT.Var('mbq_rs_c5').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 MBQ_RS_MIN_HEAD: "Rançon minimale"
 MBQ_RS_MIN_100: "Prix complet"
 MBQ_RS_MIN_STAFFEL: "Selon la durée d’emprisonnement"
 MBQ_RS_TT_MIN: "#T Rançon#!\n• Tout de suite : tout @gold_icon! or réel suffit. Prix complet : la rançon entière\n• Selon la durée : plus il attend, moins il en faut"
 MBQ_RS_EXCL_HEAD: "Ceux-ci restent en prison"
 MBQ_RS_TT_EXCL: "#T Ceux-ci restent en prison#!\n• L’automatisation ne libère jamais ces prisonniers\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_NOTE_EXEMPT: "• Les exclusions réglées pour les actions de masse dans l’onglet prison ne s’appliquent pas ici ; utilisez les exclusions de cette fenêtre"
 MBQ_RS_EX_WAR: "@war_icon! Ennemis de guerre"
 MBQ_RS_EX_CLAIM: "Revendications sur vos titres"
 MBQ_RS_EX_RIVAL: "Rivaux et ennemis jurés"
 MBQ_RS_EX_DYN: "Votre propre dynastie"
 MBQ_RS_TT_EX_WAR: "#T Ennemis de guerre#!\n• Le prisonnier, son suzerain payeur ou le détenteur de son titre d’héritage est en [war|El] contre vous"
 MBQ_RS_TT_EX_CLAIM: "#T Revendications sur vos titres#!\n• Le prisonnier a une [claim|El] sur l’un de vos titres de rang [duchy|El] ou supérieur\n• Ou sur votre [primary_title|El], quel que soit son rang"
 MBQ_RS_TT_EX_RIVAL: "#T Rivaux et ennemis jurés#!\n• Le prisonnier est votre [rival|El] ou votre [nemesis|El]"
 MBQ_RS_TT_EX_DYN: "#T Votre propre dynastie#!\n• Le prisonnier appartient à votre [dynasty|El], ce qui couvre la plus grande partie de votre famille proche"
 MBQ_RS_TT_AUTO_X: "$MBQ_RS_TT_AUTO$\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_TT_RUN_X: "$MBQ_RS_TT_RUN$\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_TT_AUTO_BLOCKED: "#T Automatisation#!\n• #N Suspendue :#! aucun niveau de rançon minimale n’est choisi\n• Cochez un niveau sous Rançon minimale"
 MBQ_RS_TT_RUN_BLOCKED: "#T Lancer maintenant#!\n• #N Verrouillé :#! aucun niveau de rançon minimale n’est choisi\n• Cochez un niveau sous Rançon minimale"
 MBQ_CAT_GENERAL: "Foi et conversion"
 MBQ_CAT_PRISON: "Prison et rançon"
 MBQ_CAT_VASSALS: "Vassaux et tribut : automatisation"
 MBQ_CAT_COUNTIES: "Accorder des titres"
 MBQ_RS_TAKT: "Intervalle"
 MBQ_RS_TT_RED: "#T Sélection invalide#!\n• Cochez au moins une case de ce groupe\n• D’ici là, l’automatisation est suspendue et Lancer maintenant reste grisé"
 MBQ_RS_MIN_NOW: "tout de suite"
 MBQ_RS_EX_FACTION: "Chefs de faction (révoltes comprises)"
 MBQ_RS_EX_HOOK: "Prisonniers sur lesquels vous avez un hameçon"
 MBQ_RS_TT_EX_FACTION: "#T Chefs de faction#!\n• Coché : les chefs de toute [faction|El] contre vous ne sont jamais libérés contre rançon, y compris les révoltes paysannes et les factions d’indépendance"
 MBQ_RS_TT_EX_HOOK: "#T Hameçons#!\n• Coché : les prisonniers sur lesquels vous avez un [hook|El] ne sont jamais libérés contre rançon, y compris avec un hameçon faible"
 MBQ_RS_RED_LEGEND: "Marqué en rouge : l’automatisation ne s’exécute pas ainsi."
 MBQ_RS_EXC_ALL: "Tous"
 MBQ_RS_EXC_RESET: "Aucun"
 MBQ_RS_TT_MIN_NOW: "#T Tout de suite#!\n• Tout or réel suffit\n• Un payeur qui n’offre pas d’or, seulement un hameçon ou similaire, n’est jamais accepté"
 MBQ_RS_TT_MIN_100: "#T Prix complet#!\n• Le payeur doit payer la rançon entière\n• Un payeur qui n’offre pas d’or, seulement un hameçon ou similaire, n’est jamais accepté"
 MBQ_RS_TT_MIN_STAFFEL: "#T Selon la durée#!\n• Plus un prisonnier est détenu, moins de @gold_icon! rançon suffit\n• Après très longtemps, tout or réel suffit"
 MBQ_RS_PRISONER_1: "prisonnier"
 MBQ_RS_PRISONER_N: "prisonniers"
 MBQ_RS_EX_VASSAL: "@vassal_icon! Vos vassaux"
 MBQ_RS_EX_SUBVASSAL: "@vassal_icon! Vassaux indirects"
 MBQ_RS_TT_EX_VASSAL: "#T Vos vassaux#!\n• Coché : vos [vassals|El] directs ne sont jamais libérés contre rançon"
 MBQ_RS_TT_EX_SUBVASSAL: "#T Vassaux indirects#!\n• Coché : les vassaux de vos vassaux ne sont jamais libérés contre rançon\n• Ils sont sous vous dans votre royaume, mais ne sont pas vos [vassals|El] directs"
 MBQ_RS_NOBODY: "Personne"
 MBQ_RS_TT_NOBODY: "#T Personne#!\n• Aucun prisonnier n’est libéré contre rançon\n• L’automatisation est en pause et Lancer maintenant reste grisé"
 MBQ_RS_TT_T0: "#T Sans titre#!\n• Seuls les prisonniers sans titre de terre sont libérés contre rançon\n• Le titre le plus élevé du prisonnier compte"
 MBQ_RS_TT_T2: "#T Comte#!\n• Les prisonniers sans titre, les barons et les comtes sont libérés contre rançon\n• Le titre le plus élevé du prisonnier compte"
 MBQ_RS_TT_T3: "#T Duc#!\n• Les prisonniers jusqu’aux ducs sont libérés contre rançon\n• Le titre le plus élevé du prisonnier compte"
 MBQ_RS_TT_T4: "#T Roi#!\n• Jusqu’aux rois, jamais les empereurs\n• Le plus haut titre compte"
