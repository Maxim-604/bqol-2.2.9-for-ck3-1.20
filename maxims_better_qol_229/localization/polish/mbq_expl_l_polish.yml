l_polish:
 MBQ_EXPL_Q:0 "?"
 MBQ_EXPL_TT:0 "#T Wyjaśnienie#!\n• Pokazuje, co robią ustawienia nadawania tytułów\n• Kliknij ponownie, aby ukryć"
 MBQ_EXPL_TITLE:0 "Jak działa nadawanie tytułów"
 MBQ_EXPL_H_AUTO:0 "@domain_icon! Automatyzacja"
 MBQ_EXPL_B_AUTO:0 "Gdy przekraczasz swój [Concept( 'domain_limit', 'limit domeny' )|E], mod oddaje nadmiarowe @county_icon! [Concept( 'counties', 'hrabstwa' )|E] innym, samo lub po kliknięciu Uruchom teraz. Twoja [Concept( 'capital', 'stolica' )|E] i tytuły oznaczone jako Cenne zostają przy tobie."
 MBQ_EXPL_H_WHO:0 "@vassal_icon! Odbiorcy"
 MBQ_EXPL_B_WHO:0 "Tytuły trafiają do twoich bezpośrednich [Concept( 'vassals', 'wasali' )|E], [Concept( 'courtiers', 'dworzan' )|E] i rodziny, nigdy do twojego [Concept( 'primary_heir', 'dziedzica głównego' )|E], rywali ani śmiertelnych wrogów."
 MBQ_EXPL_H_FILTERS:0 "Filtry"
 MBQ_EXPL_B_FILTERS:0 "Filtry decydują, kto może dostać tytuł: [Concept( 'religion', 'religia' )|E], [Concept( 'culture', 'kultura' )|E] i wiek. Wasale ze złymi cechami są pomijani. Brak dopasowania: zachowujesz tytuł; przy Nowy szlachcic, gdy brak dostaje go nowy szlachcic twojej [Concept( 'culture', 'kultury' )|E]."
 MBQ_EXPL_H_PRIOS:0 "Preferencje"
 MBQ_EXPL_B_PRIOS:0 "#clickable Beżowe#!: musi. Kto nie pasuje do żadnego z wybranych, odpada.\n#color_light_blue Jasnoniebieskie#!: tylko sortuje. Nikt nie odpada.\nPotem najpierw liczy się priorytet 1. Gdy dwoje jest równych, rozstrzyga priorytet 2, potem 3 i tak dalej."
 MBQ_EXPL_H_CAPS:0 "@county_icon! Limity na odbiorcę"
 MBQ_EXPL_B_CAPS:0 "Żaden wasal nie dostaje więcej hrabstw, niż pozwala limit."
