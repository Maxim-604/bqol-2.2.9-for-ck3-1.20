 MBQ_EXPL_H_FILTERS:0 "Filter"
 MBQ_EXPL_B_FILTERS:0 "Filter bestimmen, wer einen Titel erhalten darf: [religion|E], [culture|E] und Alter. Vasallen mit schlechten Eigenschaften werden übersprungen. Passt niemand: Ihr behaltet den Titel, mit Neuer Adliger als Rückfall bekommt ihn ein neuer Adliger Eurer Kultur."
 MBQ_EXPL_H_PRIOS:0 "Vorlieben"
