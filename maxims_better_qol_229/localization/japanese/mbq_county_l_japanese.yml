 MBQ_GR_OT_PRESET_5: "あなた自身の条件と優先順位。"
 MBQ_GR_OT_OPT_0: "使用しない。"
 MBQ_GR_OT_OPT_1: "グループ：あなたの@dynasty_icon! [dynasty|E]。\n必須：グループを順に適用、グループに属する者だけが称号を得る。"
 MBQ_GR_OT_OPT_2: "グループ：あなたの[house|E]。\n必須：グループを順に適用、グループに属する者だけが称号を得る。"
 MBQ_GR_OT_OPT_3: "グループ：あなたの孫。\n必須：グループを順に適用、グループに属する者だけが称号を得る。"
 MBQ_GR_OT_OPT_4: "グループ：あなたの子。ただし[primary_heir|E]は除く。\n必須：グループを順に適用、グループに属する者だけが称号を得る。"
 MBQ_GR_OT_OPT_5: "グループ：あなたの廷臣。\n必須：グループを順に適用、グループに属する者だけが称号を得る。"
 MBQ_GR_OT_OPT_6: "グループ：[de_jure|E]公爵領の保持者。\n必須：グループを順に適用、グループに属する者だけが称号を得る。"
 MBQ_GR_OT_OPT_9: "保有する称号が最も少ない者を優先。\n並べ替えのみ：候補を並べ替えるだけで、単独では誰も選ばない。"
 MBQ_GR_OT_OPT_10: "あなたの@sway_to_rite_icon! [rite|E]、次に@religious_icon! [faith|E]、次に@religious_icon! [religion|E]を優先。\n並べ替えのみ：候補を並べ替えるだけで、単独では誰も選ばない。"
 MBQ_GR_OT_OPT_11: "あなたの@culture_icon! [culture|E]、次に@culture_icon! [heritage|E]を優先。\n並べ替えのみ：候補を並べ替えるだけで、単独では誰も選ばない。"
 MBQ_GR_OT_OPT_12: "@skill_stewardship_icon! [stewardship|E]が最も高い者を優先。\n並べ替えのみ：候補を並べ替えるだけで、単独では誰も選ばない。"
 MBQ_GR_OT_OPT_7: "グループ：良い封臣特性：\n• [GetTrait('content').GetName( GetNullCharacter )]\n• [GetTrait('trusting').GetName( GetNullCharacter )]\n• [GetTrait('loyal').GetName( GetNullCharacter )]\n• [GetTrait('humble').GetName( GetNullCharacter )]\n• [GetTrait('patient').GetName( GetNullCharacter )]\n必須：グループを順に適用、グループに属する者だけが称号を得る。"
