 MBQ_GR_OT_OPT_3: "Группа: ваши внуки.\nНеобходимо: группы по порядку, титул получает только тот, кто входит в группу."
 MBQ_GR_OT_OPT_4: "Группа: ваши дети, но не ваш [Concept( 'primary_heir', 'первый наследник' )|E].\nНеобходимо: группы по порядку, титул получает только тот, кто входит в группу."
 MBQ_GR_OT_OPT_5: "Группа: ваши придворные.\nНеобходимо: группы по порядку, титул получает только тот, кто входит в группу."
