 MBQ_WIN_HUD_TT: "#T Better Quality of Life#!\n#I Kliknij, aby otworzyć okno ustawień#!"
 MBQ_WIN_DIVORCE: "@religious_icon! Przyjmuj wszystkie prośby o rozwód jako głowa wiary"
 MBQ_TT_DIVORCE: "#T Przyjmuj wszystkie prośby o [Concept('divorce', 'rozwód')|E]#!\n$EFFECT_LIST_BULLET$ Każda prośba o rozwód, która do Ciebie dotrze, gdy jesteś [Concept('head_of_faith', 'głową wiary')|E], jest przyjmowana bez pytania.\n$EFFECT_LIST_BULLET$ Dotyczy to też próśb wysłanych przez [Concept('dynast', 'głowę dynastii')|E] w imieniu członka rodziny.\n\n#weak Bez haczyka: jak w podstawowej grze.#!"
 MBQ_TT_DIVORCE_ON: "#T Przyjmuj wszystkie prośby o [Concept('divorce', 'rozwód')|E]#!\n#P $EFFECT_LIST_BULLET$ Każda prośba o rozwód, która do Ciebie dotrze, gdy jesteś [Concept('head_of_faith', 'głową wiary')|E], jest przyjmowana bez pytania.\n$EFFECT_LIST_BULLET$ Dotyczy to też próśb wysłanych przez [Concept('dynast', 'głowę dynastii')|E] w imieniu członka rodziny.#!"
 MBQ_TT_TRIB_NOMADS: "#T Dla koczowników#!\n$EFFECT_LIST_BULLET$ Oferty [Concept( 'tributary', 'trybutariusza' )|E] od państw koczowników i pasterzy są przyjmowane bez pytania.\n$EFFECT_LIST_BULLET$ Tylko oferty, które składają ci inni władcy; twoje własne żądania są w Wasalach.\n$EFFECT_LIST_BULLET$ Pozostali władcy zależą od pola poniżej.\n\n#weak Niezaznaczone: jak w grze podstawowej.#!"
 MBQ_TT_TRIB_ALL: "#T Wszyscy pozostali#!\n$EFFECT_LIST_BULLET$ Oferty [Concept( 'tributary', 'trybutariusza' )|E] od każdego władcy, z wyjątkiem państw koczowników i pasterzy, są przyjmowane bez pytania.\n$EFFECT_LIST_BULLET$ Tylko oferty, które składają ci inni władcy; twoje własne żądania są w Wasalach.\n$EFFECT_LIST_BULLET$ Te państwa zależą od pola powyżej.\n\n#weak Niezaznaczone: jak w grze podstawowej.#!"
 MBQ_TT_GRANT: "#T Automatyzacja: przyznawaj wasali ich prawowitemu seniorowi#!\n$EFFECT_LIST_BULLET$ Co kwartał mali [Concept('vassals', 'wasale')|E] z terytorium większego wasala przechodzą do tego wasala.\n$EFFECT_LIST_BULLET$ Jest on ich prawowitym [Concept('liege', 'seniorem')|E]."
 MBQ_TT_GRANT_ON: "#T Automatyzacja: przyznawaj wasali ich prawowitemu seniorowi#!\n#P $EFFECT_LIST_BULLET$ Co kwartał mali [Concept('vassals', 'wasale')|E] z terytorium większego wasala przechodzą do tego wasala.\n$EFFECT_LIST_BULLET$ Jest on ich prawowitym [Concept('liege', 'seniorem')|E].#!"
 mbq_best_terms_no_prestige: "Za mało [Concept('prestige', 'prestiżu')|E], aby zmienić [Concept('tributary_contract', 'kontrakt na trybut')|E]"
