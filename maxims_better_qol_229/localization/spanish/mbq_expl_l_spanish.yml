 MBQ_EXPL_H_AUTO:0 "@domain_icon! Automatización"
 MBQ_EXPL_B_AUTO:0 "Por encima de tu [domain_limit|lE], el mod cede los @county_icon! [counties|lE] sobrantes a otros, por sí solo o con Ejecutar ahora. Tu [capital|lE] y los títulos marcados como Valioso se quedan contigo."
