l_russian:
 MBQ_RS_BTN_TT: "#T Автоматический выкуп#!\n• Щелчок: открыть настройки, повторный щелчок закрывает их\n• Правый щелчок: автоматизация включена или выключена"
 MBQ_RS_BTN_TT_ON: "#T Автоматический выкуп#!\n• Щелчок: открыть настройки, повторный щелчок закрывает их\n#P • Правый щелчок: автоматизация включена или выключена#!"
 MBQ_RS_WHO: "Кого отпускают за выкуп"
 MBQ_RS_DUNGEON: "Заключённые в [Concept( 'dungeon', 'подземелье' )|E]"
 MBQ_RS_HOUSE: "Заключённые под [Concept( 'house_arrest', 'домашним арестом' )|E]"
 MBQ_RS_TT_DUNGEON: "#T Подземелье#!\n• Отмечено: учитываются заключённые вашего подземелья"
 MBQ_RS_TT_HOUSE: "#T Домашний арест#!\n• Отмечено: учитываются заключённые под домашним арестом"
 MBQ_RS_RANK: "Выкуп до ранга (включительно)"
 MBQ_RS_T0: "Без титула"
 MBQ_RS_T1: "Барон"
 MBQ_RS_T2: "Граф"
 MBQ_RS_T3: "Герцог"
 MBQ_RS_T4: "Король"
 MBQ_RS_TT_RANK: "#T Выкуп до ранга#!\n• Выкупаются узники до выбранного ранга, ниже и без титула тоже\n• Считается высший титул узника, императоры никогда"
 MBQ_RS_TT_T1: "#T Барон#!\n• Выкупаются заключённые без титула и бароны\n• [Concept( 'baron', 'Барон' )|E] это правитель, чей высший титул [Concept( 'barony', 'баронство' )|E]"
 MBQ_RS_AUTO: "Автоматизация включена"
 MBQ_RS_TT_AUTO: "#T Автоматизация#!\n• Освобождает узников по сроку, только вас"
 MBQ_RS_MONTHLY: "каждый месяц"
 MBQ_RS_QUARTERLY: "раз в три месяца"
 MBQ_RS_TT_TAKT: "#T Интервал#!\n• Как часто автоматика проверяет ваших заключённых\n• Изменение действует сразу: следующая проверка через один интервал, считая с сегодняшнего дня"
 MBQ_RS_PREVIEW: "Выкуп: [GetPlayer.MakeScope.Var('mbq_rs_prev_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_rs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_RS_PRISONER_1', 'MBQ_RS_PRISONER_N' )] за @gold_icon! [GetPlayer.MakeScope.Var('mbq_rs_prev_gold').GetValue|0]"
 MBQ_RS_RUN: "Выполнить сейчас"
 MBQ_RS_TT_RUN: "#T Выполнить сейчас#!\n• Один раз предлагает выкуп за каждого подходящего заключённого, чей плательщик согласен"
 mbq_rs_sum_title: "Заключённые выкуплены"
 mbq_rs_sum_desc: "Освобождено заключённых: [ROOT.Var('mbq_rs_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_rs_n').GetValue, '(CFixedPoint)1' ), 'MBQ_RS_PRISONER_1', 'MBQ_RS_PRISONER_N' )], всего @gold_icon! [ROOT.Var('mbq_rs_sum').GetValue|0][ROOT.Char.Custom('mbq_rs_s1')][ROOT.Char.Custom('mbq_rs_s2')][ROOT.Char.Custom('mbq_rs_s3')][ROOT.Char.Custom('mbq_rs_s4')][ROOT.Char.Custom('mbq_rs_s5')][ROOT.Char.Custom('mbq_rs_more')]"
 mbq_rs_empty: ""
 mbq_rs_more_line: "\nи ещё [ROOT.Var('mbq_rs_rest').GetValue|0]"
 mbq_rs_none_line: "\nНикто не подошёл, или ни один плательщик не согласился."
 message_filter_mbq_ransom_summary: "Заключённые выкуплены (Better Quality of Life)"
 message_filter_mbq_ransom_summary_desc: "Итог предложений выкупа, сделанных за вас модом Better Quality of Life."
 mbq_rs_line1_gold: "\n[ROOT.Var('mbq_rs_c1').Char.GetShortUIName][ROOT.Var('mbq_rs_c1').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g1').GetValue|0]"
 mbq_rs_line1_hook: "\n[ROOT.Var('mbq_rs_c1').Char.GetShortUIName][ROOT.Var('mbq_rs_c1').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line2_gold: "\n[ROOT.Var('mbq_rs_c2').Char.GetShortUIName][ROOT.Var('mbq_rs_c2').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g2').GetValue|0]"
 mbq_rs_line2_hook: "\n[ROOT.Var('mbq_rs_c2').Char.GetShortUIName][ROOT.Var('mbq_rs_c2').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line3_gold: "\n[ROOT.Var('mbq_rs_c3').Char.GetShortUIName][ROOT.Var('mbq_rs_c3').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g3').GetValue|0]"
 mbq_rs_line3_hook: "\n[ROOT.Var('mbq_rs_c3').Char.GetShortUIName][ROOT.Var('mbq_rs_c3').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line4_gold: "\n[ROOT.Var('mbq_rs_c4').Char.GetShortUIName][ROOT.Var('mbq_rs_c4').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g4').GetValue|0]"
 mbq_rs_line4_hook: "\n[ROOT.Var('mbq_rs_c4').Char.GetShortUIName][ROOT.Var('mbq_rs_c4').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 mbq_rs_line5_gold: "\n[ROOT.Var('mbq_rs_c5').Char.GetShortUIName][ROOT.Var('mbq_rs_c5').Char.Custom('GetPrimaryTitleTierIcon')]: @gold_icon! [ROOT.Var('mbq_rs_g5').GetValue|0]"
 mbq_rs_line5_hook: "\n[ROOT.Var('mbq_rs_c5').Char.GetShortUIName][ROOT.Var('mbq_rs_c5').Char.Custom('GetPrimaryTitleTierIcon')]: [favor|E]"
 MBQ_RS_MIN_HEAD: "Минимальный выкуп"
 MBQ_RS_MIN_100: "Полная цена"
 MBQ_RS_MIN_STAFFEL: "Время в тюрьме"
 MBQ_RS_TT_MIN: "#T Выкуп#!\n• Сразу: хватит любого настоящего @gold_icon! золота. Полная цена: весь выкуп\n• По сроку заключения: чем дольше ждёт узник, тем меньше хватит"
 MBQ_RS_EXCL_HEAD: "Эти остаются в заключении"
 MBQ_RS_TT_EXCL: "#T Эти остаются в заключении#!\n• Таких узников автоматизация никогда не освобождает\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_NOTE_EXEMPT: "• Исключения, заданные для массовых действий на вкладке тюрьмы, здесь не действуют; используйте исключения в этом окне"
 MBQ_RS_EX_WAR: "@war_icon! Враги по войне"
 MBQ_RS_EX_CLAIM: "Претензии на ваши титулы"
 MBQ_RS_EX_RIVAL: "@rival_icon! Соперники и заклятые"
 MBQ_RS_EX_DYN: "@dynasty_icon! Ваша династия"
 MBQ_RS_TT_EX_WAR: "#T Враги по войне#!\n• Узник, платящий за него сюзерен или владелец титула, который он наследует, в [Concept('war','войне')|E] с вами"
 MBQ_RS_TT_EX_CLAIM: "#T Претензии на ваши титулы#!\n• У заключённого есть [Concept( 'claim', 'претензия' )|E] на один из ваших титулов ранга [Concept( 'duchy', 'герцогства' )|E] или выше\n• Или на ваш [Concept( 'primary_title', 'первый титул' )|E], независимо от ранга"
 MBQ_RS_TT_EX_RIVAL: "#T Соперники и заклятые враги#!\n• Заключённый является вашим [Concept( 'rival', 'соперником' )|E] или [Concept( 'nemesis', 'заклятым врагом' )|E]"
 MBQ_RS_TT_EX_DYN: "#T Ваша собственная династия#!\n• Заключённый принадлежит к вашей [Concept( 'dynasty', 'династии' )|E], а это большая часть вашей близкой семьи"
 MBQ_RS_TT_AUTO_X: "$MBQ_RS_TT_AUTO$\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_TT_RUN_X: "$MBQ_RS_TT_RUN$\n$MBQ_RS_NOTE_EXEMPT$"
 MBQ_RS_TT_AUTO_BLOCKED: "#T Автоматизация#!\n• #N Приостановлена:#! не выбран уровень минимального выкупа\n• Отметьте один уровень в разделе «Минимальный выкуп»"
 MBQ_RS_TT_RUN_BLOCKED: "#T Выполнить сейчас#!\n• #N Заблокировано:#! не выбран уровень минимального выкупа\n• Отметьте один уровень в разделе «Минимальный выкуп»"
 MBQ_CAT_GENERAL: "Конфессия и обращение"
 MBQ_CAT_PRISON: "Тюрьма и выкуп"
 MBQ_CAT_VASSALS: "Вассалы и дань: автоматизация"
 MBQ_CAT_COUNTIES: "Даровать титулы"
 MBQ_RS_TAKT: "Срок"
 MBQ_RS_TT_RED: "#T Неверный выбор#!\n• Отметьте хотя бы один флажок в этой группе\n• До этого автоматизация приостановлена, а «Выполнить сейчас» остаётся серой"
 MBQ_RS_MIN_NOW: "сразу"
 MBQ_RS_EX_FACTION: "Лидеры фракций, мятежей"
 MBQ_RS_EX_HOOK: "Узники у вас на крючке"
 MBQ_RS_TT_EX_FACTION: "#T Лидеры фракций#!\n• Отмечено: лидеры любой [Concept( 'faction', 'фракции' )|E] против вас никогда не отпускаются за выкуп, включая крестьянские восстания и фракции независимости"
 MBQ_RS_TT_EX_HOOK: "#T Влияние#!\n• Отмечено: заключённые, на которых у вас есть [Concept( 'hook', 'влияние' )|E], никогда не отпускаются за выкуп, включая слабое влияние"
 MBQ_RS_RED_LEGEND: "Красным отмечено: автоматизация так не работает."
 MBQ_RS_EXC_ALL: "Все"
 MBQ_RS_EXC_RESET: "Нет"
 MBQ_RS_TT_MIN_NOW: "#T Сразу#!\n• Достаточно любого настоящего золота\n• Плательщик, который не предлагает золото, а только влияние или что-то подобное, никогда не принимается"
 MBQ_RS_TT_MIN_100: "#T Полная цена#!\n• Плательщик должен заплатить весь выкуп\n• Плательщик, который не предлагает золото, а только влияние или что-то подобное, никогда не принимается"
 MBQ_RS_TT_MIN_STAFFEL: "#T По сроку заключения#!\n• Чем дольше срок, тем меньше @gold_icon! выкупа хватит\n• После долгого срока хватит любого золота"
 MBQ_RS_PRISONER_1: "заключённый"
 MBQ_RS_PRISONER_N: "заключённых"
 MBQ_RS_EX_VASSAL: "@vassal_icon! Ваши вассалы"
 MBQ_RS_EX_SUBVASSAL: "@vassal_icon! Непрямые вассалы"
 MBQ_RS_TT_EX_VASSAL: "#T Ваши вассалы#!\n• Отмечено: ваши прямые [Concept( 'vassals', 'вассалы' )|E] никогда не отпускаются за выкуп"
 MBQ_RS_TT_EX_SUBVASSAL: "#T Непрямые вассалы#!\n• Отмечено: вассалы ваших вассалов никогда не отпускаются за выкуп\n• Они ниже вас в вашем государстве, но не ваши прямые [Concept( 'vassals', 'вассалы' )|E]"
 MBQ_RS_NOBODY: "Никто"
 MBQ_RS_TT_NOBODY: "#T Никто#!\n• Ни один заключённый не выкупается\n• Автоматизация приостанавливается, а «Выполнить сейчас» остаётся серой"
 MBQ_RS_TT_T0: "#T Без титула#!\n• Выкупаются только заключённые без земельного титула\n• Учитывается высший титул заключённого"
 MBQ_RS_TT_T2: "#T Граф#!\n• Выкупаются заключённые без титула, бароны и графы\n• Учитывается высший титул заключённого"
 MBQ_RS_TT_T3: "#T Герцог#!\n• Выкупаются заключённые вплоть до герцогов\n• Учитывается высший титул заключённого"
 MBQ_RS_TT_T4: "#T Король#!\n• Выкупаются узники до королей, императоры никогда\n• Считается высший титул узника"
