l_german:
 MBQ_CP_AGE_TT: "Alter"
 MBQ_CP_BTN_TT: "#T Standard-Automatisierung#!\nBeim Freimachen, für alle Ämter (freie, sobald das Hofämter-Fenster offen ist):\n[Select_CString( GetGlobalVariable( 'mbq_cp_lvl_0' ).IsSet, '@check_icon!', '@small_dot!' )] $MBQ_CP_LVL_0$\n[Select_CString( GetGlobalVariable( 'mbq_cp_lvl_1' ).IsSet, '@check_icon!', '@small_dot!' )] $MBQ_CP_LVL_1$\n[Select_CString( GetGlobalVariable( 'mbq_cp_lvl_2' ).IsSet, '@check_icon!', '@small_dot!' )] $MBQ_CP_LVL_2$\n[Select_CString( GetGlobalVariable( 'mbq_cp_lvl_3' ).IsSet, '@check_icon!', '@small_dot!' )] $MBQ_CP_LVL_3$\n[Select_CString( And( Not( GetGlobalVariable( 'mbq_cp_lvl_0' ).IsSet ), And( Not( GetGlobalVariable( 'mbq_cp_lvl_1' ).IsSet ), And( Not( GetGlobalVariable( 'mbq_cp_lvl_2' ).IsSet ), Not( GetGlobalVariable( 'mbq_cp_lvl_3' ).IsSet ) ) ) ), '@check_icon!', '@small_dot!' )] $MBQ_CP_LVL_OFF$\n#I Klick: nächste Stufe#!"
 MBQ_CP_LVL_0: "Keine Automatisierung"
 MBQ_CP_LVL_1: "Besten Kandidaten für Ereignis vorschlagen"
 MBQ_CP_LVL_2: "Kandidaten mit höchster [aptitude|e] automatisch vorschlagen, wenn verfügbar"
 MBQ_CP_LVL_3: "Kandidaten mit höchster [aptitude|e] automatisch vorschlagen oder mit Ereignis hinweisen"
 MBQ_CP_LVL_OFF: "Aus (Ämter einzeln): jedes Amt behält seine eigene Einstellung"
