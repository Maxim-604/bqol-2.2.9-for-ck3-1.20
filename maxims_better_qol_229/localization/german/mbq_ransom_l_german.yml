 MBQ_RS_TT_MIN_100: "#T Voller Preis#!\n• Der Zahler muss das ganze Lösegeld zahlen\n• Bietet der Zahler kein Gold, nur einen Haken oder Ähnliches, wird nicht freigekauft"
 MBQ_RS_TT_MIN_STAFFEL: "#T Gestaffelt nach Haftdauer#!\n• Je länger ein Gefangener in Haft ist, desto weniger @gold_icon! Lösegeld genügt\n• Nach sehr langer Haft genügt jedes echte Gold"
 MBQ_RS_MIN_NOW: "sofort"
 MBQ_RS_EX_FACTION: "Fraktionsführer (auch Aufstände)"
 MBQ_RS_EX_HOOK: "Haken auf den Gefangenen"
 MBQ_RS_TT_EX_FACTION: "#T Fraktionsführer#!\n• Haken an: Anführer jeder [faction|E] gegen Euch werden nie verkauft, auch Bauernaufstände und Unabhängigkeit"
 MBQ_RS_TT_EX_HOOK: "#T Haken#!\n• Haken an: Gefangene, auf die Ihr ein [hook|E] habt, werden nie verkauft, auch schwache Haken"
 MBQ_RS_RED_LEGEND: "Rot markiert: die Automatik läuft so nicht."
 MBQ_RS_PRISONER_1: "Gefangener"
 MBQ_RS_PRISONER_N: "Gefangene"
 MBQ_RS_EXC_ALL: "Alle"
 MBQ_RS_EXC_RESET: "Keine"
