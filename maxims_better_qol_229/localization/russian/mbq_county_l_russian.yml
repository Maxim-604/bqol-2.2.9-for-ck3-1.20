 MBQ_GR_OT_OPT_7: "Группа: хорошие черты вассала:\n• [GetTrait('content').GetName( GetNullCharacter )]\n• [GetTrait('trusting').GetName( GetNullCharacter )]\n• [GetTrait('loyal').GetName( GetNullCharacter )]\n• [GetTrait('humble').GetName( GetNullCharacter )]\n• [GetTrait('patient').GetName( GetNullCharacter )]\nНеобходимо: группы по порядку, титул получает только тот, кто входит в группу."
