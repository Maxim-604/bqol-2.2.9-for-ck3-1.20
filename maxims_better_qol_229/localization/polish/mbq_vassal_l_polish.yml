 MBQ_VS_ACC_VS: "Przyjmuj oferty lojalności"
 MBQ_VS_TT_ACC_VS: "#T Przyjmuj oferty lojalności#!\n• Przyjmuje od razu ofertę władcy, który chce złożyć ci przysięgę lojalności, jakbyś sam kliknął Przyjmij\n• Tylko oferty na poziomie twojej minimalnej umowy lub wyższym i w wybranej randze"
 MBQ_VS_ACC_TB: "Przyjmuj oferty trybutu"
 MBQ_VS_TT_ACC_TB: "#T Przyjmuj oferty trybutu#!\n• Przyjmuje od razu ofertę władcy, który chce zostać twoim [Concept( 'tributary', 'trybutariuszem' )|E], jakbyś sam kliknął Przyjmij\n• Tylko oferty na poziomie twojej minimalnej umowy lub wyższym i w wybranej randze"
 MBQ_VS_ACC_FROM: "Od"
 MBQ_VS_TT_ACC_NOMADS: "#T Dla koczowników#!\n• Zaznaczone: oferty od [nomad_i|E] [Concept( 'nomads', 'koczowników' )|E] i innych władców stad są przyjmowane automatycznie"
 MBQ_VS_TT_ACC_ALL: "#T Wszyscy pozostali#!\n• Zaznaczone: oferty od wszystkich władców bez stad są przyjmowane automatycznie\n• Wszyscy oprócz państw koczowników i pasterzy, które mają własne pole"
 mbq_fealty_auto_accepted_toast: "Oferta lojalności przyjęta automatycznie"
 MBQ_VS_TB_SILENT: "Wycisz wiadomości"
 MBQ_VS_TT_TB_SILENT: "#T Wycisz wiadomości#!\n• Oferty dla ciebie przychodzą bez okien ofert\n• Automatyzacja przyjmuje to, co pasuje do twoich zaznaczeń, resztę odrzuca; wiadomości są tylko w rejestrze"
