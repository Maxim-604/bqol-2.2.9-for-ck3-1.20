l_japanese:
 MBQ_VS_AUTO_HEAD: "自動化"
 MBQ_VS_TT_AUTO_HEAD: "#T 自動化#!\n• 申し出と要求は、承諾する統治者にだけ送られる\n• あなたへの申し出は、下の選択どおりに承諾される"
 MBQ_VS_AUTO_VS: "@vassal_icon! 主従関係の提案"
 MBQ_VS_AUTO_TB: "@tributary_icon! 諸侯の要求"
 MBQ_VS_TT_AUTO_VS: "#T 主従関係の提案#!\n• 承諾する該当の統治者全員に、あなたに最良の契約で提案する\n• [vassal_limit|E]に空きがある間のみ"
 MBQ_VS_TT_AUTO_TB: "#T 貢ぎ物の要求#!\n• 承諾する該当の隣国全員に、通常の行動と同様に貢ぎ物を要求する\n• #warning @prestige_icon! 通常の行動と同様に[prestige|E]を消費#!"
 MBQ_VS_TT_MIN_HEAD: "#T 契約#!\n• 主従関係の提案、忠誠の申し出と貢納の申し出の承諾に使う\n• 諸侯の要求には使わない"
 MBQ_VS_MIN_HIGH: "高"
 MBQ_VS_MIN_NORMAL: "通常"
 MBQ_VS_MIN_LOW: "低"
 MBQ_VS_TT_MIN_HIGH: "#T 高#!\n• 高い[obligations|E]のみ\n• あなたへの申し出：高いものだけ自動で承諾"
 MBQ_VS_TT_MIN_NORMAL: "#T 通常#!\n• まず高、次に通常の[obligations|E]\n• あなたへの申し出：高いものと通常のものを自動で承諾"
 MBQ_VS_TT_MIN_LOW: "#T 低#!\n• まず高、次に通常、最後に低い[obligations|E]\n• あなたへの申し出：すべての申し出を自動で承諾"
 MBQ_VS_WHO: "主従関係を提案する相手："
 MBQ_VS_TT_WHO: "#T 打診する相手#!\n• 主従関係の提案にのみ適用\n• 諸侯の要求は常に独立した隣国が対象"
 MBQ_VS_NB: "独立した隣国"
 MBQ_VS_TRIB: "あなたの諸侯"
 MBQ_VS_TT_NB: "#T 独立した隣国#!\n• チェック時：あなたの[realm|E]に隣接する独立した統治者に打診する（海を挟んでも対象）"
 MBQ_VS_TT_TRIB: "#T あなたの諸侯#!\n• チェック時：あなた自身の諸侯にも打診する"
 MBQ_VS_RANK: "ランクの上限（そのランクを含む）"
 MBQ_VS_TT_RANK: "#T ランクの上限#!\n• このランクまでの統治者に打診し、その申し出は自動で承諾される\n• 皇帝には決して打診しない"
 MBQ_VS_EXCL_HEAD: "除外する統治者"
 MBQ_VS_TT_EXCL: "#T 例外#!\n• チェック時：自動化はこのような統治者に打診せず、その申し出も承諾しない\n• その申し出はいつも通り届く"
 MBQ_VS_EX_RIVAL: "好敵手と宿敵"
 MBQ_VS_EX_CLAIM: "あなたの称号への請求権"
 MBQ_VS_EX_FAITH: "@religious_icon! 別の宗派"
 MBQ_VS_EX_FACTION: "@faction_icon! 派閥の指導者"
 MBQ_VS_TT_EX_RIVAL: "#T 好敵手と宿敵#!\n• 統治者があなたの[rival|E]または[nemesis|E]"
 MBQ_VS_TT_EX_CLAIM: "#T あなたの称号への請求権#!\n• 統治者が、伯爵位以上のあなたの称号に[claim|E]を持つ"
 MBQ_VS_TT_EX_FAITH: "#T 別の宗派#!\n• 統治者があなたと異なる[faith|E]を信仰している"
 MBQ_VS_TT_EX_FACTION: "#T 派閥の指導者#!\n• 統治者があなたに敵対する[faction|E]を率いている"
 MBQ_VS_PREVIEW: "今すぐ主従関係：[GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue|0][SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )]、@vassal_icon! [GetPlayer.GetNumVassalsTowardsLimit]/[GetPlayer.GetVassalLimit]"
 MBQ_TB_PREVIEW: "今すぐ貢納：最大[GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue|0][SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )]"
 MBQ_TBO_HEAD: "諸侯契約の希望"
 MBQ_TBO_TT_HEAD: "#T 諸侯契約の希望#!\n• このウィンドウから生まれる新しい[tributary|E]すべてに、承諾の直後にこの希望を適用する\n• #warning @prestige_icon! 変更がある場合のみ、諸侯1人につき[prestige|E]150を1回消費、[opinion|E]は本人に-30、他の諸侯に-10#!"
 MBQ_TBO_NO_GUAR: "相手の戦争に参加する義務なし"
 MBQ_TBO_TT_NO_GUAR: "#T 戦争参加の義務なし#!\n• ゲームが許す範囲で、自動化が相手の戦争に参加するあなたの義務を減らす"
 MBQ_TBO_TAX: "高い税"
 MBQ_TBO_TT_TAX: "#T 高い税#!\n• 開始時より[taxes|E]が1段階多い（ゲームが許す場合のみ）"
 MBQ_TBO_PRESTIGE: "威信を多く"
 MBQ_TBO_TT_PRESTIGE: "#T 威信を多く#!\n• 開始時より[prestige|E]の移転が1段階多い（ゲームが許す場合のみ）"
 MBQ_TBO_WAR: "あなたの戦争を支援"
 MBQ_TBO_TT_WAR: "#T あなたの戦争を支援#!\n• 新しい諸侯はあなたの戦争に参加しなければならない（ゲームが許す場合のみ）"
 MBQ_VS_RULER_1: "人の統治者"
 MBQ_VS_RULER_N: "人の統治者"
 MBQ_VS_TT_RUN: "#T 今すぐ実行#!\n• 条件に合い、承諾してくれる統治者全員に1回だけ主従関係を提案する\n• グレー：提案する相手がいない"
 MBQ_TB_TT_RUN: "#T 今すぐ実行#!\n• 条件に合い、承諾してくれる隣国全員に1回だけ貢納を要求する\n• グレー：要求する相手がいない"
 MBQ_VS_MANDALA: "マンダラの統治者：申し出と要求は停止中。"
 mbq_vs_sum_title: "新しい封臣"
 mbq_vs_sum_desc: "主従関係を承諾：[ROOT.Var('mbq_vs_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_vs_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )][ROOT.Char.Custom('mbq_vs_s1')][ROOT.Char.Custom('mbq_vs_s2')][ROOT.Char.Custom('mbq_vs_s3')][ROOT.Char.Custom('mbq_vs_s4')][ROOT.Char.Custom('mbq_vs_s5')][ROOT.Char.Custom('mbq_vs_more')]"
 mbq_vs_more_line: "\n他[ROOT.Var('mbq_vs_rest').GetValue|0]人"
 mbq_vs_none_line: "\n該当者がいなかったか、誰も承諾しなかった。"
 MBQ_TB_TT_OFF: "#T 貢納の要求#!\n• 平時に貢納を要求できるのは、[nomads|E]、[steppe_admin|E]の統治者、[celestial|E]の[hegemons|E]だけ\n• [mandala|E]の統治者は代わりに[tributaries|E]を受け入れる"
 mbq_tb_sum_title: "新しい諸侯"
 mbq_tb_sum_desc: "あなたの諸侯になった：[ROOT.Var('mbq_tb_n').GetValue|0] [SelectLocalization( EqualTo_CFixedPoint( ROOT.Var('mbq_tb_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )][ROOT.Char.Custom('mbq_tb_s1')][ROOT.Char.Custom('mbq_tb_s2')][ROOT.Char.Custom('mbq_tb_s3')][ROOT.Char.Custom('mbq_tb_s4')][ROOT.Char.Custom('mbq_tb_s5')][ROOT.Char.Custom('mbq_tb_more')]"
 mbq_tb_more_line: "\n他[ROOT.Var('mbq_tb_rest').GetValue|0]人"
 mbq_tb_none_line: "\n該当者がいなかったか、誰も承諾しなかった。"
 message_filter_mbq_vassal_summary: "新しい封臣と諸侯（Better Quality of Life）"
 message_filter_mbq_vassal_summary_desc: "Better Quality of Lifeがあなたの代わりに行った主従関係の提案と貢納の要求のまとめ。"
 mbq_vs_line1: "\n[ROOT.Var('mbq_vs_c1').Char.GetShortUIName][ROOT.Var('mbq_vs_c1').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_vs_line2: "\n[ROOT.Var('mbq_vs_c2').Char.GetShortUIName][ROOT.Var('mbq_vs_c2').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_vs_line3: "\n[ROOT.Var('mbq_vs_c3').Char.GetShortUIName][ROOT.Var('mbq_vs_c3').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_vs_line4: "\n[ROOT.Var('mbq_vs_c4').Char.GetShortUIName][ROOT.Var('mbq_vs_c4').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_vs_line5: "\n[ROOT.Var('mbq_vs_c5').Char.GetShortUIName][ROOT.Var('mbq_vs_c5').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line1: "\n[ROOT.Var('mbq_tb_c1').Char.GetShortUIName][ROOT.Var('mbq_tb_c1').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line2: "\n[ROOT.Var('mbq_tb_c2').Char.GetShortUIName][ROOT.Var('mbq_tb_c2').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line3: "\n[ROOT.Var('mbq_tb_c3').Char.GetShortUIName][ROOT.Var('mbq_tb_c3').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line4: "\n[ROOT.Var('mbq_tb_c4').Char.GetShortUIName][ROOT.Var('mbq_tb_c4').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tb_line5: "\n[ROOT.Var('mbq_tb_c5').Char.GetShortUIName][ROOT.Var('mbq_tb_c5').Char.Custom('GetPrimaryTitleTierIcon')]"
 MBQ_VS_ACC_VS: "忠誠の申し出を承諾"
 MBQ_VS_TT_ACC_VS: "#T 忠誠の申し出を承諾#!\n• 統治者があなたに忠誠を誓う申し出を、自分で承諾をクリックしたのと同じようにすぐ承諾する\n• 最低限の契約以上で、選んだランク内の申し出のみ"
 MBQ_VS_ACC_TB: "貢納の申し出を承諾"
 MBQ_VS_TT_ACC_TB: "#T 貢納の申し出を承諾#!\n• 統治者があなたの[tributary|E]になる申し出を、自分で承諾をクリックしたのと同じようにすぐ承諾する\n• 最低限の契約以上で、選んだランク内の申し出のみ"
 MBQ_VS_ACC_FROM: "対象"
 MBQ_VS_TT_ACC_NOMADS: "#T 遊牧民向け#!\n• チェック時：[nomad_i|E] [nomads|E]や、ほかの牧畜の統治者からの申し出を自動で承諾する"
 MBQ_VS_TT_ACC_ALL: "#T それ以外すべて#!\n• チェック時：牧畜でないすべての統治者からの申し出を自動で承諾する\n• [nomads|E]と[herder|E]の国を除く全員。それらには専用のチェック欄がある"
 mbq_fealty_auto_accepted_toast: "忠誠の申し出を自動で承諾しました"
 MBQ_VS_TB_SILENT: "メッセージをミュート"
 MBQ_VS_TT_TB_SILENT: "#T メッセージをミュート#!\n• あなたへの申し出は申し出ウィンドウなしで届く\n• 自動化はチェックに合う申し出を承諾し、残りは断る。メッセージはログにだけ残る"
 mbq_acc_last_desc: "[ROOT.Var('mbq_acc_last').Char.GetShortUIName][ROOT.Var('mbq_acc_last').Char.Custom('GetPrimaryTitleTierIcon')]"
 mbq_tributary_hegemon_offer: "諸侯の申し出を受領"
 MBQ_TBO_COST: "変更ごとに諸侯1人につき @prestige_icon! [prestige|E]150"
 MBQ_VS_MASTER: "自動化：封臣と貢納"
 MBQ_VS_TT_MASTER: "#T 自動化：封臣と貢納#!"
