 MBQ_RS_TT_EX_SUBVASSAL: "#T Indirekte Vasallen#!\n• Haken an: Vasallen Eurer Vasallen werden nie verkauft\n• Sie stehen unter Euch im Reich, sind aber nicht Eure direkten [vassals|E]"
 MBQ_RS_NOBODY: "Niemand"
