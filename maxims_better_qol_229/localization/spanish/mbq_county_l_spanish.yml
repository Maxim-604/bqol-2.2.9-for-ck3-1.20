l_spanish:
 MBQ_GR_AUTO_HEAD: "Automatización: ceder lo que exceda tus límites"
 MBQ_GR_TT_AUTO_HEAD: "#T Automatización#!\n• Un título nuevo que exceda tus límites va de inmediato al receptor que eligen tus preferencias\n• Tu [capital|lE] nunca se cede"
