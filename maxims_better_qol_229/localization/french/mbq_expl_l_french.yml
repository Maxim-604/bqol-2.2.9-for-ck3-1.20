 MBQ_EXPL_Q:0 "?"
 MBQ_EXPL_TT:0 "#T Explication#!\n• Montre l’effet des réglages d’Accorder des titres\n• Cliquez à nouveau pour la masquer"
 MBQ_EXPL_TITLE:0 "Comment fonctionne Accorder des titres"
 MBQ_EXPL_H_AUTO:0 "@domain_icon! Automatisation"
 MBQ_EXPL_B_AUTO:0 "Au-delà de votre [domain_limit|El], le mod cède les @county_icon! [counties|El] en trop à d’autres, tout seul ou avec Lancer maintenant. Votre [capital|El] et les titres marqués Précieux restent à vous."
 MBQ_EXPL_H_WHO:0 "@vassal_icon! Bénéficiaires"
 MBQ_EXPL_B_WHO:0 "Les titres vont à vos [vassals|El] directs, vos [courtiers|El] et votre famille, jamais à votre [primary_heir|El], à vos rivaux ou ennemis jurés."
 MBQ_EXPL_H_FILTERS:0 "Filtres"
 MBQ_EXPL_B_FILTERS:0 "Les filtres décident qui peut recevoir un titre : [religion|El], [culture|El] et âge. Les vassaux aux mauvais traits sont ignorés. Aucun candidat : vous gardez le titre. Avec Nouveau noble sinon, un nouveau noble de votre culture le reçoit."
 MBQ_EXPL_H_PRIOS:0 "Préférences"
 MBQ_EXPL_B_PRIOS:0 "#clickable Beige#! : Obligatoire. Qui ne correspond à aucune de celles choisies est écarté.\n#color_light_blue Bleu clair#! : trie seulement. Personne n’est écarté.\nEnsuite la préférence 1 compte d’abord. Si deux sont à égalité, la préférence 2 décide, puis la 3, et ainsi de suite."
 MBQ_EXPL_H_CAPS:0 "@county_icon! Limites par bénéficiaire"
 MBQ_EXPL_B_CAPS:0 "Un vassal ne reçoit pas plus de comtés que la limite n’autorise."
