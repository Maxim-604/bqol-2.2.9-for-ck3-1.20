 MBQ_EXPL_B_WHO:0 "Los títulos van a tus [vassals|lE] directos, [courtiers|lE] y familia, nunca a tu [primary_heir|lE], rivales ni némesis."
 MBQ_EXPL_H_FILTERS:0 "Filtros"
 MBQ_EXPL_B_FILTERS:0 "Los filtros deciden quién puede recibir un título: [religion|lE], [culture|lE] y edad. Se omite a los vasallos con rasgos malos. Si nadie vale, conservas el título; con Noble nuevo si nadie vale, lo recibe un noble nuevo de tu [culture|lE]."
 MBQ_EXPL_H_PRIOS:0 "Preferencias"
 MBQ_EXPL_B_PRIOS:0 "#clickable Beige#!: Debe. Quien no cumple ninguna de las elegidas queda fuera.\n#color_light_blue Azul claro#!: solo ordena. Nadie queda fuera.\nLuego cuenta primero la prioridad 1. Si dos empatan, decide la prioridad 2, luego la 3 y así sucesivamente."
 MBQ_EXPL_H_CAPS:0 "@county_icon! Límites por destinatario"
