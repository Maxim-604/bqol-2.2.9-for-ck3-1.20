l_polish:
 MBQ_VS_AUTO_HEAD: "Automatyzacja"
 MBQ_VS_TT_AUTO_HEAD: "#T Automat#!\n• Oferty i żądania idą tylko do zgodnych władców\n• Oferty dla ciebie są przyjmowane według wyboru poniżej"
 MBQ_VS_AUTO_VS: "@vassal_icon! Zaoferuj wasalstwo"
 MBQ_VS_AUTO_TB: "@tributary_icon! Zażądaj zostania trybutariuszem"
 MBQ_VS_TT_AUTO_VS: "#T Zaoferuj wasalstwo#!\n• Oferuje wasalstwo każdemu pasującemu władcy, który się zgodzi, z najlepszą dla ciebie umową\n• Tylko gdy masz miejsce pod [Concept( 'vassal_limit', 'limitem wasali' )|E]"
 MBQ_VS_TT_AUTO_TB: "#T Żądaj trybutu#!\n• Żąda trybutu od każdego pasującego sąsiada, który się zgodzi, jak zwykła interakcja\n• #warning @prestige_icon! Kosztuje [Concept( 'prestige', 'prestiżu' )|E] jak zwykła interakcja#!"
 MBQ_VS_TT_MIN_HEAD: "#T Kontrakt#!\n• Używany przy oferowaniu wasalstwa oraz przyjmowaniu ofert lojalności i trybutu\n• Nieużywany przy żądaniu trybutu"
 MBQ_VS_MIN_HIGH: "Wysokie"
 MBQ_VS_MIN_NORMAL: "Normalne"
 MBQ_VS_MIN_LOW: "Niskie"
 MBQ_VS_TT_MIN_HIGH: "#T Wysokie#!\n• Tylko wysokie [Concept( 'obligations', 'zobowiązania' )|E]\n• Oferty składane tobie: automatycznie przyjmowane są tylko wysokie"
 MBQ_VS_TT_MIN_NORMAL: "#T Normalne#!\n• Najpierw wysokie, potem normalne [Concept( 'obligations', 'zobowiązania' )|E]\n• Oferty składane tobie: wysokie i normalne są przyjmowane automatycznie"
 MBQ_VS_TT_MIN_LOW: "#T Niskie#!\n• Najpierw wysokie, potem normalne, potem niskie [Concept( 'obligations', 'zobowiązania' )|E]\n• Oferty składane tobie: każda oferta jest przyjmowana automatycznie"
 MBQ_VS_WHO: "Oferuj wasalstwo:"
 MBQ_VS_TT_WHO: "#T Kogo pytać#!\n• Dotyczy tylko wasalstwa\n• Żądanie trybutu zawsze kierowane jest do niezależnych sąsiadów"
 MBQ_VS_NB: "Niezależni sąsiedzi"
 MBQ_VS_TRIB: "Twoi trybutariusze"
 MBQ_VS_TT_NB: "#T Niezależni sąsiedzi#!\n• Zaznaczone: pytani są niezależni władcy obok twojego [Concept( 'realm', 'państwa' )|E], także po drugiej stronie wody"
 MBQ_VS_TT_TRIB: "#T Twoi trybutariusze#!\n• Zaznaczone: pytani są też twoi własni trybutariusze"
 MBQ_VS_RANK: "Do rangi (włącznie)"
 MBQ_VS_TT_RANK: "#T Do rangi#!\n• Pytani są władcy do tej rangi włącznie, a ich oferty są przyjmowane automatycznie\n• Cesarze nigdy nie są pytani"
 MBQ_VS_EXCL_HEAD: "Pomiń tych władców"
 MBQ_VS_TT_EXCL: "#T Wyjątki#!\n• Zaznaczone: automatyzacja nigdy nie pyta takich władców i nigdy nie przyjmuje ich ofert\n• Ich oferty przychodzą jak zwykle"
 MBQ_VS_EX_RIVAL: "Rywale i śmiertelni wrogowie"
 MBQ_VS_EX_CLAIM: "Roszczenia do twoich tytułów"
 MBQ_VS_EX_FAITH: "@religious_icon! Inna wiara"
 MBQ_VS_EX_FACTION: "@faction_icon! Przywódcy frakcji"
 MBQ_VS_TT_EX_RIVAL: "#T Rywale i śmiertelni wrogowie#!\n• Władca jest twoim [Concept( 'rival', 'rywalem' )|E] albo twoim [Concept( 'nemesis', 'śmiertelnym wrogiem' )|E]"
 MBQ_VS_TT_EX_CLAIM: "#T Roszczenia do twoich tytułów#!\n• Władca ma [Concept( 'claim', 'roszczenie' )|E] do jednego z twoich tytułów rangi hrabstwa lub wyższej"
 MBQ_VS_TT_EX_FAITH: "#T Inna wiara#!\n• Władca wyznaje inną [Concept( 'faith', 'wiarę' )|E] niż ty"
 MBQ_VS_TT_EX_FACTION: "#T Przywódcy frakcji#!\n• Władca przewodzi [Concept( 'faction', 'frakcji' )|E] przeciwko tobie"
 MBQ_VS_PREVIEW: "Wasalstwo teraz: liczba władców [GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue|0], @vassal_icon! [GetPlayer.GetNumVassalsTowardsLimit]/[GetPlayer.GetVassalLimit]"
 MBQ_TB_PREVIEW: "Trybut teraz: liczba władców do [GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue|0]"
 MBQ_TBO_HEAD: "Życzenia do umowy trybutu"
 MBQ_TBO_TT_HEAD: "#T Życzenia do umowy trybutu#!\n• Dla każdego nowego [Concept( 'tributary', 'trybutariusza' )|E] z tego okna te życzenia działają zaraz po przyjęciu\n• #warning @prestige_icon! Kosztuje raz 150 [Concept( 'prestige', 'prestiżu' )|E] za trybutariusza, [Concept( 'opinion', 'opinia' )|E] -30 u niego i -10 u pozostałych, tylko gdy coś się zmienia#!"
 MBQ_TBO_NO_GUAR: "Bez obowiązku dołączania do ich wojen"
 MBQ_TBO_TT_NO_GUAR: "#T Bez obowiązku dołączania do ich wojen#!\n• Zmniejsza obowiązek dołączania do ich wojen, gdzie gra pozwala"
 MBQ_TBO_TAX: "Wyższe podatki"
 MBQ_TBO_TT_TAX: "#T Wyższe podatki#!\n• Jeden stopień więcej [Concept( 'taxes', 'podatków' )|E] niż na początku, tylko jeśli gra na to pozwala"
 MBQ_TBO_PRESTIGE: "Więcej prestiżu"
 MBQ_TBO_TT_PRESTIGE: "#T Więcej prestiżu#!\n• Jeden stopień więcej transferu [Concept( 'prestige', 'prestiżu' )|E] niż na początku, tylko jeśli gra na to pozwala"
 MBQ_TBO_WAR: "Wspierają twoje wojny"
 MBQ_TBO_TT_WAR: "#T Wspierają twoje wojny#!\n• Nowy trybutariusz musi dołączać do twoich wojen, tylko jeśli gra na to pozwala"
 MBQ_VS_RULER_1: "władca"
 MBQ_VS_RULER_N: "władców"
 MBQ_VS_TT_RUN: "#T Uruchom teraz#!\n• Jednorazowo oferuje wasalstwo każdemu pasującemu władcy, który by się zgodził\n• Wyszarzone: nie ma komu oferować"
 MBQ_TB_TT_RUN: "#T Uruchom teraz#!\n• Jednorazowo żąda trybutu od każdego pasującego sąsiada, który by się zgodził\n• Wyszarzone: nie ma od kogo żądać"
 MBQ_VS_MANDALA: "Władcy mandali: oferowanie i żądanie wstrzymane."
 mbq_vs_sum_title: "Nowi wasale"
 mbq_vs_sum_desc: "Przyjęli wasalstwo: [ROOT.Var('mbq_vs_n').GetValue|0][ROOT.Char.Custom('mbq_vs_s1')][ROOT.Char.Custom('mbq_vs_s2')][ROOT.Char.Custom('mbq_vs_s3')][ROOT.Char.Custom('mbq_vs_s4')][ROOT.Char.Custom('mbq_vs_s5')][ROOT.Char.Custom('mbq_vs_more')]"
