l_simp_chinese:
 MBQ_VS_AUTO_HEAD: "自动化"
 MBQ_VS_TT_AUTO_HEAD: "#T 自动化#!\n• 提议和要求只会发给愿意接受的统治者\n• 他人向你的提议按下方所选接受"
 MBQ_VS_AUTO_VS: "@vassal_icon! 要求臣服"
 MBQ_VS_AUTO_TB: "@tributary_icon! 要求朝贡"
 MBQ_VS_TT_AUTO_VS: "#T 要求臣服#!\n• 向每位符合条件且会接受的统治者提出臣服，契约对你最有利\n• 仅在你的[vassal_limit|E]还有空位时进行"
 MBQ_VS_TT_AUTO_TB: "#T 要求朝贡#!\n• 像普通互动一样，向每位符合条件且会接受的邻国要求朝贡\n• #warning @prestige_icon! 与普通互动一样消耗[prestige|E]#!"
 MBQ_VS_TT_MIN_HEAD: "#T 契约#!\n• 用于提供臣服、接受效忠提议和接受朝贡提议\n• 要求朝贡时不使用"
 MBQ_VS_MIN_HIGH: "高"
 MBQ_VS_MIN_NORMAL: "普通"
 MBQ_VS_MIN_LOW: "低"
 MBQ_VS_TT_MIN_HIGH: "#T 高#!\n• 仅高档[obligations|E]\n• 他人向你的提议：只自动接受高档"
 MBQ_VS_TT_MIN_NORMAL: "#T 普通#!\n• 先高档，再普通档[obligations|E]\n• 他人向你的提议：高档和普通档自动接受"
 MBQ_VS_TT_MIN_LOW: "#T 低#!\n• 先高档，再普通档，再低档[obligations|E]\n• 他人向你的提议：所有提议都自动接受"
 MBQ_VS_WHO: "向以下对象提议臣服："
 MBQ_VS_TT_WHO: "#T 询问对象#!\n• 仅适用于臣服\n• 要求朝贡始终针对独立的邻国"
 MBQ_VS_NB: "独立的邻国"
 MBQ_VS_TRIB: "你的朝贡者"
 MBQ_VS_TT_NB: "#T 独立的邻国#!\n• 勾选：询问与你的[realm|E]相邻的独立统治者（隔水也算）"
 MBQ_VS_TT_TRIB: "#T 你的朝贡者#!\n• 勾选：也询问你自己的朝贡者"
 MBQ_VS_RANK: "至等级（含）"
 MBQ_VS_TT_RANK: "#T 至等级#!\n• 此等级以内的统治者会被询问，其提议自动接受\n• 皇帝永不被询问"
 MBQ_VS_EXCL_HEAD: "跳过这些统治者"
 MBQ_VS_TT_EXCL: "#T 例外#!\n• 勾选：自动化绝不询问这类统治者，也绝不接受他们的提议\n• 他们的提议照常送达"
 MBQ_VS_EX_RIVAL: "仇敌与死敌"
 MBQ_VS_EX_CLAIM: "对你头衔的宣称"
 MBQ_VS_EX_FAITH: "@religious_icon! 不同信仰"
 MBQ_VS_EX_FACTION: "@faction_icon! 派系领袖"
 MBQ_VS_TT_EX_RIVAL: "#T 仇敌与死敌#!\n• 该统治者是你的[rival|E]或[nemesis|E]"
 MBQ_VS_TT_EX_CLAIM: "#T 对你头衔的宣称#!\n• 该统治者对你伯爵级或更高的头衔拥有[claim|E]"
 MBQ_VS_TT_EX_FAITH: "#T 不同信仰#!\n• 该统治者的[faith|E]与你不同"
 MBQ_VS_TT_EX_FACTION: "#T 派系领袖#!\n• 该统治者领导着一个与你为敌的[faction|E]"
 MBQ_VS_PREVIEW: "立即臣服：[GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue|0][SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_vs_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )]，@vassal_icon! [GetPlayer.GetNumVassalsTowardsLimit]/[GetPlayer.GetVassalLimit]"
 MBQ_TB_PREVIEW: "立即朝贡：最多[GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue|0][SelectLocalization( EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('mbq_tb_prev_n').GetValue, '(CFixedPoint)1' ), 'MBQ_VS_RULER_1', 'MBQ_VS_RULER_N' )]"
 MBQ_TBO_HEAD: "朝贡契约意愿"
 MBQ_TBO_TT_HEAD: "#T 朝贡契约意愿#!\n• 此窗口产生的每个新[tributary|E]，在接受后会立即应用这些意愿\n• #warning @prestige_icon! 每个朝贡者一次消耗 150 [prestige|E]，对他[opinion|E] -30，对你其他朝贡者 -10，仅在有更改时#!"
 MBQ_TBO_NO_GUAR: "无须加入其战争"
 MBQ_TBO_TT_NO_GUAR: "#T 无须加入其战争#!\n• 在游戏允许的范围内，自动化会减轻你加入其战争的义务"
 MBQ_TBO_TAX: "更高赋税"
 MBQ_TBO_TT_TAX: "#T 更高赋税#!\n• 比初始多一档[taxes|E]，仅在游戏允许时"
 MBQ_TBO_PRESTIGE: "更多威望"
 MBQ_TBO_TT_PRESTIGE: "#T 更多威望#!\n• 比初始多一档[prestige|E]转移，仅在游戏允许时"
 MBQ_TBO_WAR: "他们支持你的战争"
 MBQ_TBO_TT_WAR: "#T 他们支持你的战争#!\n• 新的朝贡者必须加入你的战争，仅在游戏允许时"
 MBQ_VS_RULER_1: "名统治者"
 MBQ_VS_RULER_N: "名统治者"
 MBQ_VS_TT_RUN: "#T 立即运行#!\n• 向每位符合条件且会接受的统治者提出一次臣服\n• 灰色：没有可提议的对象"
